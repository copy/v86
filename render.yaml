services:
  - type: web
    name: v86
    runtime: node
    plan: free
    buildCommand: node --version
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
