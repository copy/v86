services:
  - type: web
    name: v86
    runtime: node
    plan: free
    buildCommand: npm install && bash download_images.sh
    startCommand: node server.js
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
