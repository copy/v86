name: CI

# The repository's checks: eslint, the builds, rustfmt and `make ci-tests`,
# the tests that need no disk images (the guest tests read images/, which
# this repository does not distribute: run them locally, see Readme.md).
# The site's deployment is pages.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      # (a fixed version: eslint.config.mjs's rules as the repository keeps them)
      - name: Run eslint
        run: npx --yes eslint@10.13.0 src tests gen lib examples tools

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt

      # (nasm: the CPU tests' guest programs)
      - name: Install APT packages
        run: |
          sudo apt-get update -y
          sudo apt-get install nasm -y

      - name: Cache crates
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Closure Compiler
        uses: actions/cache@v5
        with:
          path: closure-compiler/
          key: closure-compiler-v20210601

      - name: rustfmt check
        run: make rustfmt

      - name: Build all
        run: |
          rustc --version
          make all build/v86-fallback.wasm

      - name: Tests (no disk images)
        run: make ci-tests
