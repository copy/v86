<!doctype html>
<meta charset="utf-8">
<title>VM manager: the wizard and the settings dialog</title>
<!-- The VM manager's wizard and settings dialog (docs/vm-manager-plan.md U3), in a frame:
     part=freedos  the DOS preset from a floppy URL (images/freedos722.img), no hard disk: "Welcome to FreeDOS"
     part=linux    the 32-bit Linux preset from a CD URL (images/linux4.iso), a new disk in memory: the shell's "~%"
     part=arm64    the arm64 Linux preset, direct boot: Alpine's kernel, initrd and ISO (build/a64-linux/): "login:" on the serial console
     part=uefi     a machine of no preset edited to UEFI (OVMF, Q35) in the settings dialog, powered on: the UEFI Shell's
                   prompt on the serial console (bios/ovmf-code.fd through the CPU worker); a variable set in the Shell is
                   there at the next power-on (the machine's variable store, a browser disk written back), and gone after
                   the settings dialog's "Reset UEFI variables…"; with a TPM added there, OVMF's TCG2 protocol at each
                   power-on (the TPM plugin in the CPU worker, its state a browser disk), after "Clear TPM…" too
     part=secure_boot  a machine of no preset edited to UEFI on Q35 with Secure Boot (Microsoft's keys): the library's summary; powered
                   on through the CPU worker, the Secure Boot firmware's boot manager on the serial console (no bootable device)
     part=dialog   the settings dialog: arm64 makes the machine virt and says so, the choices it offers, ACPI fixed with its
                   reason, a problem shown on its panel and fixed, Add and Remove, Cancel keeps the configuration
     part=service  (with the runner's service=1) the disk service in Preferences, the wizard's new disk created there
     part=android  an Android image package (build/android-test-package.zip: tests/android/make_package.mjs) dropped on the
                   wizard: Cuttlefish's arm64 device, the Android 16 preset with gfxstream (I8.1), a browser disk made in the
                   importer's worker, the bootloader (src/android/bootloader.js) reading the disk's GPT and boot partitions
     part=android_gsi  the same package with a GSI (build/android-test-gsi.zip) dropped together; an older GSI refused; the disk's
                   vbmeta the GSI's (nothing chained)
     part=android_emulator  an Android Emulator image zip (build/android-test-emulator.zip) dropped on the wizard: the Android
                   7.1 (32-bit) preset, its disk made in the importer's worker, the bootloader giving its kernel, ramdisk and the
                   emulator's disks as partitions; the settings dialog's Android panel (no wipe)
     part=android_console  (local, a few minutes) the official package imported as android_boot does, powered on; once init's
                   second stage is on hvc0, the machine stopped and the console's Kernel console drawer opened: the log kept from before;
                   its keys to hvc0; the shell on the serial terminal (androidboot.console ttyAMA0) answering a command typed there;
                   the display at the device model's 720x1280
     part=android_service  (with the runner's service=1) the package imported into a new image of the disk service (I3.2):
                   its size, and the bootloader reading it from the service
     part=android_cancel  (local) the official zip's import cancelled: the wizard says so, the browser disk made so far is gone
     part=android_boot  (local, an hour or more) docs/android-images-plan.md I3's acceptance: the official Cuttlefish images zip
                   (package=<path>, build/a64-android/dl/aosp_cf_arm64_only_phone-img-15581820.zip) through the wizard, nothing
                   else filled in, powered on: init's sys.boot_completed=1 in the kernel's log (hvc0), then Android's screen in the
                   graphics proxy's compositor (the preset's gfxstream from the CPU worker, the renderer in the page);
                   timeout=<minutes> (180);
                   gsi=<path> also drops a GSI (I5.3), entry=<catalog id> the catalog's entry chosen (android16-cuttlefish; with
                   gsi= "", another package: the catalog lists one entry per Android version, android17-gsi-cp3a for the GSI it has)
     node tests/app/browser_runner.mjs tests/app/wizard_test.html part=freedos -->
<style>iframe { width: 1100px; height: 760px; border: 1px solid #888; }</style>
<pre id="log"></pre>
<pre id="result"></pre>
<script type="module">
const args = new URLSearchParams(location.search);
const part = args.get("part") || "freedos";
const lines = [];
const log = text => { lines.push(text); document.getElementById("log").textContent = lines.join("\n"); };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(condition, what, timeout = 30000)
{
    const end = Date.now() + timeout;
    for(;;)
    {
        const value = await condition();
        if(value) return value;
        if(Date.now() > end) throw new Error("timed out: " + what);
        await sleep(100);
    }
}
function check(condition, what) { if(!condition) throw new Error(what); }

async function open_frame(url)
{
    const frame = document.createElement("iframe");
    frame.src = url;
    document.body.append(frame);
    await new Promise(resolve => frame.onload = resolve);
    return frame;
}

let library, w, d;
const $ = selector => d.querySelector(selector);
const $$ = selector => Array.from(d.querySelectorAll(selector));
const button = (text, scope = d) => Array.from(scope.querySelectorAll("button")).find(b => b.textContent.trim() === text && !b.disabled);
const names = () => $$(".vm-list .vm-name").map(e => e.textContent);
/** set a field the way a person does: its value, then change */
function set(element, value)
{
    element.value = value;
    element.dispatchEvent(new w.Event("input", { bubbles: true }));
    element.dispatchEvent(new w.Event("change", { bubbles: true }));
}
/** A table's rows as "name value; name value" */
const table_text = table => Array.from(table.querySelectorAll("tr"), tr => Array.from(tr.children, c => c.textContent.trim()).join(" ")).join("; ");
const select_text = (element, text) => set(element, Array.from(element.options).find(o => o.textContent.startsWith(text)).value);

async function open_library()
{
    library = await open_frame("/index.html");
    w = library.contentWindow;
    d = library.contentDocument;
    await until(() => $(".library"), "the library");
    // (power on opens a tab: here, the address)
    w.open = url => { w.__opened = url; return null; };
}

/**
 * The wizard: the source (its radio's text and URLs), the preset, the name, the disk
 * @param {{source: string, urls: Object<string, string>, preset: string, name: string, disk: "none" | "memory" | "service", disk_mb?: number}} o
 */
async function wizard(o)
{
    $("#new_vm").click();
    const wizard = await until(() => $("dialog.wizard-dialog[open]"), "the wizard");
    Array.from(wizard.querySelectorAll("input[name=source]")).find(r => r.parentElement.textContent.trim().startsWith(o.source)).click();
    for(const [label, url] of Object.entries(o.urls))
    {
        // (an optional image starts as "None": its URL choice first)
        const source = await until(() => wizard.querySelector("select[aria-label=\"" + label + ": source\"]"), "the source of " + label);
        if(source.value !== "url") set(source, "url");
        const input = await until(() => wizard.querySelector("input[aria-label=\"" + label + ": URL\"]"), "the URL of " + label);
        set(input, url);
    }
    button("Next", wizard).click();
    (await until(() => wizard.querySelector("li[data-preset=" + o.preset + "]"), "the preset " + o.preset)).click();
    log("wizard: " + o.source + " " + JSON.stringify(o.urls) + ", preset " + wizard.querySelector(".preset-detail h3").textContent +
        " (" + wizard.querySelector(".preset-detail p").textContent.slice(0, 60) + "…)");
    button("Next", wizard).click();
    set(await until(() => wizard.querySelector("input[aria-label=Name]"), "the name"), o.name);
    button("Next", wizard).click();
    await until(() => wizard.querySelector("input[name=disk]"), "the disk step");
    if(o.disk === "none")
    {
        wizard.querySelector("input[name=disk][value=none]").click();
    }
    else
    {
        if(o.disk_mb) set(wizard.querySelector("input[aria-label='Disk size in MB']"), String(o.disk_mb));
        const location = await until(() => wizard.querySelector("input[name=location][value=" + o.disk + "]"), "the location");
        check(!location.disabled, "the location " + o.disk + " can be chosen");
        location.click();
    }
    button("Next", wizard).click();
    const summary = table_text(await until(() => wizard.querySelector(".wizard-body table.hardware"), "the summary"));
    button("Finish", wizard).click();
    await until(() => names().includes(o.name), "the new machine in the library");
    return summary;
}

/** Power on the selected machine: its console in another frame; its emulator */
/** The colours of the emulator's screenshot (every 97th pixel, up to 1000) */
async function screen_colours(emulator)
{
    const image = emulator.screen_make_screenshot();
    if(!image) return { colours: 0 };
    await image.decode().catch(() => {});
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    if(!canvas.width || !canvas.height) return { colours: 0 };
    const context = canvas.getContext("2d");
    context.drawImage(image, 0, 0);
    const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
    const colours = new Set();
    for(let i = 0; i < data.length && colours.size < 1000; i += 4 * 97) colours.add(data[i] << 16 | data[i + 1] << 8 | data[i + 2]);
    return { width: canvas.width, height: canvas.height, colours: colours.size };
}

/**
 * Where the display stands on the page: the adapter's renderer (GX's
 * surfaces, VX), the graphics proxy's compositor and its layers, the
 * console's canvases (the bundle's own names are compiled: the glbridge
 * objects are found by their shape)
 */
function display_state(frame, emulator)
{
    const values = Object.values(emulator).filter(v => v && typeof v === "object");
    const renderer = values.find(v => "executor" in v && "idle" in v);
    const plugins = values.find(v => Array.isArray(v) && v.some(p => p && p.bridge));
    const compositor = plugins && plugins.map(p => p.bridge && p.bridge.compositor).find(Boolean);
    const canvases = Array.from(frame.contentDocument.querySelectorAll("canvas"), c => c.width + "x" + c.height +
        (c.offsetParent === null ? " hidden" : ""));
    return "renderer " + (renderer ? "gx " + (renderer.gx ? renderer.gx.surfaces.size + " surfaces" : "none") + ", vx " + (renderer.vx ? "yes" : "no") : "none") +
        "; compositor " + (compositor ? (compositor.attached ? "attached" : "detached") + ", layers " +
            (compositor.layers.map(l => (l.visible ? "shown " : "hidden ") + l.canvas.width + "x" + l.canvas.height).join(" ") || "none") : "none") +
        "; canvases " + (canvases.join(", ") || "none");
}

async function power_on()
{
    w.__opened = undefined;
    $("#power_on").click();
    const url = await until(() => w.__opened, "power on");
    const frame = await open_frame(new URL(url, w.location.href).href);
    const emulator = await until(() => frame.contentWindow.v86_console?.emulator, "the console's emulator", 60000);
    return { frame, emulator };
}

/**
 * The official package (package=, gsi=, entry= as android_boot's) through the
 * wizard, nothing else filled in, imported: the machine in the library
 * @return {Promise<number>} when the files were dropped
 */
async function import_android()
{
    const urls = ["/" + (args.get("package") || "build/a64-android/dl/aosp_cf_arm64_only_phone-img-15581820.zip"),
        ...(args.get("gsi") ? ["/" + args.get("gsi")] : [])];
    const entry = args.has("entry") ? args.get("entry") : args.get("gsi") ? "" : "android16-cuttlefish";
    await open_library();
    $("#new_vm").click();
    const wizard = await until(() => $("dialog.wizard-dialog[open]"), "the wizard");
    Array.from(wizard.querySelectorAll("input[name=source]")).find(r => r.parentElement.textContent.trim().startsWith("An Android image package")).click();
    (await until(() => wizard.querySelector("input[name=catalog][value='" + entry + "']"), "the catalog's entry " + entry)).click();
    const started = Date.now();
    const input = await until(() => wizard.querySelector("input[aria-label='Android image package']"), "the package's input");
    const files = new w.DataTransfer();
    for(const url of urls) files.items.add(new w.File([await (await fetch(url)).blob()], url.split("/").pop(), { type: "application/zip" }));
    input.files = files.files;
    input.dispatchEvent(new w.Event("change", { bubbles: true }));
    log("package: " + await until(() => /Cuttlefish arm64 device/.test(wizard.querySelector(".drop-zone [role=status]")?.textContent) &&
        wizard.querySelector(".drop-zone [role=status]").textContent, "the package read", 120000));
    // (the catalog's SHA-256 checks)
    await until(() => button("Next", wizard), "the files checked: " + wizard.querySelector(".wizard-status").textContent, 600000);
    if(entry) log("checked against the catalog's " + entry + " in " + ((Date.now() - started) / 1000).toFixed(0) + " s");
    button("Next", wizard).click();
    await until(() => wizard.querySelector("li[data-preset=android16][aria-selected=true]"), "the Android 16 preset chosen");
    button("Next", wizard).click();
    const machine = args.get("gsi") ? "Android GSI (official)" : "Android 16 (official)";
    set(await until(() => wizard.querySelector("input[aria-label=Name]"), "the name"), machine);
    button("Next", wizard).click();
    await until(() => wizard.querySelector("input[name=userdata][value='4']:checked"), "the usual userdata");
    button("Next", wizard).click();
    log("summary: " + table_text(await until(() => wizard.querySelector(".wizard-body table.hardware"), "the summary")));
    const import_started = Date.now();
    button("Finish", wizard).click();
    await until(() => names().includes(machine), "the imported machine in the library", 1800000);
    log("imported in " + ((Date.now() - import_started) / 1000).toFixed(0) + " s");
    return started;
}

const parts = {
    async freedos()
    {
        await open_library();
        const summary = await wizard({ source: "A floppy image", urls: { "Floppy image": "images/freedos722.img" }, preset: "dos", name: "FreeDOS (wizard)", disk: "none" });
        check(/Memory 64 MB/.test(summary) && /Floppy \(fda\) images\/freedos722\.img/.test(summary) && !/Hard disk/.test(summary), "the summary: " + summary);
        check(/Memory 64 MB/.test(table_text($(".hardware"))), "the library's summary");
        log("library: " + names().join(", "));
        const { emulator } = await power_on();
        check(await emulator.wait_until_vga_screen_contains("Welcome to FreeDOS", { timeout_msec: 120000 }), "FreeDOS's welcome");
        log("power on: \"Welcome to FreeDOS\"");
        await emulator.destroy();
    },
    async linux()
    {
        await open_library();
        const summary = await wizard({ source: "A CD or DVD image", urls: { "CD image": "images/linux4.iso" }, preset: "linux", name: "Linux 4 (wizard)",
            disk: "memory", disk_mb: 64 });
        check(/Memory 512 MB/.test(summary) && /CD\/DVD images\/linux4\.iso/.test(summary) && /Hard disk \(hda\) empty disk in memory, 64 MB/.test(summary) &&
            /ACPI/.test(summary), "the summary: " + summary);
        const { emulator } = await power_on();
        check(await emulator.wait_until_vga_screen_contains("~%", { timeout_msec: 240000 }), "Linux's shell");
        log("power on: Linux 4 boots to its shell (\"~%\")");
        await emulator.destroy();
    },
    async arm64()
    {
        await open_library();
        const base = "build/a64-linux/";
        const summary = await wizard({ source: "A kernel and initrd", urls: { "Kernel": base + "boot/vmlinuz-virt", "Initrd": base + "boot/initramfs-virt",
            "The system's CD (optional)": base + "alpine-virt-3.24.0-aarch64.iso" }, preset: "linux_arm64", name: "Alpine arm64 (wizard)", disk: "none" });
        check(/Processor arm64, 4 cores/.test(summary) && /Machine virt/.test(summary) && /Direct boot kernel/.test(summary) && /Display virtio-gpu/.test(summary),
            "the summary: " + summary);
        const { emulator } = await power_on();
        let serial = "";
        emulator.add_listener("serial0-output-byte", byte => { serial += String.fromCharCode(byte); });
        await until(() => /login:/.test(serial), "Alpine's login on the serial console", 300000);
        log("power on: Alpine arm64 boots to \"" + serial.trim().split("\n").pop().trim() + "\"");
        await emulator.destroy();
    },
    async uefi()
    {
        await open_library();
        await wizard({ source: "Install the system later", urls: {}, preset: "other", name: "UEFI", disk: "none" });
        $("#edit_vm").click();
        const dialog = await until(() => $("dialog.settings-dialog[open]"), "the settings dialog");
        const item = id => dialog.querySelector("li[data-item=" + id + "]");
        const panel = () => dialog.querySelector(".settings-panel");
        item("machine").click();
        select_text(panel().querySelector("select[aria-label=Machine]"), "Q35");
        select_text(panel().querySelector("select[aria-label=Firmware]"), "UEFI (OVMF)");
        await until(() => /UEFI is OVMF/.test(panel().textContent), "the UEFI note");
        select_text(dialog.querySelector("select[aria-label='Add hardware']"), "TPM");
        await until(() => item("tpm") && item("tpm").classList.contains("selected"), "the TPM added");
        button("Save", dialog).click();
        await until(() => !$("dialog.settings-dialog[open]"), "saved");
        const VARIABLE = "V86Test -guid 2c94c1ab-37b4-4d11-9a3f-5fd77b0d5e8a";
        // powered on to the Shell: { frame, emulator, command }
        const shell = async () =>
        {
            const { frame, emulator } = await power_on();
            let serial = "";
            emulator.add_listener("serial0-output-byte", byte => { serial += String.fromCharCode(byte); });
            const plain = () => serial.replace(/\x1b\[[0-9;=?]*[A-Za-z]/g, "").replace(/\r/g, "");
            await until(() => /Shell> $/.test(plain()), "the UEFI Shell on the serial console", 180000);
            check(/UEFI Interactive Shell v2\.2/.test(serial), "the Shell's banner");
            const command = async text =>
            {
                serial = "";
                for(const chr of text + "\r")
                {
                    emulator.serial0_send(chr);
                    await new Promise(resolve => setTimeout(resolve, 20));
                }
                await until(() => /Shell> $/.test(plain()), JSON.stringify(text), 60000);
                return plain();
            };
            return { frame, emulator, command };
        };
        // (powered off: the variable store flushed, the machine's lock and the store's handle let go)
        const power_off = async ({ frame, emulator }) => { await emulator.destroy(); frame.remove(); };

        // (OVMF's TCG2 protocol: it found the TPM, through the plugin the CPU worker loaded)
        const tcg2 = async machine => /^\s*[0-9A-F]+: Tcg2\s*$/m.test(await machine.command("dh -p Tcg2"));
        let machine = await shell();
        log("power on: OVMF on Q35 to \"Shell>\" on the serial console");
        check(await tcg2(machine), "OVMF's TCG2 protocol: the TPM found");
        log("the TPM: OVMF's TCG2 protocol installed");
        await machine.command("setvar " + VARIABLE + " -nv -bs -rt =L\"v86\"");
        check(/76 00 38 00 36 00/.test(await machine.command("setvar " + VARIABLE)), "the variable set");
        await power_off(machine);
        machine = await shell();
        check(/76 00 38 00 36 00/.test(await machine.command("setvar " + VARIABLE)), "the variable at the next power-on");
        log("a variable set in the Shell: there at the next power-on");
        // (a TPM state the plugin refused would leave OVMF without a TPM)
        check(await tcg2(machine), "the TPM at the next power-on, from its kept state");
        log("the TPM at the next power-on, from the state the first one kept");
        await power_off(machine);

        // (back in the library's tab: it reads the machines again, the variable store the console made)
        w.dispatchEvent(new Event("focus"));
        await new Promise(resolve => setTimeout(resolve, 500));
        $("#edit_vm").click();
        const again = await until(() => $("dialog.settings-dialog[open]"), "the settings dialog");
        again.querySelector("li[data-item=machine]").click();
        const reset = await until(() => button("Reset UEFI variables…", again), "the reset button");
        reset.click();
        const ask = await until(() => $$("dialog[open]").find(e => /Reset UEFI variables\?/.test(e.textContent)), "the question");
        button("Reset", ask).click();
        const status = await until(() => /^Reset|^Not reset/.test(again.querySelector(".settings-panel [role=status]").textContent) &&
            again.querySelector(".settings-panel [role=status]").textContent, "the reset");
        check(/^Reset/.test(status), status);
        again.querySelector("li[data-item=tpm]").click();
        const clear = await until(() => button("Clear TPM…", again), "Clear TPM… (the state made)");
        clear.click();
        const sure = await until(() => $$("dialog[open]").find(e => /Clear the TPM\?/.test(e.textContent)), "the question");
        button("Clear", sure).click();
        const cleared = await until(() => /^Cleared|^Not cleared/.test(again.querySelector(".settings-panel [role=status]").textContent) &&
            again.querySelector(".settings-panel [role=status]").textContent, "the clear");
        check(/^Cleared/.test(cleared), cleared);
        button("Cancel", again).click();
        machine = await shell();
        check(!/76 00 38 00 36 00/.test(await machine.command("setvar " + VARIABLE)), "the variable gone after the reset");
        log("Reset UEFI variables: the variable gone at the next power-on");
        check(await tcg2(machine), "a new TPM after Clear TPM…");
        log("Clear TPM…: a new TPM at the next power-on");
        await power_off(machine);
    },
    async secure_boot()
    {
        await open_library();
        await wizard({ source: "Install the system later", urls: {}, preset: "other", name: "Secure Boot", disk: "none" });
        $("#edit_vm").click();
        const dialog = await until(() => $("dialog.settings-dialog[open]"), "the settings dialog");
        const panel = () => dialog.querySelector(".settings-panel");
        dialog.querySelector("li[data-item=machine]").click();
        select_text(panel().querySelector("select[aria-label=Machine]"), "Q35");
        select_text(panel().querySelector("select[aria-label=Firmware]"), "UEFI (OVMF)");
        const box = await until(() => Array.from(panel().querySelectorAll("label.check")).find(l => /^Secure Boot/.test(l.textContent.trim())),
            "the Secure Boot switch");
        check(!box.querySelector("input").disabled, "Secure Boot available on Q35");
        box.querySelector("input").click();
        const keys = await until(() => panel().querySelector("select[aria-label='Secure Boot keys']"), "the keys");
        check(/^Microsoft/.test(keys.selectedOptions[0].textContent), "Microsoft's keys by default: " + keys.selectedOptions[0].textContent);
        button("Save", dialog).click();
        await until(() => !$("dialog.settings-dialog[open]"), "saved");
        await until(() => /Secure Boot/.test(table_text($(".hardware"))), "the library showing Secure Boot");
        log("Secure Boot: on Q35 with UEFI, Microsoft's keys");

        // powered on (the Secure Boot firmware, its store's flash SMM's, through the CPU worker): no disk, the boot manager says so
        const { frame, emulator } = await power_on();
        let serial = "";
        emulator.add_listener("serial0-output-byte", byte => { serial += String.fromCharCode(byte); });
        const plain = () => serial.replace(/\x1b\[[0-9;=?]*[A-Za-z]/g, "").replace(/\r/g, "");
        await until(() => /BdsDxe: No bootable option or device was found/.test(plain()), "the boot manager on the serial console", 180000);
        log("power on: the Secure Boot firmware's boot manager (no bootable device)");
        await emulator.destroy();
        frame.remove();
    },
    async dialog()
    {
        await open_library();
        await wizard({ source: "Install the system later", urls: {}, preset: "other", name: "To edit", disk: "memory", disk_mb: 32 });
        const before = JSON.stringify(names());
        $("#edit_vm").click();
        let dialog = await until(() => $("dialog.settings-dialog[open]"), "the settings dialog");
        const item = id => dialog.querySelector("li[data-item=" + id + "]");
        const panel = () => dialog.querySelector(".settings-panel");
        const items = () => Array.from(dialog.querySelectorAll(".hardware-list li"), li => li.dataset.item);
        check(JSON.stringify(items()) === JSON.stringify(["general", "memory", "processor", "machine", "disk-0", "cdrom", "network-0", "sound", "display", "serial", "advanced"]),
            "the hardware list: " + items());

        // the CPU: arm64 makes the machine virt, said in the notes
        item("processor").click();
        select_text(panel().querySelector("select[aria-label=CPU]"), "arm64");
        await until(() => /Machine: virt/.test(dialog.querySelector(".settings-notes").textContent), "the note");
        log("arm64: " + dialog.querySelector(".settings-notes").textContent);
        // the CPU model: automatic and arm64's own (the regression-only ones left out), with what the chosen one is for
        const models = () => Array.from(panel().querySelector("select[aria-label='CPU model']").options, o => o.textContent);
        check(JSON.stringify(models()) === JSON.stringify(["Automatic (the system decides)", "Generic 64-bit ARM (recommended)",

        const read = async (offset, length) => new Uint8Array(await (await fetch(url, { headers: { Range: "bytes=" + offset + "-" + (offset + length - 1) } })).arrayBuffer());
        const boot = await android_bootloader(read, image.size, { memory_mb: 1536 });
        check(boot.kernel.length === 8192 && /console=hvc0/.test(boot.cmdline), "the bootloader on the service's image");
        check(/read write/.test(table_text($(".hardware"))) && table_text($(".hardware")).includes(image.name), "the machine's disk: " + table_text($(".hardware")));
        log("the disk service's image " + image.name + " (" + image.size + " bytes): the bootloader gives " + boot.kernel.length + " bytes of kernel, cmdline " + boot.cmdline);
    },
    async android_cancel()
    {
        await open_library();
        const disks = async () =>
        {
            let dir = await w.navigator.storage.getDirectory();
            for(const name of ["v86", "disks"]) dir = await dir.getDirectoryHandle(name, { create: true });
            const list = [];
            for await (const [name] of dir.entries()) if(name.endsWith(".img")) list.push(name);
            return list;
        };
        const before = await disks();
        $("#new_vm").click();
        const wizard = await until(() => $("dialog.wizard-dialog[open]"), "the wizard");
        Array.from(wizard.querySelectorAll("input[name=source]")).find(r => r.parentElement.textContent.trim().startsWith("An Android image package")).click();
        (await until(() => wizard.querySelector("input[name=catalog][value='']"), "the catalog")).click();
        const input = await until(() => wizard.querySelector("input[aria-label='Android image package']"), "the package's input");
        const files = new w.DataTransfer();
        files.items.add(new w.File([await (await fetch("/build/a64-android/dl/aosp_cf_arm64_only_phone-img-15581820.zip")).blob()], "aosp_cf_arm64_only_phone-img-15581820.zip"));
        input.files = files.files;
        input.dispatchEvent(new w.Event("change", { bubbles: true }));
        await until(() => button("Next", wizard), "the package read", 120000);
        for(let i = 0; i < 3; i++) { button("Next", wizard).click(); await sleep(200); }
        button("Next", wizard).click();
        await until(() => button("Finish", wizard), "the summary");
        button("Finish", wizard).click();
        await until(() => /Importing .*: \d+%/.test(wizard.querySelector(".wizard-status").textContent), "the import going on", 60000);
        button("Cancel import", wizard).click();
        await until(() => /cancelled/.test(wizard.querySelector(".wizard-status").textContent), "the import cancelled");
        check(button("Finish", wizard), "the wizard back to its buttons");
        await until(async () => JSON.stringify(await disks()) === JSON.stringify(before), "the browser disk made so far deleted", 10000);
        log("cancelled: " + wizard.querySelector(".wizard-status").textContent + "; the browser disks as before (" + before.length + ")");
    },
    async android_boot()
    {
        const started = await import_android();
        const { frame, emulator } = await power_on();
        const booted = Date.now();
        let kernel = "";
        const milestones = [["second stage", /init: init second stage started/], ["zygote", /starting service 'zygote'/], ["system_server", /starting service 'system_server'|SystemServer/],
            ["boot_completed", /init: processing action \(sys\.boot_completed=1\)/]];
        const seen = new Set();
        emulator.add_listener("virtio-console0-output-bytes", bytes =>
        {
            kernel = (kernel + String.fromCharCode.apply(null, Array.from(bytes))).slice(-8192);
            for(const [what, pattern] of milestones) if(!seen.has(what) && pattern.test(kernel)) { seen.add(what); log(((Date.now() - booted) / 1000).toFixed(0) + " s: " + what); }
            if(/reboot: Restarting system with command 'bootloader'/.test(kernel)) seen.add("failed");
        });
        await until(() => seen.has("boot_completed") || seen.has("failed"), "sys.boot_completed=1 in the kernel's log", (+args.get("timeout") || 180) * 60000);
        check(!seen.has("failed"), "init rebooted into the bootloader: " + kernel.slice(-1500));
        log("boot_completed " + ((Date.now() - booted) / 1000).toFixed(0) + " s after power on (" + ((Date.now() - started) / 60000).toFixed(1) + " min in all)");
        // (the preset's GPU, gfxstream: the machine in the CPU worker, the renderer in this page draws what the
        // guest's GPU drew into the graphics proxy's compositor, the lock screen at least: a screen of the
        // display's size (the page's, which the guest takes), not the text screen it starts as (720x400)
        let last = "", noted = 0;
        const shown = await until(async () =>
        {
            const s = await screen_colours(emulator);
            const what = s.width + "x" + s.height + ", " + s.colours + " colours";
            if(what !== last && Date.now() - noted > 60000)
            {
                log(((Date.now() - booted) / 1000).toFixed(0) + " s: the screen " + what + "; " + display_state(frame, emulator));
                noted = Date.now();
            }
            last = what;
            return !(s.width === 720 && s.height === 400) && s.colours >= 64 && s;
        }, "the screen drawn by the guest's GPU (the log has what it showed)", 30 * 60000);
        log("the screen " + ((Date.now() - booted) / 1000).toFixed(0) + " s after power on: " + shown.width + "x" + shown.height + ", " +
            shown.colours + " colours (sampled)");
        await emulator.destroy();
    },
    async android_console()
    {
        await import_android();
        const { frame, emulator } = await power_on();
        const booted = Date.now();
        let kernel = "";
        emulator.add_listener("virtio-console0-output-bytes", bytes => { kernel = (kernel + String.fromCharCode.apply(null, Array.from(bytes))).slice(-65536); });
        await until(() => /init: init second stage started/.test(kernel), "init's second stage on hvc0", 600000);
        // (the machine stopped, the drawer opened: what it shows was printed before, kept from power on)
        await emulator.stop();
        log(((Date.now() - booted) / 1000).toFixed(0) + " s: init's second stage; stopped, the kernel console opened");
        const c = frame.contentDocument, cw = frame.contentWindow;
        c.querySelector("#drawer_kernel").click();
        const rows = await until(() => c.querySelector(".console-drawer .terminal .xterm-rows"), "the kernel console (xterm)", 30000);
        const shown = await until(() => /\[\s*\d+\.\d+\]/.test(rows.textContent) && rows.textContent.replace(/\s+/g, " ").trim(),
            "the kernel's log kept from before the drawer opened", 10000);
        log("kernel console, kept from before: " + shown.slice(0, 160));
        await emulator.run();
        // (keys typed in it go to hvc0, which Android only writes: its shell is on the serial port, androidboot.console ttyAMA0)
        const typed = [];
        const send = emulator.virtio_console_send;
        emulator.virtio_console_send = data => { typed.push(data); send.call(emulator, data); };
        const type_in = (selector, text) => c.querySelector(selector).dispatchEvent(new cw.InputEvent("input", { data: text, inputType: "insertText", bubbles: true }));
        type_in(".console-drawer .xterm-helper-textarea", "x");
        check(typed.join("") === "x", "the kernel console's keys to hvc0: " + JSON.stringify(typed));
        // (the serial terminal: the shell a userdebug build runs there, a command typed and answered)
        c.querySelector("#drawer_terminal").click();
        const serial_rows = await until(() => c.querySelector(".console-drawer .terminal .xterm-rows"), "the serial terminal (xterm)", 30000);
        const asked = Date.now();
        let answered = false;
        while(!answered && Date.now() - asked < 900000)
        {
            type_in(".console-drawer .xterm-helper-textarea", "echo v86-$((6*7))");
            type_in(".console-drawer .xterm-helper-textarea", "\r");
            answered = await until(() => /v86-42/.test(serial_rows.textContent), "", 20000).catch(() => false);
        }
        check(answered, "the shell's answer in the serial terminal: " + serial_rows.textContent.replace(/\s+/g, " ").slice(-300));
        log("serial terminal: typed echo v86-$((6*7)), the shell answered v86-42 (" + ((Date.now() - booted) / 1000).toFixed(0) + " s)");
        // (the display: the device model's 720x1280, the screen zoomed to the window; not a display of the window's size)
        await until(() => /Graphics 720×1280/.test(c.body.textContent), "the display at the device's 720×1280", 900000);
        log("display: 720×1280, the device's (" + ((Date.now() - booted) / 1000).toFixed(0) + " s)");
        await emulator.destroy();
    },
    async service()
    {
        const service = args.get("service");
        check(service, "the runner's disk service (service=1)");
        await open_library();
        $("#preferences").click();
        const prefs = await until(() => $("dialog[open]"), "the preferences");
        set(prefs.querySelector("input[aria-label='Disk service URL']"), service);
        button("Test", prefs).click();
        await until(() => /A disk service: 1 images, creates new ones/.test(prefs.textContent), "the test of the service");
        button("Save", prefs).click();
        await until(() => $("#service_status").textContent === "Disk service: " + service, "the library using the disk service");
        log("Preferences: " + service + ", tested; the library shows it");
        const summary = await wizard({ source: "A CD or DVD image", urls: { "CD image": "images/linux4.iso" }, preset: "linux", name: "Kept disk", disk: "service", disk_mb: 16 });
        check(/read write/.test(summary) || /created when finished/.test(summary), "the summary: " + summary);
        const files = await (await fetch("/__service_files")).json();
        const kept = files.find(f => f.name === "kept-disk.img");
        check(files.length === 2 && kept && kept.size === 16 << 20, "the service's files: " + JSON.stringify(files));
        const table = await until(() => table_text($(".hardware")).includes(service + "kept-disk.img") && table_text($(".hardware")), "the machine's disk");
        check(/read write/.test(table), "the machine's disk: " + table);
        log("the wizard's new disk: " + kept.name + " (" + kept.size + " bytes) in the service's directory, read write");
    },
};

parts[part]().then(() =>
{
    document.getElementById("result").textContent = "PASS (" + part + ")\n" + lines.join("\n");
}, e =>
{
    document.getElementById("result").textContent = "FAIL (" + part + "): " + (e.stack || e.message) + "\n" + lines.join("\n");
});
</script>
