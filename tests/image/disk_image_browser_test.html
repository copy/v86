<!doctype html><meta charset="utf-8"><title>Disk images in the browser</title>
<div id="screen"><div style="white-space: pre; font: 14px monospace; line-height: 14px"></div><canvas style="display: none"></canvas></div>
<pre id="result">RUNNING</pre>
<script type="module">
// docs/disk-image-formats-plan.md ("运行入口"): a QCOW2 disk read with HTTP
// Range requests, on the page (worker=0) or in the CPU Worker (worker=1):
// MS-DOS boots from it, writes a file, the file is there after a snapshot
// restored; an image that is not of its format fails the start
// (emulator-error), in the Worker too; disks of 4096-byte sectors. Run by
// tests/image/browser_runner.mjs.
import { V86 } from "../../build/libv86.mjs";
const params = new URLSearchParams(location.search);
const worker = params.get("worker") === "1";
const log = [];
const result = document.getElementById("result");
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const config = (hda, hdb) => ({
    wasm_path: "../../build/v86.wasm", cpu_worker: worker, cpu_worker_url: "../../build/cpu-worker.js",
    bios: { url: "../../bios/seabios.bin" }, vga_bios: { url: "../../bios/vgabios.bin" },
    graphics_adapter: "bochs_vga", graphics_adapter_path: "../../build/v86-bochs-vga.js",
    hda, hdb, memory_size: 32 << 20, autostart: true, disable_speaker: true,
    screen: { container: document.getElementById("screen") },
});
const screen = vm => (vm.screen_adapter ? vm.screen_adapter.get_text_screen() : []).map(l => l.replace(/\x00/g, " "));
async function until(condition, what, timeout = 120000)
{
    const end = performance.now() + timeout;
    while(!condition())
    {
        if(performance.now() > end) throw new Error("timeout: " + what + "\n" + screen(vm_current).join("\n"));
        await sleep(100);
    }
}
let vm_current;
async function dos(vm, command)
{
    await vm.keyboard_send_text("cls\n", 20);
    await until(() => { const l = screen(vm).filter(x => x.trim()); return l.length === 1 && l[0].startsWith("C:\\>"); }, "cls");
    await vm.keyboard_send_text(command + "\n", 20);
    await until(() => screen(vm).filter(x => x.startsWith("C:\\>")).length >= 2, command);
    return screen(vm).join("\n");
}
try
{
    // hdb (with the samples): a compressed child, its parent given as backing
    const hdb = params.get("child_sha256") ? { url: "../../build/disk-image-browser/child-zlib.qcow2", async: true, format: "qcow2",
        backing: { url: "../../build/disk-image-browser/v3-zstd.qcow2", async: true } } : undefined;
    const vm = vm_current = new V86(config({ url: "../../build/disk-image-browser/msdos622.qcow2", async: true, format: "qcow2" }, hdb));
    await new Promise((resolve, reject) => { vm.add_listener("emulator-loaded", resolve); vm.add_listener("emulator-error", reject); });
    if(worker && vm.v86) throw new Error("the machine is on the page, not in the Worker");
    // (the prompt alone on its line for a second: AUTOEXEC.BAT is done)
    let stable = 0;
    await until(() => { const l = screen(vm).filter(x => x.trim()); stable = l.length && l[l.length - 1].trim() === "C:\\>" ? stable + 1 : 0; return stable >= 10; }, "C:\\>");
    log.push("C:\\> from the QCOW2 disk over HTTP Range (" + (worker ? "CPU Worker" : "page") + ")");
    // export (P2): before the guest writes, MS-DOS's disk as it is
    const exported = async () =>
    {
        const parts = [];
        let progress = 0;
        const size = await vm.export_disk_image("hda", { write: async chunk => { parts.push(chunk); await sleep(0); },
            progress: p => { progress = p.loaded / p.total; } });
        const blob = new Blob(parts);
        if(blob.size !== size || progress !== 1) throw new Error("export: " + blob.size + " bytes, " + size + " reported, progress " + progress);
        return new Uint8Array(await blob.arrayBuffer());
    };
    const hex = async bytes => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), b => b.toString(16).padStart(2, "0")).join("");
    const info = await vm.disk_image_info("hda");
    const first = await exported();
    if(await hex(first) !== params.get("raw_sha256") && info.written === 0) throw new Error("the export is not msdos622.img");
    log.push("export_disk_image: " + first.length + " bytes (" + info.format + ", " + info.written + " bytes written before)");
    // the same image as a File (a disk the user picks): read with
    // FileReaderSync in the Worker, FileReader on the page
    {
        const blob = await (await fetch("../../build/disk-image-browser/msdos622.qcow2")).blob();
        const file_vm = vm_current = new V86({ ...config({ buffer: new File([blob], "msdos622.qcow2"), format: "auto" }), autostart: false });
        await new Promise((resolve, reject) => { file_vm.add_listener("emulator-loaded", resolve); file_vm.add_listener("emulator-error", reject); });
        const parts = [];
        await file_vm.export_disk_image("hda", { write: chunk => { parts.push(chunk); } });
        if(await hex(await new Blob(parts).arrayBuffer()) !== params.get("raw_sha256")) throw new Error("the File's disk is not msdos622.img");
        await file_vm.destroy();
        vm_current = vm;
        log.push("a File (format auto): the disk is msdos622.img");
    }
    // a new QCOW2 image of it: checked and compared by the runner (qemu-img)
    {
        const parts = [];
        const size = await vm.export_disk_image("hda", { format: "qcow2", write: chunk => { parts.push(chunk); } });
        const response = await fetch("/__test_file?name=hda-" + (worker ? "worker" : "page") + ".qcow2", { method: "POST", body: new Blob(parts) });
        if(!response.ok) throw new Error("the runner did not take the QCOW2 export");
        log.push("export_disk_image (qcow2): " + size + " bytes, sent to the runner");
    }
    if(hdb)
    {
        const parts = [];
        await vm.export_disk_image("hdb", { write: chunk => { parts.push(chunk); } });
        if(await hex(await new Blob(parts).arrayBuffer()) !== params.get("child_sha256")) throw new Error("hdb: not the RAW of qemu-img");
        log.push("hdb: a compressed QCOW2 child on a parent with Zstandard clusters, as qemu-img reads it");
    }
    await dos(vm, "echo BROWSER > C:\\BROWSER.TXT");
    if(!/^BROWSER\s*$/m.test(await dos(vm, "type C:\\BROWSER.TXT"))) throw new Error("the file written is not there");
    log.push("the guest wrote a file");
    const second = await exported();
    const text = new TextDecoder("latin1").decode(second);
    if(!text.includes("BROWSER \r\n")) throw new Error("the export has not the file's data");
    log.push("the export after the write has the file");
    const state = await vm.save_state();
    await dos(vm, "del C:\\BROWSER.TXT");
    await vm.restore_state(state);
    if(!/^BROWSER\s*$/m.test(await dos(vm, "type C:\\BROWSER.TXT"))) throw new Error("the file is not there after the restore");
    log.push("a snapshot restored has the file");
    await vm.destroy();

    const bad = vm_current = new V86(config({ url: "../../build/disk-image-browser/not-qcow2.qcow2", async: true, format: "qcow2" }));
    const error = await Promise.race([new Promise(resolve => bad.add_listener("emulator-error", resolve)),
        new Promise(resolve => bad.add_listener("emulator-loaded", () => resolve(null))), sleep(30000).then(() => "timeout")]);
    if(!error || error === "timeout" || !/not a qcow2 image/.test(error.message)) throw new Error("no emulator-error for a bad image: " + (error && error.message || error));
    log.push("an image that is not of its format: emulator-error \"" + error.message + "\"");
    try { await bad.destroy(); } catch(e) {}

    // 4096-byte logical sectors (the plan's appendix): a RAW disk's
    // logical_sector_size and a VHDX image's own reach the drives (in the
    // Worker: the option crosses with the descriptor)
    {
        const { build_vhdx } = await import("./tiny_vhdx.mjs");
        const vhdx = build_vhdx({ size: 8 << 20, logical_sector_size: 4096, data: [[0, new Uint8Array(4096).fill(0x4B)]] });
        const sector_vm = vm_current = new V86({ ...config({ buffer: new ArrayBuffer(8 << 20), logical_sector_size: 4096 },
            { buffer: vhdx.image.buffer, format: "vhdx" }), autostart: false });
        await new Promise((resolve, reject) => { sector_vm.add_listener("emulator-loaded", resolve); sector_vm.add_listener("emulator-error", reject); });
        const sizes = [(await sector_vm.disk_image_info("hda")).logical_sector_size, (await sector_vm.disk_image_info("hdb")).logical_sector_size];
        if(sizes[0] !== 4096 || sizes[1] !== 4096) throw new Error("logical sectors: " + sizes.join(", "));
        await sector_vm.destroy();
        log.push("4096-byte logical sectors: a RAW disk's logical_sector_size and a VHDX image's own");
    }

    // an OVA (with the samples): V86.import_ova on the page, the disk read in
    // the archive (in the Worker: archive_member crosses with the descriptor)
    if(params.get("base_sha256"))
    {
        const imported = await V86.import_ova({ url: "../../build/disk-image-browser/dos.ova", async: true });
        if(imported.options.memory_size !== 32 << 20 || imported.disks.length !== 2) throw new Error("import_ova: " + JSON.stringify(imported.options));
        const ova_vm = vm_current = new V86({ ...config(imported.options.hda), autostart: false });
        await new Promise((resolve, reject) => { ova_vm.add_listener("emulator-loaded", resolve); ova_vm.add_listener("emulator-error", reject); });
        const parts = [];
        await ova_vm.export_disk_image("hda", { write: chunk => { parts.push(chunk); } });
        if(await hex(await new Blob(parts).arrayBuffer()) !== params.get("base_sha256")) throw new Error("the OVA's disk is not the VMDK's data");
        log.push("V86.import_ova: the disk in the archive (" + imported.files.join(", ") + "), as qemu-img reads it; " + imported.notes.length + " notes");
        await ova_vm.destroy();
    }
    result.textContent = "PASS\n" + log.join("\n");
}
catch(error)
{
    result.textContent = "FAIL " + (error && error.stack || error) + "\n" + log.join("\n");
}
</script>
