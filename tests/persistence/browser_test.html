<!doctype html><meta charset="utf-8"><title>Disk persistence in the browser</title>
<div id="screen"><div style="white-space: pre; font: 14px monospace; line-height: 14px"></div><canvas style="display: none"></canvas></div>
<pre id="result">RUNNING</pre>
<script type="module">
// docs/disk-persistence-plan.md, on the page (worker=0) or in the CPU Worker
// (worker=1); run by tests/persistence/browser_runner.mjs.
// D0: MS-DOS from a RAW disk read with HTTP Range requests (read_only, as
// before): its requests have the headers they had (Range, X-Accept-Encoding);
// the image's ETag changes while it is read: with disk_error "stop" the read
// fails, "disk-error" says so and the machine stops, run() reports it to the
// guest (it cannot be retried); with "report" the guest sees the error at
// once; from another origin (the ETag not exposed) the disk works unchecked.
import { V86 } from "../../build/libv86.mjs";
const params = new URLSearchParams(location.search);
const worker = params.get("worker") === "1";
const log = [];
const result = document.getElementById("result");
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const config = hda => ({
    wasm_path: "../../build/v86.wasm", cpu_worker: worker, cpu_worker_url: "../../build/cpu-worker.js",
    bios: { url: "../../bios/seabios.bin" }, vga_bios: { url: "../../bios/vgabios.bin" },
    graphics_adapter: "bochs_vga", graphics_adapter_path: "../../build/v86-bochs-vga.js",
    hda, memory_size: 32 << 20, autostart: true, disable_speaker: true,
    screen: { container: document.getElementById("screen") },
});
const screen = vm => (vm.screen_adapter ? vm.screen_adapter.get_text_screen() : []).map(l => l.replace(/\x00/g, " "));
let vm_current;
async function until(condition, what, timeout = 120000)
{
    const end = performance.now() + timeout;
    while(!condition())
    {
        if(performance.now() > end) throw new Error("timeout: " + what + "\n" + screen(vm_current).join("\n"));
        await sleep(100);
    }
}
async function boot(hda)
{
    const vm = vm_current = new V86(config(hda));
    const events = [];
    vm.add_listener("disk-error", event => events.push(event));
    await new Promise((resolve, reject) => { vm.add_listener("emulator-loaded", resolve); vm.add_listener("emulator-error", reject); });
    // (the prompt alone on its line for a second: AUTOEXEC.BAT is done)
    let stable = 0;
    await until(() => { const l = screen(vm).filter(x => x.trim()); stable = l.length && l[l.length - 1].trim() === "C:\\>" ? stable + 1 : 0; return stable >= 10; }, "C:\\>");
    return { vm, events };
}
const bump = name => fetch("/__bump?name=" + name, { method: "POST" });
const images = "../../build/persistence-browser/";
try
{
    // read_only from this origin, disk_error "stop" (the default)
    {
        const { vm, events } = await boot({ url: images + "stop.img", async: true });
        log.push("C:\\> from a RAW disk over HTTP Range (" + (worker ? "CPU Worker" : "page") + ")");
        await bump("stop.img");
        const stopped = new Promise(resolve => vm.add_listener("emulator-stopped", resolve));
        await vm.keyboard_send_text("copy C:\\DOS\\*.* NUL\n", 20);
        const before = (await (await fetch("/__requests")).json()).length;
        await Promise.race([stopped, sleep(30000).then(async () => { throw new Error("the machine did not stop: " + JSON.stringify(events) +
            " requests " + before + " -> " + (await (await fetch("/__requests")).json()).length + "\n" + screen(vm).join("\n")); })]);
        const event = events[0];
        if(!event || event.disk !== "hda" || event.operation !== "read" || event.retryable !== false || event.policy !== "stop" ||
            !/changed while it was read/.test(event.reason)) throw new Error("disk-error: " + JSON.stringify(events));
        if(vm.is_running()) throw new Error("the machine runs");
        let refused = false;
        try { await vm.save_state(); } catch(e) { refused = /held after an I\/O error/.test(e.message); }
        if(!refused) throw new Error("save_state was not refused while the read is held");
        log.push("the image's ETag changed: the read failed (\"" + event.reason + "\"), the machine stopped, save_state refused");
        // (each run() reports the held read to the guest; the BIOS and DOS
        // retry it, and each retry fails and stops the machine again)
        let runs = 0;
        await until(() =>
        {
            if(!vm.is_running() && runs < 50) { runs++; vm.run(); }
            return screen(vm).some(l => /reading drive C/i.test(l));
        }, "the guest's error message");
        log.push("run() (" + runs + " times, " + events.length + " disk-error events): the read cannot be retried, the guest sees the error (\"" +
            screen(vm).find(l => /reading drive C/i.test(l)).trim() + "\")");
        await vm.destroy();
    }
    // disk_error "report": the guest sees the error at once
    {
        const { vm, events } = await boot({ url: images + "report.img", async: true, disk_error: "report" });
        await bump("report.img");
        await vm.keyboard_send_text("copy C:\\DOS\\*.* NUL\n", 20);
        await until(() => screen(vm).some(l => /reading drive C/i.test(l)), "the guest's error message");
        if(!vm.is_running() || !events.length || events[0].policy !== "report") throw new Error("report: " + JSON.stringify(events));
        log.push("disk_error \"report\": the guest sees the error at once, the machine goes on");
        await vm.destroy();
    }
    // another origin, the ETag not exposed: unchecked, as before
    {
        const { vm, events } = await boot({ url: params.get("cross") + "/build/persistence-browser/cross.img", async: true });
        await vm.keyboard_send_text("copy C:\\DOS\\*.* NUL\n", 20);
        await until(() => screen(vm).some(l => /\d+ file\(s\) copied/.test(l)), "the copy");
        if(events.length) throw new Error("cross-origin: " + JSON.stringify(events));
        log.push("another origin (CORS, ETag not exposed): the disk works, unchecked");
        await vm.destroy();
    }
    // the requests of the read_only disks: what they were before
    const requests = await (await fetch("/__requests")).json();
    const kinds = new Set(requests.map(r => r.method + " " + r.headers.join(",")));
    for(const kind of kinds)
    {
        if(!/^(GET range,x-accept-encoding|OPTIONS access-control-request-headers,access-control-request-method)$/.test(kind)) throw new Error("a request: " + kind);
    }
    log.push(requests.length + " image requests, only: " + [...kinds].join("; "));
    result.textContent = "PASS\n" + log.join("\n");
}
catch(error)
{
    result.textContent = "FAIL " + (error && error.stack || error) + "\n" + log.join("\n");
}
</script>
