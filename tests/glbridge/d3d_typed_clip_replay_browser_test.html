<!doctype html><meta charset="utf-8"><title>D9WG real XP typed attribute clipped drawing</title><canvas id="screen" width="128" height="128"></canvas><pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/webgpu_host.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_shader_pipeline.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_protocol.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_wire.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_state.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_formats.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_uploads.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_resources.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_surface_ops.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_ffp.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_pipeline_state.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_draw_recorder.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_frame_replayer.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_present.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_executor.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/ddraw_ops.js"></script>
<script>
(async () => {
    const P=D9WGProtocol,C=P.C,pictures=[],comparisons=[],probes=[];
    const gpu=new D3D9WebGPUExecutor(document.querySelector("canvas"),{strict:true,useShaderWorker:false});
    try {
        const metadata=await (await fetch("fixtures/d3d9_processed_typed_clip_xp.json")).json();
        const reference=await (await fetch("fixtures/d3d_typed_clip_reference.json")).json();
        const response=await fetch("fixtures/d3d9_processed_typed_clip_xp.bin.gz");if(!response.ok)throw Error("Missing XP multi-stream capture");
        const bytes=new Uint8Array(await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()),view=new DataView(bytes.buffer);
        await gpu.initialize();const dispatch=gpu.dispatchCommand;
        gpu.dispatchCommand=function(opcode,bytes,view,offset,length,commandMetadata){
            const result=dispatch.call(this,opcode,bytes,view,offset,length,commandMetadata);
            if(opcode!==P.OP.PRESENT)return result;const handle=view.getUint32(offset+P.F.Present.device_handle,true);
            return Promise.resolve(result).then(async()=>{
                const state=gpu.devices.get(handle);if(!state)throw Error("Missing paired-draw device");
                const payload=P.encode("ReadbackSurface",{device_handle:handle,texture_handle:state.renderTargets[0],format:21,width:128,height:128,row_count:128,destination_pitch:512,destination_bytes:65536,response_offset:C.D9WG_READBACK_REGION_OFFSET,request_id:pictures.length+1});
                let reply;await gpu.onReadbackSurface(payload,new DataView(payload.buffer),0,payload.length,{writeGuestMemory(at,data){reply=data.slice();}});
                if(!reply||reply.length!==65552||new DataView(reply.buffer).getUint32(P.F.ReadbackResponse.status,true)!==C.D9WG_RESPONSE_OK)throw Error("XP paired-draw readback failed");pictures.push(reply.subarray(16));
            });
        };
        let at=0,batches=0;
        while(at<bytes.length){if(at+12>bytes.length)throw Error("Truncated capture");const ownerToken=view.getUint32(at,true),flags=view.getUint32(at+4,true),size=view.getUint32(at+8,true);at+=12;
            if(size<8||size>bytes.length-at||view.getUint16(at,true)!==0xffe1||view.getUint16(at+2,true)!==0xffff||view.getUint32(at+4,true)!==size-8)throw Error("Invalid D9WG carrier");await gpu.submit(bytes.subarray(at+8,at+size),{ownerToken,flags});at+=size;batches++;}
        await gpu.checkpointIdle();await gpu.device.queue.onSubmittedWorkDone();for(let i=0;i<4;++i)await new Promise(r=>setTimeout(r,0));
        if(pictures.length!==76)throw Error("Expected 76 typed frames, got "+pictures.length);
        for(let scene=0;scene<reference.cases.length;++scene) {
            const row=reference.cases[scene];
            for(const [control,actual] of metadata.pairs){const a=pictures[scene*4+control],b=pictures[scene*4+actual];let differingPixels=0,maximumByteError=0,coveredPixels=0;
                for(let pixel=0;pixel<a.length;pixel+=4){let delta=0;for(let c=0;c<4;++c)delta=Math.max(delta,Math.abs(a[pixel+c]-b[pixel+c]));if(delta)differingPixels++;maximumByteError=Math.max(maximumByteError,delta);if(a[pixel]||a[pixel+1]||a[pixel+2])coveredPixels++;}
                comparisons.push({scene,name:row.name,control,actual,differingPixels,maximumByteError,coveredPixels,minimumCoverage:row.point?16:100});
            }
            for(let frame=0;frame<4;++frame){const [x,y]=frame<2?row.worldProbe:row.rawProbe,offset=(y*128+x)*4;
                const value=[...pictures[scene*4+frame].subarray(offset,offset+4)];
                probes.push({scene,frame,value,expected:row.expectedBGRA,maximumByteError:Math.max(...value.map((n,c)=>Math.abs(n-row.expectedBGRA[c])))});
            }
        }
        const evidence={captureDllSha256:metadata.captureBuild.dllSha256,traceSha256:metadata.traceSha256,frames:pictures.length,batches,comparisons,probes,stats:gpu.stats,gpuErrors:gpu.gpuErrors.errors,hostErrors:gpu.hostErrors};
        await fetch("/__test_file?name=d9wg-typed-clip-guest.json",{method:"POST",body:JSON.stringify(evidence,null,2)});
        if(comparisons.some(r=>r.maximumByteError>reference.tolerance||r.coveredPixels<r.minimumCoverage)||probes.some(r=>r.maximumByteError>reference.tolerance)||gpu.gpuErrors.errors.length||gpu.hostErrors.length||gpu.stats.droppedDraws||gpu.stats.commandsFailed)throw Error("XP typed clipped draw mismatch "+JSON.stringify(evidence));
        document.querySelector("#result").textContent="PASS actual XP typed clipping: 76 frames, 38 paired comparisons, 76 independent color probes, 17 formats with 64x gain, half point size, floating specular, subsequent raw-draw restoration";
    }catch(error){document.querySelector("#result").textContent="FAIL "+error.stack;}
})();
</script>
