<script>
(async()=>{
 "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,benchmark=new URLSearchParams(location.search).has("benchmark"),evidence=[],check=(ok,message)=>{if(!ok)throw new Error(message);};
 try{
  const reference=benchmark?null:await(await fetch("gl_conformance/bitmap_atlas_reference.json")).json();
  for(const copied of benchmark?[false]:[false,true]){
   const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
   const send=async(s)=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length,"GPU "+JSON.stringify(gpu.gpuErrors.errors.slice(0,2))+" host "+JSON.stringify(gpu.hostErrors));};
   if(benchmark){
    const bits=GLBitmapAtlasCases.bits,other=new Uint8Array([255,129,189,165,165,189,129,255]);
    for(const alternating of [false,true]){
     await send(new GLStream().makeCurrent(1,0,0,16,16,alternating?2:1,alternating?2:1).call("PIXEL_STOREI",0x0CF5,1));const times=[],beforeTextures=gpu.stats.textureUploads||0;let uploads=0,uploadBytes=0;const upload=gpu.uploadTexture;gpu.uploadTexture=function(destination,data,layout,size){++uploads;uploadBytes+=data.byteLength;return upload.call(this,destination,data,layout,size);};
     for(let frame=0;frame<18;++frame){
      const s=new GLStream();for(let i=0;i<512;++i)s.call("COLOR4F",(i%16)/15,1-(i%16)/15,.25,1).call("WINDOW_POS3F",i%9,(i>>4)%9,.25).bitmap(8,8,0,0,0,0,alternating&&(i&1)?other:bits);
      const memory=s.bytes(),start=performance.now(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}])gpu.submit(segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length),{});gpu.flushFrame();const elapsed=performance.now()-start;await gpu.device.queue.onSubmittedWorkDone();await gpu.idle();if(frame>=3)times.push(elapsed);
     }
     gpu.uploadTexture=upload;times.sort((a,b)=>a-b);evidence.push({workload:alternating?"alternating_two_glyphs":"repeated_glyph",glyphsPerFrame:512,frames:times.length,medianMs:times[times.length>>1],p95Ms:times[Math.floor(times.length*.95)],uploads,uploadBytes});void beforeTextures;
    }
   }else for(const [i,entry] of reference.cases.entries()){
    const s=GLBitmapAtlasCases.scene(new GLStream().makeCurrent(1,0,0,16,16,i+1,i+1),entry.name),p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024),d=s.readPixels(0,0,16,16,GL.DEPTH_COMPONENT,GL.FLOAT,1024),st=s.readPixels(0,0,16,16,GL.STENCIL_INDEX,GL.UNSIGNED_BYTE,256);await send(s);
    for(const record of [p,d,st])check(record.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" read status");
    const color=p.bytes.subarray(P.RECORDS.READ_PIXELS.size),depth=new DataView(d.bytes.buffer,d.bytes.byteOffset+P.RECORDS.READ_PIXELS.size,1024),stencil=st.bytes.subarray(P.RECORDS.READ_PIXELS.size),mismatch=[];
    for(let c=0;c<1024;++c)if(Math.abs(color[c]-entry.pixels[c])>1)mismatch.push(c+":"+color[c]+"/"+entry.pixels[c]);check(!mismatch.length,entry.name+" color "+mismatch.slice(0,10));
    for(let c=0;c<256;++c){check(Math.abs(depth.getFloat32(c*4,true)-entry.depth[c])<1e-6,entry.name+" depth "+c);check(stencil[c]===entry.stencil[c],entry.name+" stencil "+c);}
   }
   gpu.flushFrame();await gpu.idle();check(!gpu.stats.refusals,"no refusals");
  }
  document.getElementById("result").textContent=benchmark?"PASS benchmark "+JSON.stringify(evidence):"PASS eight native bitmap mask scenes in both transport modes";
 }catch(error){document.getElementById("result").textContent="FAIL "+String(error.stack||error);}
})();
