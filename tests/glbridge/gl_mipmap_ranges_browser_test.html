<script>
(async()=>{
    "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,Q=P.F.QUERY_TEXTURE_IMAGE,H=P.RECORDS.QUERY_TEXTURE_IMAGE.size,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const response=await fetch("gl_conformance/mesa_reference.json.gz"),mesa=await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).json(),reference=mesa.fixtures.mipmap_ranges.cases;
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const submit=async s=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);};
            await submit(new GLStream().makeCurrent(1,0,0,16,16,1,1));
            for(const phase of GLMipmapRangesCases.phases){
                await submit(GLMipmapRangesCases.scene(new GLStream(),phase));
                for(const entry of reference.filter(e=>e.phase===phase)){
                    const s=new GLStream(),meta=GLTextureReadbackCases.query(s,{target:GL.TEXTURE_2D,level:entry.level,format:entry.depth?GL.DEPTH_COMPONENT:GL.RGBA,type:entry.depth?GL.FLOAT:GL.UNSIGNED_BYTE,pointer:4096});await submit(s);
                    check(meta.view.getUint32(Q.status,true)===1,phase+" metadata "+entry.level);
                    const r=P.decodeRecord("QUERY_TEXTURE_IMAGE",meta.view,0);check(r.width===entry.size,phase+" width "+r.width);
                    const packet=new GLStream(),data=GLTextureReadbackCases.query(packet,{mode:2,ticket:r.ticket,context_id:r.context_id,data_size:r.span},new Uint8Array(r.span));await submit(packet);
                    check(data.view.getUint32(Q.status,true)===1,phase+" read "+entry.level);
                    const expected=GLMipmapRangesCases.expected(entry),actual=entry.depth?Array.from(new Float32Array(data.bytes.slice(H).buffer)):Array.from(data.bytes.subarray(H));
                    check(actual.every((v,i)=>Math.abs(v-expected[i%expected.length])<=(entry.depth?0.000001:0)),phase+" level "+entry.level+": "+actual.slice(0,4)+" expected "+expected);
                }
            }
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS mip ranges: base/MAX manual bounds, preserved outside levels, automatic full pyramid, FBO no-auto and GPU-authored depth in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
