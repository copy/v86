<script>
(async()=>{
 const P=D9WGProtocol,C=P.C,evidence={apis:[]};
 try{
  const reference=await(await fetch("fixtures/d3d_palette_reference.json")).json();
  for(const api of [8,9]){
   const pictures=[],gpu=new D3D9WebGPUExecutor(document.querySelector("canvas"),{strict:true,useShaderWorker:false});
   const metadata=await(await fetch("fixtures/d3d"+api+"_palette_xp.json")).json(),response=await fetch("fixtures/d3d"+api+"_palette_xp.bin.gz");if(!response.ok)throw Error("missing palette capture");
   const bytes=new Uint8Array(await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()),view=new DataView(bytes.buffer);
   await gpu.initialize();const dispatch=gpu.dispatchCommand;
   gpu.dispatchCommand=function(opcode,bytes,view,offset,length,commandMetadata){const result=dispatch.call(this,opcode,bytes,view,offset,length,commandMetadata);if(opcode!==P.OP.PRESENT)return result;const handle=view.getUint32(offset+P.F.Present.device_handle,true);return Promise.resolve(result).then(async()=>{
    const state=gpu.devices.get(handle),payload=P.encode("ReadbackSurface",{device_handle:handle,texture_handle:state.renderTargets[0],format:21,width:64,height:64,row_count:64,destination_pitch:256,destination_bytes:16384,response_offset:C.D9WG_READBACK_REGION_OFFSET,request_id:pictures.length+1});let reply;
    await gpu.onReadbackSurface(payload,new DataView(payload.buffer),0,payload.length,{writeGuestMemory(at,data){reply=data.slice();}});if(!reply||reply.length!==16400||new DataView(reply.buffer).getUint32(P.F.ReadbackResponse.status,true)!==C.D9WG_RESPONSE_OK)throw Error("palette readback failed");pictures.push(reply.subarray(16));
   });};
   let at=0,batches=0;while(at<bytes.length){if(at+12>bytes.length)throw Error("truncated capture");const ownerToken=view.getUint32(at,true),flags=view.getUint32(at+4,true),size=view.getUint32(at+8,true);at+=12;if(size<8||size>bytes.length-at||view.getUint16(at,true)!==0xffe1||view.getUint16(at+2,true)!==0xffff||view.getUint32(at+4,true)!==size-8)throw Error("bad capture envelope");await gpu.submit(bytes.subarray(at+8,at+size),{ownerToken,flags});at+=size;batches++;}
   await gpu.checkpointIdle();await gpu.device.queue.onSubmittedWorkDone();for(let i=0;i<4;++i)await new Promise(r=>setTimeout(r,0));if(pictures.length!==reference.frames.length)throw Error("wrong palette frame count");
   const comparisons=[];for(let frame=0;frame<pictures.length;++frame){const color=reference.paletteBGRA[reference.frames[frame].palette];for(let side=0;side<2;++side){const expected=color.slice();if(side)expected[3]=64;let maximumByteError=0,pixels=0;for(let y=2;y<62;++y)for(let x=side*32+2;x<side*32+30;++x){const offset=(y*64+x)*4;for(let c=0;c<4;++c)maximumByteError=Math.max(maximumByteError,Math.abs(pictures[frame][offset+c]-expected[c]));pixels++;}comparisons.push({frame,name:reference.frames[frame].name,format:side?"A8P8":"P8",expected,pixels,maximumByteError});}}
   evidence.apis.push({api,frames:pictures.length,batches,traceSha256:metadata.traceSha256,comparisons,stats:gpu.stats,gpuErrors:gpu.gpuErrors.errors,hostErrors:gpu.hostErrors});
  }
  await fetch("/__test_file?name=d9wg-palette-guest.json",{method:"POST",body:JSON.stringify(evidence,null,2)});
  if(evidence.apis.some(a=>a.comparisons.some(c=>c.maximumByteError>reference.tolerance)||a.gpuErrors.length||a.hostErrors.length||a.stats.droppedDraws||a.stats.commandsFailed))throw Error("palette replay mismatch "+JSON.stringify(evidence));
  document.querySelector("#result").textContent="PASS actual XP D3D8/9 palettes: 24 frames, 48 exact P8/A8P8 color and alpha comparisons, default selection, high IDs, state blocks, deferred recording and live resource updates";
 }catch(error){document.querySelector("#result").textContent="FAIL "+error.stack;}
})();
</script>
