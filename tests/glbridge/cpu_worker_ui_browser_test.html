<!doctype html><meta charset="utf-8"><title>Performance recorder UI integration</title>
<pre id="result">RUNNING</pre>
<iframe id="app"></iframe>
<script type="module">
// (the VM manager's console, the CPU in its Worker: tests/glbridge/recorder_ui_test.mjs)
import { run } from "./recorder_ui_test.mjs";
run(true).catch(error => ({ status: "FAIL", error: error.stack })).then(result => {
    document.getElementById("result").textContent = JSON.stringify(result);
    fetch("/__test_result", { method: "POST", body: JSON.stringify(result) });
});
</script>
