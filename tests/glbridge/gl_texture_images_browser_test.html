<script>
(async()=>{
    "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const reference=await(await fetch("gl_conformance/texture_images_reference.json")).json();
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const submit=async s=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);};
            for(const entry of reference.cases){
                await submit(GLTextureImagesCases.setup(new GLStream().makeCurrent(1,0,0,16,16,1,1),entry.name));
                const archive=await gpu.saveSnapshot();await gpu.restoreSnapshot(archive);
                let lease=null;
                if(entry.name==="format"){
                    const packet=new GLStream(),meta=GLTextureReadbackCases.query(packet,{target:GL.TEXTURE_2D,level:1,format:GL.RGBA,type:GL.UNSIGNED_BYTE,pointer:4096});await submit(packet);lease=P.decodeRecord("QUERY_TEXTURE_IMAGE",meta.view,0);
                }
                const s=GLTextureImagesCases.scene(new GLStream(),entry.name),left=s.readPixels(4,8,1,1,GL.RGBA,GL.UNSIGNED_BYTE,4),right=s.readPixels(12,8,1,1,GL.RGBA,GL.UNSIGNED_BYTE,4);await submit(s);
                for(const [side,p] of [["left",left],["right",right]]){
                    check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" "+side+" status");
                    const actual=Array.from(p.bytes.subarray(P.RECORDS.READ_PIXELS.size)),expected=entry.name==="null_image"&&side==="left"?[0,0,0,0]:entry[side];
                    check(expected.every((v,i)=>v===actual[i]),entry.name+" "+side+": "+actual+" expected "+expected);
                }
                if(lease){
                    const packet=new GLStream(),data=GLTextureReadbackCases.query(packet,{mode:2,ticket:lease.ticket,context_id:lease.context_id,data_size:lease.span},new Uint8Array(lease.span));await submit(packet);
                    check(data.view.getUint32(P.F.QUERY_TEXTURE_IMAGE.status,true)===1,"migrated image lease status");
                    const rgba=Array.from(data.bytes.subarray(P.RECORDS.QUERY_TEXTURE_IMAGE.size,P.RECORDS.QUERY_TEXTURE_IMAGE.size+4));check(rgba.join() === "0,255,0,255","migrated image lease "+rgba);
                }
                // Public image readback must retain the two GPU-authored
                // levels, even after sampling changed the allocation shape.
                for(const level of [0,1]){
                    const metadataStream=new GLStream(),meta=GLTextureReadbackCases.query(metadataStream,{target:GL.TEXTURE_2D,level,format:GL.RGBA,type:GL.UNSIGNED_BYTE,pointer:4096});await submit(metadataStream);
                    const r=P.decodeRecord("QUERY_TEXTURE_IMAGE",meta.view,0);check(r.status===1,entry.name+" metadata "+level);
                    const packet=new GLStream(),data=GLTextureReadbackCases.query(packet,{mode:2,ticket:r.ticket,context_id:r.context_id,data_size:r.span},new Uint8Array(r.span));await submit(packet);
                    check(data.view.getUint32(P.F.QUERY_TEXTURE_IMAGE.status,true)===1,entry.name+" image status "+level);
                    const actual=Array.from(data.bytes.subarray(P.RECORDS.QUERY_TEXTURE_IMAGE.size,P.RECORDS.QUERY_TEXTURE_IMAGE.size+4)),expected=level===0?entry.right:entry.name==="null_image"?[0,0,0,0]:entry.left;
                    check(expected.every((v,i)=>v===actual[i]),entry.name+" image "+level+": "+actual+" expected "+expected);
                }
                if(entry.name==="cube_face"||entry.name==="volume_image"){
                    const target=entry.name==="cube_face"?GL.TEXTURE_CUBE_MAP_NEGATIVE_X:GL.TEXTURE_3D;
                    for(const level of entry.name==="cube_face"?[0]:[0,1]){
                        const metadataStream=new GLStream(),meta=GLTextureReadbackCases.query(metadataStream,{target,level,format:GL.RGBA,type:GL.UNSIGNED_BYTE,pointer:4096});await submit(metadataStream);
                        const r=P.decodeRecord("QUERY_TEXTURE_IMAGE",meta.view,0),packet=new GLStream(),data=GLTextureReadbackCases.query(packet,{mode:2,ticket:r.ticket,context_id:r.context_id,data_size:r.span},new Uint8Array(r.span));await submit(packet);
                        check(data.view.getUint32(P.F.QUERY_TEXTURE_IMAGE.status,true)===1,entry.name+" auxiliary read "+level);
                        const slice=entry.name==="cube_face"?0:level?2:1,at=P.RECORDS.QUERY_TEXTURE_IMAGE.size+slice*r.width*r.height*4,actual=Array.from(data.bytes.subarray(at,at+4)),expected=entry.name==="volume_image"&&level===0?[255,0,0,255]:[0,255,0,255];
                        check(expected.every((v,i)=>v===actual[i]),entry.name+" auxiliary image "+level+": "+actual+" expected "+expected);
                    }
                }
            }
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS independent texture images: GPU-authored heterogeneous formats/sizes, inactive updates, redefinition, zero replacement, snapshot and public readback in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
