<!doctype html>
<meta charset="utf-8">
<title>D3D9 pixel conformance</title>
<canvas id="screen" width="64" height="64"></canvas>
<pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/webgpu_host.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_shader_pipeline.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_protocol.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_wire.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_state.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_formats.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_uploads.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_resources.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_surface_ops.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_ffp.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_pipeline_state.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_draw_recorder.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_frame_replayer.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_executor.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/ddraw_ops.js"></script>
<script src="d3d9_conformance.js"></script>
<script src="d3d9_feature_cases.js"></script>
<script>
// Runs d3d9_conformance.js's cases on the real GPU:
//   node tests/glbridge/gl_multipass_browser_runner.js d3d9_conformance_browser_test.html
(async () => {
    "use strict";
    const { CASES, KNOWN_FAILURES, caseBatch, readbackBatch } = D3D9Conformance;
    const lines = [];
    let failed = 0;
    try {
        const executor = new D3D9WebGPUExecutor(document.getElementById("screen"),
            { strict: true, shaderWorkerUrl: null,
                uploadBudgetBytes: new URLSearchParams(location.search).has("upload_budget") ? 1 : undefined });
        await executor.initialize();
        if (new URLSearchParams(location.search).has("uniform_overflow")) {
            executor.uniformRingCapacity = 256;executor.uniformRingMaxChunks = 1;
        }
        const device = executor.device;
        const group = new URLSearchParams(location.search).get("group");
        let executed = 0;
        for (let i = 0; i < CASES.length; i++) {
            const c = CASES[i];
            if (group && c.group !== group) continue;
            ++executed;
            const errorsBefore = executor.gpuErrors.errors.length;
            const hostErrorsBefore = executor.hostErrors.length;
            const droppedBefore = executor.stats.droppedDraws;
            const failedBefore = executor.stats.commandsFailed;
            const { dev, rt, bytes } = caseBatch(i, c);
            await executor.submit(bytes, { writeGuestMemory() {} });
            await executor.idle();
            await device.queue.onSubmittedWorkDone();
            // let the scopes of this case settle
            for (let k = 0; k < 4; ++k) await new Promise(resolve => setTimeout(resolve, 0));
            // Exercise the same READBACK command and packed reply the guest
            // sees. Direct texture copies cannot prove this API boundary.
            const pictures = new Map();
            for (const target of new Set(c.probes.map(p => p.target || 0))) {
                let reply;
                const C = D9WGProtocol.C, address = (16 << 20) - C.D9WG_RESPONSE_REGION_BYTES + C.D9WG_READBACK_REGION_OFFSET;
                await executor.submit(readbackBatch(i + 1, dev, c.backBuffer ? 0 : rt + target), {
                    writeGuestMemory(at, data) { if (at === address) reply = data.slice(); },
                });
                await executor.idle();
                if (!reply || reply.length !== 16 + 64 * 64 * 4 || new DataView(reply.buffer).getUint32(12, true) !== C.D9WG_RESPONSE_OK)
                    throw new Error(c.name + ": guest READBACK failed");
                pictures.set(target, reply.subarray(16));
            }
            const problems = [
                ...executor.gpuErrors.errors.slice(errorsBefore).map(e => "WebGPU " + e.source + ": " + e.message),
                ...executor.hostErrors.slice(hostErrorsBefore).map(e => "host: " + e.message),
                ...(executor.stats.droppedDraws > droppedBefore ? ["dropped draws"] : []),
                ...(executor.stats.commandsFailed > failedBefore ? ["failed commands"] : []),
            ];
            const pixels = [];
            for (const probe of c.probes) {
                const picture = pictures.get(probe.target || 0);
                const read = (x, y) => { const at = (y * 64 + x) * 4;return [picture[at + 2], picture[at + 1], picture[at], picture[at + 3]]; };
                if (probe.row !== undefined) {
                    // some pixel of the row has a red value strictly between
                    const [low, high] = probe.someRedBetween;
                    const reds = [];
                    for (let x = 0; x < D3D9Conformance.W; ++x)
                        reds.push(read(x, probe.row)[0]);
                    if (!reds.some(red => red > low && red < high))
                        pixels.push("row " + probe.row + " has no red in (" + low + ", " + high + "): " + reds.join(","));
                    continue;
                }
                const got = read(probe.at[0], probe.at[1]);
                const tolerance = probe.tolerance || 0;
                if (!probe.expect.every((v, k) => Math.abs(v - got[k]) <= tolerance))
                    pixels.push((probe.target ? "rt" + probe.target + " " : "") + "@" + probe.at + " got " + got +
                        " want " + probe.expect);
            }
            const ok = !problems.length && !pixels.length;
            const known = KNOWN_FAILURES[c.name];
            if (problems.length) {
                ++failed;
                lines.push("FAIL  " + c.name + ": " + problems.join("; "));
            } else if (known && ok) {
                ++failed;
                lines.push("FIXED " + c.name + " -- delete it from KNOWN_FAILURES (" + known + ")");
            } else if (known) {
                lines.push("known " + c.name + " (" + known + "): " + pixels.join("; "));
            } else if (!ok) {
                ++failed;
                lines.push("FAIL  " + c.name + (c.ref ? " [" + c.ref + "]" : "") + ": " + [...problems, ...pixels].join("; "));
            } else {
                lines.push("ok    " + c.name);
            }
        }
        if (!executed) throw new Error("No conformance cases selected: " + group);
        document.getElementById("result").textContent =
            (failed ? "FAIL " + failed + " case(s)\n" : "PASS " + executed + " cases\n") + lines.join("\n");
    } catch (error) {
        document.getElementById("result").textContent = "FAIL exception " + (error && error.stack) + "\n" + lines.join("\n");
    }
})();
</script>
