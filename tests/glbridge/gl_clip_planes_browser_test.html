<script>
(async()=>{
    "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const reference=await(await fetch("gl_conformance/clip_planes_reference.json")).json(),module=await WebAssembly.compile(await(await fetch("../../bios/glslang.wasm")).arrayBuffer());
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());cpu.setGlslang(new V86GLGlslang.Glslang(module));
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const submit=async s=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);};
            for(const [i,entry] of GLClipPlanesCases.cases.entries()){
                await submit(GLClipPlanesCases.setup(new GLStream().makeCurrent(1,0,0,16,16,i+1,i+1),entry));
                if(entry.name==="glsl_hole")await gpu.restoreSnapshot(await gpu.saveSnapshot());
                for(const enableHole of entry.name==="glsl_hole"?[false,true,false]:[false]){
                    const s=new GLStream();if(entry.name==="glsl_hole")s.call(enableHole?"ENABLE":"DISABLE",GL.CLIP_PLANE0);GLClipPlanesCases.draw(s,entry);
                    const p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await submit(s);check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" read status");
                    const pixels=p.bytes.subarray(P.RECORDS.READ_PIXELS.size),rows=Array.from({length:16},(_,y)=>{let mask=0;for(let x=0;x<16;x++)if(pixels[(y*16+x)*4+1]>128)mask|=1<<x;return mask;});
                    const expected=enableHole?Array(16).fill(0):reference.cases[i].rows;check(JSON.stringify(rows)===JSON.stringify(expected),entry.name+" "+enableHole+": "+rows+" expected "+expected+" GPU "+JSON.stringify(gpu.gpuErrors.errors)+" host "+JSON.stringify(gpu.hostErrors));
                }
            }
            {
                const s=GLClipPlanesCases.stress(new GLStream().makeCurrent(1,0,0,16,16,100,100)),p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await submit(s);
                const pixels=p.bytes.subarray(P.RECORDS.READ_PIXELS.size);for(let y=0;y<16;y++)for(let x=0;x<16;x++){const on=x>=5&&x<=10&&y>=9&&y<=14;check(pixels[(y*16+x)*4+1]===(on?255:0),"all 16 ARB varying slots "+x+","+y);}
            }
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS six clip planes: fixed/GLSL/ARB, homogeneous w, enable holes, inactive builtins, program pairs and snapshot in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
