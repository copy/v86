<script>
(async () => {
    "use strict";
    const { GLStream, GL }=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try {
        const compiler=new V86GLGlslang.Glslang(await WebAssembly.compile(await(await fetch("../../bios/glslang.wasm")).arrayBuffer()));
        const reference=await(await fetch("gl_conformance/stencil_faces_reference.json")).json();
        for(const copied of [false,true]) {
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();
            cpu.setCapabilities(gpu.capabilities());cpu.setGlslang(compiler);
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const submit=async s=>{
                const memory=s.bytes(),segments=cpu.process(memory);
                for(const segment of segments||[{offset:0,length:memory.length}]) {
                    const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);
                    gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});
                }
                await gpu.idle();
            };
            await submit(new GLStream().makeCurrent(1,0,0,16,16,1,1).call("VIEWPORT",0,0,16,16).call("ENABLE",GL.STENCIL_TEST));
            for(const entry of reference.cases) {
                const s=GLStencilFacesCases.scene(new GLStream(),entry.name),p=s.readPixels(8,8,1,1,GL.STENCIL_INDEX,GL.UNSIGNED_BYTE,4);await submit(s);check(!cpu.current.error,entry.name+" CPU error "+cpu.current.error);
                check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" status");
                check(p.bytes[P.RECORDS.READ_PIXELS.size]===entry.value,entry.name+": "+p.bytes[P.RECORDS.READ_PIXELS.size]+" expected "+entry.value);
            }
            check(!gpu.hostErrors.length&&!gpu.gpuErrors.errors.length&&!gpu.stats.refusals,"host failure");gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS stencil faces: native refs, read/write masks, ordered overlapping primitives, culling and programmable facing in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
