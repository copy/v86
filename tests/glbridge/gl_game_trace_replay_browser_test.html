<script>
(async()=>{
 "use strict";const params=new URLSearchParams(location.search),game=params.get("game")==="warcraft3"?"warcraft3":"cube2",source=params.get("source")||"/build/browser-test-output/",prefix=params.get("prefix")||game+"-worker",P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
 try{
  const manifest=await(await fetch(source+prefix+"-trace.json")).json(),unzip=async name=>new Uint8Array(await new Response((await fetch(source+name)).body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()),
   checkpoint=await unzip(manifest.checkpoint),frames=GLGameTrace.decode(await unzip(manifest.trace));check(frames.length===64&&manifest.frames===64,"64 recorded frames required");
  const canvas=document.getElementById("gpu"),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(canvas,{strict:true,writeGuestMemory:()=>{}});await gpu.initialize();await gpu.restoreSnapshot(checkpoint);
  gpu.host.resizeCanvas(gpu.backBufferWidth,gpu.backBufferHeight);const times=[],counts=[];
  for(const [i,frame] of frames.entries()){
   const packets=frame.map(packet=>packet.slice()),before=gpu.stats.draws,start=performance.now();for(const packet of packets)gpu.submit(packet,{});gpu.onSwapBuffers();const elapsed=performance.now()-start;
   await gpu.device.queue.onSubmittedWorkDone();await gpu.idle();check(!gpu.stats.refusals&&!gpu.hostErrors.length&&!gpu.gpuErrors.errors.length,"replay errors "+JSON.stringify(gpu.hostErrors.slice(0,2))+" "+JSON.stringify(gpu.gpuErrors.errors.slice(0,2)));
   if(i>=4){times.push(elapsed);counts.push(gpu.stats.draws-before);}
  }
  const sorted=times.slice().sort((a,b)=>a-b),result={game,frames:times.length,warmupFrames:4,frameCpuMs:times,frameDraws:counts,medianMs:sorted[sorted.length>>1],p95Ms:sorted[Math.floor(sorted.length*.95)],stats:gpu.stats,hostErrors:gpu.hostErrors,method:"Same recorded game stream and portable GPU checkpoint; executor submit + SwapBuffers CPU time only, packet cloning and GPU completion outside timer. CPU authority is absent from replay and unchanged by D5."};
  const width=gpu.backBufferWidth,height=gpu.backBufferHeight,stream=new GLTestStream.GLStream().call("BIND_FRAMEBUFFER",GL.READ_FRAMEBUFFER,0).call("READ_BUFFER",GL.BACK)
   .call("PIXEL_STOREI",0x0D05,4).call("PIXEL_STOREI",0x0D02,0).call("PIXEL_STOREI",0x0D03,0).call("PIXEL_STOREI",0x0D04,0).call("PIXEL_STOREI",0x0D00,0),
   read=stream.readPixels(0,0,width,height,GL.RGBA,GL.UNSIGNED_BYTE,width*height*4);
  gpu.submit(stream.bytes(),{});await gpu.idle();check(read.view.getUint32(P.F.READ_PIXELS.status,true)===1,"final pixels read");
  const finalPixels=read.bytes.subarray(P.RECORDS.READ_PIXELS.size);result.width=width;result.height=height;
  result.finalPixelsSha256=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",finalPixels)),v=>v.toString(16).padStart(2,"0")).join("");
  await fetch("/__test_file?name="+game+"-replay-"+(params.get("label")||"candidate")+".rgba",{method:"POST",body:finalPixels});
  if(manifest.expectedPixelsSha256)check(result.finalPixelsSha256===manifest.expectedPixelsSha256,"fixture pixels survive portable trace replay");
  await fetch("/__test_file?name="+game+"-replay-"+(params.get("label")||"candidate")+".json",{method:"POST",body:JSON.stringify(result)});
  document.getElementById("result").textContent="PASS "+JSON.stringify({game,frames:result.frames,medianMs:result.medianMs,p95Ms:result.p95Ms,draws:counts.reduce((a,b)=>a+b,0)});
 }catch(error){document.getElementById("result").textContent="FAIL "+String(error.stack||error);}
})();
</script>
