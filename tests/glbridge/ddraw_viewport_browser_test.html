(async()=>{const P=D9WGProtocol,C=P.C,suite=D3D9Conformance,{cmd,rs,drawXYZ,fullXYZ}=suite.builders;const gpu=new D3D9WebGPUExecutor(document.querySelector('canvas'),{strict:true,useShaderWorker:false});const scenes=[];try{for(const input of [[0,64,0,1],[64,0,0,1],[64,64,0,0],[64,64,1,0],[64,64,-2,4],[64,64,2,3]]){const i=scenes.length,[width,height,min_z,max_z]=input,batch=suite.caseBatch(i,{clear:0xffab4e69,body:dev=>[rs(dev,7,0),rs(dev,22,1),cmd(P.OP.SET_VIEWPORT,P.encode('SetViewport',{device_handle:dev,x:0,y:0,width,height,min_z,max_z})),...drawXYZ(dev,fullXYZ(.5,0xff00ff00))]});await gpu.submit(batch.bytes,{writeGuestMemory(){}});let reply;await gpu.submit(suite.readbackBatch(i+1,batch.dev,batch.rt),{writeGuestMemory(offset,bytes){if(offset===(16<<20)-C.D9WG_RESPONSE_REGION_BYTES+C.D9WG_READBACK_REGION_OFFSET)reply=bytes.slice();}});if(!reply||reply.length!==16+64*64*4||new DataView(reply.buffer).getUint32(P.F.ReadbackResponse.status,true)!==C.D9WG_RESPONSE_OK)throw Error('Readback failed');const pixels=new Uint32Array(reply.buffer,reply.byteOffset+16,64*64),expected=width&&height?0xff00ff00:0xffab4e69;let errors=0;for(const pixel of pixels)if(pixel!==expected)errors++;scenes.push({width,height,min_z,max_z,expected,errors});await gpu.submit(suite.endCaseBatch(i+1),{writeGuestMemory(){}});}await gpu.device.queue.onSubmittedWorkDone();for(let i=0;i<4;i++)await new Promise(r=>setTimeout(r,0));const evidence={scenes,stats:gpu.stats,gpuErrors:gpu.gpuErrors.errors,hostErrors:gpu.hostErrors};await fetch('/__test_file?name=ddraw-viewport-gpu.json',{method:'POST',body:JSON.stringify(evidence,null,2)});if(scenes.some(r=>r.errors)||gpu.gpuErrors.errors.length||gpu.hostErrors.length||gpu.stats.commandsFailed||gpu.stats.droppedDraws)throw Error(JSON.stringify(evidence));document.querySelector('#result').textContent='PASS DDraw viewport boundaries: 6 scenes, 24576 pixels, zero extents/equal/reversed/outside depth ranges, no GPU or host errors';}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}})();
