<script>
(async () => {
    "use strict";
    const { GLStream, GL }=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try {
        const reference=await(await fetch("gl_conformance/blit_aspects_reference.json")).json();
        for(const copied of [false,true]) {
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const submit=async s=>{
                const memory=s.bytes(),segments=cpu.process(memory);
                for(const segment of segments||[{offset:0,length:memory.length}]) {
                    const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);
                    gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});
                }
                await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);
            };
            const read=async(x,depth,stencil,rgba,label)=>{
                const s=new GLStream(),d=s.readPixels(x,x,1,1,GL.DEPTH_COMPONENT,GL.FLOAT,4),t=s.readPixels(x,x,1,1,GL.STENCIL_INDEX,GL.UNSIGNED_BYTE,4),c=s.readPixels(x,x,1,1,GL.RGBA,GL.UNSIGNED_BYTE,4);await submit(s);
                for(const p of [d,t,c])check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,label+" status");
                const offset=P.RECORDS.READ_PIXELS.size;
                check(Math.abs(d.view.getFloat32(offset,true)-depth)<0.00001,label+" depth "+d.view.getFloat32(offset,true));
                check(t.bytes[offset]===stencil,label+" stencil "+t.bytes[offset]);
                check(rgba.every((v,i)=>c.bytes[offset+i]===v),label+" rgba "+Array.from(c.bytes.subarray(offset)));
            };
            await submit(new GLStream().makeCurrent(1,0,0,16,16,1,1));
            for(const entry of reference.cases) {
                await submit(GLBlitAspectsCases.scene(new GLStream(),entry.name));
                for(let i=0;i<2;i++){const p=entry.pixels[i];await read(i?2:8,p.depth,p.stencil,p.rgba,entry.name+"/"+i);}
            }
            await submit(new GLStream().makeCurrent(2,0,0,16,16,2,1,4<<8).call("DISABLE",GL.SCISSOR_TEST).call("CLEAR_DEPTH",0.375).call("CLEAR_STENCIL",219).call("CLEAR_COLOR",0,1,0,1)
                .call("CLEAR",GL.DEPTH_BUFFER_BIT|GL.STENCIL_BUFFER_BIT|GL.COLOR_BUFFER_BIT));
            await read(8,0.375,219,[0,255,0,255],"MSAA depth/stencil read");
            // Individual samples have distinct values: the read chooses sample zero, without averaging stencil bits.
            const count=16*16*4,depth=Float32Array.from({length:count},(_,i)=>[0.1,0.3,0.6,0.9][i%4]),stencil=Uint8Array.from({length:count},(_,i)=>[19,42,173,255][i%4]);
            const old=gpu.depthTarget,replacement=await GLGPUArchive.restore(gpu,{kind:"texture",descriptor:{size:{width:16,height:16,depthOrArrayLayers:1},format:"depth24plus-stencil8",dimension:"2d",mipLevelCount:1,sampleCount:4,usage:20},levels:[
                {level:0,layer:0,width:16,height:16,aspect:"depth",data:new Uint8Array(depth.buffer)},
                {level:0,layer:0,width:16,height:16,aspect:"stencil-samples",data:stencil}]});
            gpu.depthTarget=replacement;gpu.depthTargetView=replacement.createView();gpu.resources.track(replacement);old.destroy();
            await read(8,0.1,19,[0,255,0,255],"individual MSAA sample zero");
            const resolve=GLBlitAspectsCases.framebuffer(new GLStream(),7,[0,0,1],0.75,42)
                .call("BIND_FRAMEBUFFER",GL.READ_FRAMEBUFFER,0).call("BLIT_FRAMEBUFFER",0,0,16,16,0,0,16,16,GL.DEPTH_BUFFER_BIT|GL.STENCIL_BUFFER_BIT,GL.NEAREST)
                .call("BIND_FRAMEBUFFER",GL.READ_FRAMEBUFFER,7);
            await submit(resolve);await read(8,0.1,19,[0,0,255,255],"MSAA depth/stencil blit");
            await gpu.device.queue.onSubmittedWorkDone();check(!gpu.hostErrors.length&&!gpu.gpuErrors.errors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));
            gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS aspect blits: native depth/stencil/combined/reversed/scissor pixels, MSAA depth and stencil sample-zero reads in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
