<script>
(async () => {
    "use strict";
    const P = GLProtocol, { GLStream, GL } = GLTestStream, check = (ok, message) => { if (!ok) throw new Error(message); };
    try {
        const module = await WebAssembly.compile(await (await fetch("../../bios/glslang.wasm")).arrayBuffer());
        for (const copied of [false, true]) {
            const shadow = new V86GLShadow.GLShadow(), gpu = new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"), { strict: true });
            await gpu.initialize(); shadow.setCapabilities(gpu.capabilities()); shadow.setGlslang(new V86GLGlslang.Glslang(module));
            gpu.options.writeGuestMemory = (at, bytes, metadata) => metadata.memory.set(bytes, at + metadata.baseOffset);
            const submit = async stream => {
                const memory = stream.bytes(), segments = shadow.process(memory);
                for (const segment of segments || [{ offset: 0, length: memory.length }]) {
                    const bytes = segment.bytes || memory.subarray(segment.offset, segment.offset + segment.length);
                    gpu.submit(copied ? bytes.slice() : bytes, { memory, baseOffset: segment.bytes ? 0 : segment.offset });
                }
                await gpu.idle(); check(!shadow.current.error, "CPU error " + shadow.current.error);
            };
            await submit(new GLStream().makeCurrent(1, 0, 0, 16, 16, 1, 1).call("VIEWPORT", 0, 0, 16, 16)
                .call("CREATE_PROGRAM", 5).call("CREATE_SHADER", 1, GL.VERTEX_SHADER)
                .shaderSource(1, "attribute vec4 position;uniform vec4 colors[2];uniform float bias;void main(){gl_Position=position+vec4(bias,0,0,0);gl_FrontColor=colors[1];}")
                .call("COMPILE_SHADER", 1).call("ATTACH_SHADER", 5, 1).call("CREATE_SHADER", 2, GL.FRAGMENT_SHADER)
                .shaderSource(2, "void main(){gl_FragColor=gl_Color;}").call("COMPILE_SHADER", 2).call("ATTACH_SHADER", 5, 2).call("LINK_PROGRAM", 5).call("USE_PROGRAM", 5));
            for (let generation = 1; generation <= 2; ++generation) {
                if (generation === 2) {
                    const payload = P.encodeRecord("BIND_ATTRIB_LOCATION", { program: 5, location: 6, name_length: 8 }), bytes = new Uint8Array(payload.length + 8); bytes.set(payload); bytes.set(new TextEncoder().encode("position"), payload.length);
                    await submit(new GLStream().record(P.GLFN.BIND_ATTRIB_LOCATION, bytes).call("LINK_PROGRAM", 5));
                }
                const cpu = shadow.current.group.programs.get(5), color = cpu.linked.uniforms.find(u => u.name === "colors"), slot = cpu.linked.attributes.find(a => a.name === "position").location;
                const draw = new GLStream().uniformfv(color.location + 1, 4, 1, [0.2, 0.4, 0.8, 1]).call("CLEAR_COLOR", 0, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT).call("BEGIN", GL.QUADS);
                for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) draw.call("VERTEX_ATTRIB4F", slot, x, y, 0, 1).call("VERTEX3F", 0, 0, 0);
                draw.call("END"); const pixel = draw.readPixels(8, 8, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4); await submit(draw);
                check(pixel.view.getUint32(P.F.READ_PIXELS.status, true) === 1 && [51, 102, 204, 255].every((n, i) => Math.abs(n - pixel.bytes[32 + i]) <= 1), "resolved interface pixel " + pixel.bytes.subarray(32));
                const renderer = gpu.current.shareGroup.programs.get(5);
                check(renderer.cpuObjectId === cpu.objectId && renderer.cpuLinkGeneration === generation, "object and link identity");
                check(renderer.adoptedAttribLocations.get("position") === slot, "resolved attribute location");
            }
            check(!gpu.hostErrors.length && !gpu.gpuErrors.errors.length && !gpu.stats.refusals, "host failure");
        }
        document.getElementById("result").textContent = "PASS -- complete CPU program interfaces render without location queries; explicit attribute relink and uniform arrays work in both modes";
    } catch (error) { document.getElementById("result").textContent = "FAIL " + (error.stack || error); }
})();
</script>
