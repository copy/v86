<script>
(async()=>{
    "use strict";
    const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const reference=await(await fetch("gl_conformance/polygon_order_reference.json")).json();
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const s=GLPolygonOrderCases.scene(new GLStream().makeCurrent(1,0,0,16,16,1,1)),pixels=reference.probes.map(p=>s.readPixels(p.x,p.y,1,1,GL.RGBA,GL.UNSIGNED_BYTE,4));
            const memory=s.bytes(),segments=cpu.process(memory);
            for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}
            await gpu.idle();check(!cpu.current.error,"CPU error");
            for(let i=0;i<pixels.length;i++){const p=pixels[i],actual=Array.from(p.bytes.subarray(P.RECORDS.READ_PIXELS.size));check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,"status");check(reference.probes[i].rgba.every((v,j)=>Math.abs(v-actual[j])<=1),"probe "+i+": "+actual+" expected "+reference.probes[i].rgba);}
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals,"host failure");gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS mixed polygon fill/line preserves original primitive blending order in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
