<!doctype html>
<meta charset="utf-8">
<title>VX: Venus's transfers on WebGPU</title>
<pre id="result">RUNNING</pre>
<script src="../../build/glbridge/libv86-webgpu.js"></script>
<script type="module">
// The renderer half of virtio-gpu's Venus contexts (vx/vx_executor.js),
// through the page's renderer (svga_renderer.js) as the device drives it:
// VX batches of memory and images, a submission's transfer commands
// (copies, fills, updates, buffer-image copies of WebGPU's pitch and of
// others, clears, blits, resolves), and readbacks of memory.
import { GXWriter, VX, VX_MAGIC, QUERY_REGION_BYTES } from "../../src/graphics_adapters/renderer_protocol.js";

const result = document.getElementById("result");
const checks = [];
const check = (value, message) => { if(!value) throw new Error(message); checks.push(message); };
const f32 = v => new Uint32Array(new Float32Array([v]).buffer)[0];

(async () => {
    try {
        const handlers = [null, null];
        const end = (self, other) => ({ post: message => handlers[other] && handlers[other](message), listen: handler => { handlers[self] = handler; } });
        const renderer = globalThis.V86SVGARenderer(end(1, 0), {});
        const device = end(0, 1);
        const answers = new Map(), done = new Map();
        device.listen(message => {
            if(message.type === "write" && message.offset === QUERY_REGION_BYTES)
            {
                const v = new DataView(message.bytes.buffer, message.bytes.byteOffset);
                answers.set(v.getUint32(0, true), v.getUint32(12, true) === 1 ? message.bytes.slice(16, 16 + v.getUint32(4, true)) : null);
            }
            if(message.type === "done") { const resolve = done.get(message.seq); if(resolve) resolve(); }
            if(message.type === "lost") throw new Error("renderer lost: " + message.reason);
        });
        let seq = 0, request = 1;
        const w = new GXWriter(VX_MAGIC);
        const send = () => {
            const s = ++seq;
            const finished = new Promise(resolve => done.set(s, resolve));
            device.post({ type: "submit", seq: s, bytes: w.finish(), stream: "vx" });
            return finished;
        };
        /** read memory back: the bytes */
        const read = async (id, offset, length) => {
            const r = request++;
            w.command(VX.MEMORY_READ, [id, offset, 0, length, r]);
            await send();
            return answers.get(r);
        };

        // Memory: writes, copies, fills, updates
        const A = 1, B = 2;
        w.command(VX.MEMORY_CREATE, [A, 4096, 0]);
        w.command(VX.MEMORY_CREATE, [B, 4096, 0]);
        const pattern = Uint8Array.from({ length: 4096 }, (_, i) => i * 7 & 0xFF);
        w.command(VX.MEMORY_WRITE, [A, 0, 0, 4096], pattern);
        w.command(VX.BEGIN, []);
        w.command(VX.COPY_BUFFER, [A, 64, 0, B, 128, 0, 64, 0]);
        w.command(VX.FILL_BUFFER, [B, 512, 0, 64, 0, 0xAABBCCDD]);
        w.command(VX.FILL_BUFFER, [B, 1024, 0, 16, 0, 0]);
        w.command(VX.UPDATE_BUFFER, [B, 768, 0, 6], Uint8Array.from([1, 2, 3, 4, 5, 6]));
        w.command(VX.END, []);
        let bytes = await read(B, 0, 2048);
        check(bytes && bytes.length === 2048, "memory read back");
        check(bytes.slice(128, 192).every((v, i) => v === pattern[64 + i]), "COPY_BUFFER");
        check(new Uint32Array(bytes.buffer, 512, 16).every(v => v === 0xAABBCCDD), "FILL_BUFFER with a value");
        check(bytes.slice(768, 774).join() === "1,2,3,4,5,6", "UPDATE_BUFFER");
        check((await read(A, 3, 5)).join() === Array.from(pattern.slice(3, 8)).join(), "a read at an odd offset");

        // An image of R8G8B8A8_UNORM, 16x16, 2 mips: in from memory at a
        // pitch of 64 bytes (row by row), out at 256 (WebGPU's)
        const IMG = 3, IMG2 = 4;
        w.command(VX.TEXTURE_CREATE, [IMG, 37, 1, 16, 16, 1, 2, 1, 1, 0x17, 0]);
        w.command(VX.TEXTURE_CREATE, [IMG2, 37, 1, 16, 16, 1, 1, 1, 1, 0x17, 0]);
        w.command(VX.BEGIN, []);
        w.command(VX.COPY_BUFFER_IMAGE, [1, A, 0, 0, 0, 0, IMG, 1, 0, 0, 1, 0, 0, 0, 16, 16, 1]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 0, 0, 64, 0, IMG, 1, 0, 0, 1, 0, 0, 0, 16, 16, 1]);
        w.command(VX.END, []);
        bytes = await read(B, 0, 4096);
        check(Array.from({ length: 16 }).every((_, r) => bytes.slice(r * 256, r * 256 + 64).every((v, i) => v === pattern[r * 64 + i])),
            "COPY_BUFFER_IMAGE: in at a pitch of 64, out at 256");

        // CLEAR_IMAGE (0.5, 0.25, 1, 0) on mip 1; COPY_IMAGE of mip 0 into the other image
        w.command(VX.BEGIN, []);
        w.command(VX.CLEAR_IMAGE, [IMG, 1, 1, 1, 0, 1, f32(0.5), f32(0.25), f32(1), f32(0)]);
        w.command(VX.COPY_IMAGE, [IMG, 1, 0, 0, 4, 4, 0, IMG2, 1, 0, 0, 0, 0, 0, 8, 8, 1, 1]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 0, 0, 0, 0, IMG, 1, 1, 0, 1, 0, 0, 0, 8, 8, 1]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 1024, 0, 0, 0, IMG2, 1, 0, 0, 1, 0, 0, 0, 16, 16, 1]);
        w.command(VX.END, []);
        bytes = await read(B, 0, 4096);
        check(bytes.slice(0, 4).join() === "128,64,255,0", "CLEAR_IMAGE of mip 1: " + bytes.slice(0, 4).join());
        check(bytes.slice(1024, 1028).join() === Array.from(pattern.slice(4 * 64 + 16, 4 * 64 + 20)).join(), "COPY_IMAGE");

        // BLIT_IMAGE: mip 0 (16x16) into IMG2's 8x8 corner, flipped horizontally, nearest
        w.command(VX.BEGIN, []);
        w.command(VX.CLEAR_IMAGE, [IMG2, 1, 0, 1, 0, 1, 0, 0, 0, 0]);
        w.command(VX.BLIT_IMAGE, [IMG, 0, 0, 0, 0, 0, 16, 16, 1, IMG2, 0, 0, 8, 0, 0, 0, 8, 1, 1, 0]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 0, 0, 64, 0, IMG2, 1, 0, 0, 1, 0, 0, 0, 16, 16, 1]);
        w.command(VX.END, []);
        bytes = await read(B, 0, 4096);
        // dst (0, 0) of the flipped blit samples the source near (15, 0)
        const src = (x, y) => Array.from(pattern.slice((y * 16 + x) * 4, (y * 16 + x) * 4 + 4)).join();
        check(bytes.slice(0, 4).join() === src(15, 1) || bytes.slice(0, 4).join() === src(14, 0) || bytes.slice(0, 4).join() === src(15, 0),
            "BLIT_IMAGE, flipped: " + bytes.slice(0, 4).join() + " vs " + src(15, 0));
        check(bytes.slice(8 * 4, 8 * 4 + 4).join() === "0,0,0,0", "outside of the blit: the clear");

        // Depth: D32_SFLOAT cleared to 0.75, copied out
        const DEPTH = 5;
        w.command(VX.TEXTURE_CREATE, [DEPTH, 126, 1, 8, 8, 1, 1, 1, 1, 0x23, 0]);
        w.command(VX.BEGIN, []);
        w.command(VX.CLEAR_IMAGE, [DEPTH, 2, 0, 1, 0, 1, f32(0.75), 0, 0, 0]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 0, 0, 64, 0, DEPTH, 2, 0, 0, 1, 0, 0, 0, 8, 8, 1]);
        w.command(VX.END, []);
        bytes = await read(B, 0, 256);
        check(new Float32Array(bytes.buffer, 0, 1)[0] === 0.75, "depth cleared and copied: " + new Float32Array(bytes.buffer, 0, 1)[0]);

        // MSAA: a 4x image cleared, resolved into a 1x one
        const MS = 6, RES = 7;
        w.command(VX.TEXTURE_CREATE, [MS, 37, 1, 8, 8, 1, 1, 1, 4, 0x10, 0]);
        w.command(VX.TEXTURE_CREATE, [RES, 37, 1, 8, 8, 1, 1, 1, 1, 0x13, 0]);
        w.command(VX.BEGIN, []);
        w.command(VX.CLEAR_IMAGE, [MS, 1, 0, 1, 0, 1, f32(1), f32(0), f32(0.5), f32(1)]);
        w.command(VX.RESOLVE_IMAGE, [MS, 0, 0, 0, 0, RES, 0, 0, 0, 0, 8, 8, 1]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 0, 0, 64, 0, RES, 1, 0, 0, 1, 0, 0, 0, 8, 8, 1]);
        w.command(VX.END, []);
        bytes = await read(B, 0, 4);
        check(bytes.join() === "255,0,128,255", "RESOLVE_IMAGE: " + bytes.join());

        // a resolve of a region (4x4 from (2, 2)) into an image of another
        // size (16x16) at (8, 4): the rest of the image keeps its clear
        const BIG = 8;
        w.command(VX.TEXTURE_CREATE, [BIG, 37, 1, 16, 16, 1, 1, 1, 1, 0x13, 0]);
        w.command(VX.BEGIN, []);
        w.command(VX.CLEAR_IMAGE, [BIG, 1, 0, 1, 0, 1, f32(0), f32(1), f32(0), f32(1)]);
        w.command(VX.RESOLVE_IMAGE, [MS, 0, 0, 2, 2, BIG, 0, 0, 8, 4, 4, 4, 1]);
        w.command(VX.COPY_BUFFER_IMAGE, [0, B, 0, 0, 64, 0, BIG, 1, 0, 0, 1, 0, 0, 0, 16, 16, 1]);
        w.command(VX.END, []);
        bytes = await read(B, 0, 4096);
        const pixel = (x, y) => bytes.slice(y * 256 + x * 4, y * 256 + x * 4 + 4).join();
        check(pixel(8, 4) === "255,0,128,255" && pixel(11, 7) === "255,0,128,255", "RESOLVE_IMAGE of a region: " + pixel(8, 4) + " " + pixel(11, 7));
        check(pixel(7, 4) === "0,255,0,255" && pixel(12, 4) === "0,255,0,255" && pixel(8, 8) === "0,255,0,255",
            "outside the resolved region: the clear: " + pixel(7, 4) + " " + pixel(12, 4) + " " + pixel(8, 8));

        // Transform feedback (VK_EXT_transform_feedback, vx/naga/src/xfb.rs): the
        // SPIR-V of this vertex shader (glslc -fshader-stage=vert --target-env=vulkan1.1):
        //   layout(location = 0) in vec2 a_pos;
        //   layout(location = 1) in vec4 a_color;   // R8G8B8A8_UNORM
        //   layout(location = 2) in uint a_id;      // R32_UINT
        //   layout(set = 0, binding = 0) uniform U { vec4 scale; } u;
        //   layout(location = 0, xfb_buffer = 0, xfb_offset = 16, xfb_stride = 32) out vec4 v_color;
        //   layout(location = 1, xfb_buffer = 1, xfb_offset = 0, xfb_stride = 4) out flat uint v_id;
        //   out gl_PerVertex { layout(xfb_buffer = 0, xfb_offset = 0) vec4 gl_Position; };
        //   void main() { gl_Position = vec4(a_pos * u.scale.xy, 0.0, 1.0); v_color = a_color;
        //       v_id = a_id * 10u + uint(gl_VertexIndex) + 100u * uint(gl_InstanceIndex); }
        // 3 points, 2 instances, rasterizer discard: buffer 0 gets the position
        // and the color (32 bytes a vertex), buffer 1 the id; End writes the
        // counters, the query the primitives; a second draw resumes from the
        // counters and fits 2 of its 3 points into buffer 0's 256 bytes
        const XFB_SPV = Uint8Array.from(atob("AwIjBwADAQAKAA0ANwAAAAAAAAARAAIAAQAAABEAAgA1AAAACwAGAAEAAABHTFNMLnN0ZC40NTAAAAAADgADAAAAAAABAAAADwANAAAAAAAEAAAAbWFpbgAAAAAKAAAADwAAACAAAAAiAAAAJgAAACgAAAAtAAAAMgAAABAAAwAEAAAACwAAAAMAAwACAAAAwgEAAAQACgBHTF9HT09HTEVfY3BwX3N0eWxlX2xpbmVfZGlyZWN0aXZlAAAEAAgAR0xfR09PR0xFX2luY2x1ZGVfZGlyZWN0aXZlAAUABAAEAAAAbWFpbgAAAAAFAAYACAAAAGdsX1BlclZlcnRleAAAAAAGAAYACAAAAAAAAABnbF9Qb3NpdGlvbgAFAAMACgAAAAAAAAAFAAQADwAAAGFfcG9zAAAABQADABEAAABVAAAABgAFABEAAAAAAAAAc2NhbGUAAAAFAAMAEwAAAHUAAAAFAAQAIAAAAHZfY29sb3IABQAEACIAAABhX2NvbG9yAAUABAAmAAAAdl9pZAAAAAAFAAQAKAAAAGFfaWQAAAAABQAGAC0AAABnbF9WZXJ0ZXhJbmRleAAABQAHADIAAABnbF9JbnN0YW5jZUluZGV4AAAAAEgABQAIAAAAAAAAACMAAAAAAAAASAAFAAgAAAAAAAAACwAAAAAAAABHAAMACAAAAAIAAABHAAQACgAAACQAAAAAAAAARwAEAAoAAAAlAAAAIAAAAEcABAAPAAAAHgAAAAAAAABIAAUAEQAAAAAAAAAjAAAAAAAAAEcAAwARAAAAAgAAAEcABAATAAAAIgAAAAAAAABHAAQAEwAAACEAAAAAAAAARwAEACAAAAAeAAAAAAAAAEcABAAgAAAAJAAAAAAAAABHAAQAIAAAACUAAAAgAAAARwAEACAAAAAjAAAAEAAAAEcABAAiAAAAHgAAAAEAAABHAAMAJgAAAA4AAABHAAQAJgAAAB4AAAABAAAARwAEACYAAAAkAAAAAQAAAEcABAAmAAAAJQAAAAQAAABHAAQAJgAAACMAAAAAAAAARwAEACgAAAAeAAAAAgAAAEcABAAtAAAACwAAACoAAABHAAQAMgAAAAsAAAArAAAAEwACAAIAAAAhAAMAAwAAAAIAAAAWAAMABgAAACAAAAAXAAQABwAAAAYAAAAEAAAAHgADAAgAAAAHAAAAIAAEAAkAAAADAAAACAAAADsABAAJAAAACgAAAAMAAAAVAAQACwAAACAAAAABAAAAKwAEAAsAAAAMAAAAAAAAABcABAANAAAABgAAAAIAAAAgAAQADgAAAAEAAAANAAAAOwAEAA4AAAAPAAAAAQAAAB4AAwARAAAABwAAACAABAASAAAAAgAAABEAAAA7AAQAEgAAABMAAAACAAAAIAAEABQAAAACAAAABwAAACsABAAGAAAAGQAAAAAAAAArAAQABgAAABoAAAAAAIA/IAAEAB4AAAADAAAABwAAADsABAAeAAAAIAAAAAMAAAAgAAQAIQAAAAEAAAAHAAAAOwAEACEAAAAiAAAAAQAAABUABAAkAAAAIAAAAAAAAAAgAAQAJQAAAAMAAAAkAAAAOwAEACUAAAAmAAAAAwAAACAABAAnAAAAAQAAACQAAAA7AAQAJwAAACgAAAABAAAAKwAEACQAAAAqAAAACgAAACAABAAsAAAAAQAAAAsAAAA7AAQALAAAAC0AAAABAAAAKwAEACQAAAAxAAAAZAAAADsABAAsAAAAMgAAAAEAAAA2AAUAAgAAAAQAAAAAAAAAAwAAAPgAAgAFAAAAPQAEAA0AAAAQAAAADwAAAEEABQAUAAAAFQAAABMAAAAMAAAAPQAEAAcAAAAWAAAAFQAAAE8ABwANAAAAFwAAABYAAAAWAAAAAAAAAAEAAACFAAUADQAAABgAAAAQAAAAFwAAAFEABQAGAAAAGwAAABgAAAAAAAAAUQAFAAYAAAAcAAAAGAAAAAEAAABQAAcABwAAAB0AAAAbAAAAHAAAABkAAAAaAAAAQQAFAB4AAAAfAAAACgAAAAwAAAA+AAMAHwAAAB0AAAA9AAQABwAAACMAAAAiAAAAPgADACAAAAAjAAAAPQAEACQAAAApAAAAKAAAAIQABQAkAAAAKwAAACkAAAAqAAAAPQAEAAsAAAAuAAAALQAAAHwABAAkAAAALwAAAC4AAACAAAUAJAAAADAAAAArAAAALwAAAD0ABAALAAAAMwAAADIAAAB8AAQAJAAAADQAAAAzAAAAhAAFACQAAAA1AAAAMQAAADQAAACAAAUAJAAAADYAAAAwAAAANQAAAD4AAwAmAAAANgAAAP0AAQA4AAEA"), c => c.charCodeAt(0));
        const SH = 20, PIPE = 21, VB0 = 22, VB1 = 23, UB = 24, XB0 = 25, XB1 = 26, CNT = 27, XRT = 28, XRTV = 29, QP = 30, QPM = 31;
        for(const [id, size] of [[VB0, 256], [VB1, 256], [UB, 256], [XB0, 256], [XB1, 256], [CNT, 256], [QPM, 256]]) w.command(VX.MEMORY_CREATE, [id, size, 0]);
        w.command(VX.MEMORY_WRITE, [VB0, 0, 0, 24], new Uint8Array(Float32Array.from([1, 2, 3, 4, 5, 6]).buffer));
        const vb1 = new DataView(new ArrayBuffer(24));
        [[255, 0, 128, 51, 7], [0, 255, 0, 255, 8], [51, 102, 153, 204, 9]].forEach(([r, g, bl, a, id], i) => {
            vb1.setUint8(i * 8, r); vb1.setUint8(i * 8 + 1, g); vb1.setUint8(i * 8 + 2, bl); vb1.setUint8(i * 8 + 3, a); vb1.setUint32(i * 8 + 4, id, true);
        });
        w.command(VX.MEMORY_WRITE, [VB1, 0, 0, 24], new Uint8Array(vb1.buffer));
        w.command(VX.MEMORY_WRITE, [UB, 0, 0, 16], new Uint8Array(Float32Array.from([0.5, 2, 0, 0]).buffer));
        w.command(VX.TEXTURE_CREATE, [XRT, 37, 1, 8, 8, 1, 1, 1, 1, 0x13, 0]);
        w.command(VX.VIEW_CREATE, [XRTV, XRT, 1, 37, 1, 0, 1, 0, 1, 0, 0, 0, 0]);
        w.command(VX.QUERY_POOL_CREATE, [QP, 1000028004, 1]);
        w.command(VX.SHADER_CREATE, [SH, XFB_SPV.length], XFB_SPV);
        const json = o => new TextEncoder().encode(JSON.stringify(o));
        w.command(VX.PIPELINE_CREATE, [PIPE], json({ kind: "graphics", stages: [{ shader: SH, stage: 1, entry: "main", constants: {} }],
            buffers: [{ binding: 0, stride: 8, rate: 0 }, { binding: 1, stride: 8, rate: 0 }],
            attributes: [{ location: 0, binding: 0, format: 103, offset: 0 }, { location: 1, binding: 1, format: 37, offset: 0 }, { location: 2, binding: 1, format: 98, offset: 4 }],
            topology: 0, restart: false, cull: 0, front: 0, polygon: 0, depth_clamp: false, discard: true, depth_bias: null, samples: 1, sample_mask: 0xFFFFFFFF,
            alpha_to_coverage: false, depth: null, depth_format: 0, targets: [{ format: 37, blend: false, write_mask: 15 }], blend_constants: [0, 0, 0, 0], dynamic: [],
            viewport: { x: 0, y: 0, width: 8, height: 8, minDepth: 0, maxDepth: 1 }, scissor: { offset: { x: 0, y: 0 }, extent: { width: 8, height: 8 } },
            set_count: 1, push_size: 0 }));
        const xfb_draw = (draw, resume) => {
            w.command(VX.BEGIN_PASS, [], json({ colors: [{ view: XRTV, load: 1, store: 0, clear: [0, 0, 0, 0], resolve: 0 }], depth: null, width: 8, height: 8 }));
            w.command(VX.BIND_PIPELINE, [PIPE]);
            w.command(VX.SET_BIND_GROUP, [0, 1, 0, 0, 6, UB, 0, 0, 0, 16]);
            w.command(VX.SET_VERTEX_BUFFER, [0, VB0, 0, 0, 256, 0]);
            w.command(VX.SET_VERTEX_BUFFER, [1, VB1, 0, 0, 256, 0]);
            w.command(VX.XFB_BIND, [0, XB0, 0, 0, 256, 0]);
            w.command(VX.XFB_BIND, [1, XB1, 0, 0, 256, 0]);
            w.command(VX.BEGIN_QUERY, [QP, 0]);
            w.command(VX.XFB_BEGIN, resume ? [0, 2, CNT, 0, 0, CNT, 4, 0] : [0, 0]);
            w.command(VX.DRAW, draw);
            w.command(VX.XFB_END, [0, 2, CNT, 0, 0, CNT, 4, 0]);
            w.command(VX.END_QUERY, [QP, 0, QPM]);
            w.command(VX.END_PASS, []);
        };
        w.command(VX.BEGIN, []);
        xfb_draw([3, 2, 0, 0], false);
        w.command(VX.END, []);
        const xb0 = new Float32Array((await read(XB0, 0, 256)).buffer), xb1 = new Uint32Array((await read(XB1, 0, 256)).buffer);
        const cnt = new Uint32Array((await read(CNT, 0, 8)).buffer), qp = new Uint32Array((await read(QPM, 0, 16)).buffer);
        const near = (a, b) => Math.abs(a - b) < 1e-5;
        const positions = [0, 1, 2, 3, 4, 5].map(k => Array.from(xb0.subarray(k * 8, k * 8 + 4)));
        check(positions.every((p, k) => near(p[0], [0.5, 1.5, 2.5][k % 3]) && near(p[1], [4, 8, 12][k % 3]) && p[2] === 0 && p[3] === 1),
            "transform feedback: the positions, instance by instance: " + JSON.stringify(positions) + " (" + renderer.vx.warnings.join("; ") + ")");
        check(near(xb0[4], 1) && near(xb0[5], 0) && near(xb0[6], 128 / 255) && near(xb0[7], 51 / 255) && near(xb0[8 + 5], 1),
            "transform feedback: the colors (R8G8B8A8_UNORM): " + Array.from(xb0.subarray(4, 8)));
        check(Array.from(xb1.subarray(0, 6)).join() === "70,81,92,170,181,192", "transform feedback: the ids (vertex and instance indices): " + Array.from(xb1.subarray(0, 6)));
        check(cnt[0] === 192 && cnt[1] === 24, "transform feedback: the counters End wrote: " + Array.from(cnt));
        check(qp[0] === 6 && qp[2] === 6, "transform feedback: the query, 6 primitives written of 6: " + Array.from(qp));
        w.command(VX.BEGIN, []);
        xfb_draw([3, 1, 0, 1], true);
        w.command(VX.END, []);
        const again = new Uint32Array((await read(XB1, 0, 64)).buffer), cnt2 = new Uint32Array((await read(CNT, 0, 8)).buffer);
        const qp2 = new Uint32Array((await read(QPM, 0, 16)).buffer);
        check(Array.from(again.subarray(6, 9)).join() === "170,181,0" && cnt2[0] === 256 && cnt2[1] === 32 && qp2[0] === 2 && qp2[2] === 3,
            "transform feedback: resumed from the counters, 2 of 3 points fit: " + [Array.from(again.subarray(6, 9)), Array.from(cnt2), Array.from(qp2)].join(" "));

        // DESTROY, then a read of what is gone fails
        w.command(VX.DESTROY, [A]);
        check(await read(A, 0, 4) === null, "a destroyed memory reads as nothing");

        const vx = renderer.vx;
        check(vx.errors === 0, "no errors: " + vx.warnings.join("; "));
        result.textContent = "PASS " + checks.length + " checks\n" + checks.join("\n");
    } catch(e) {
        result.textContent = "FAIL " + (e.stack || e) + "\n" + checks.join("\n");
    }
})();
</script>
