<script>
(async () => {
    "use strict";
    try {
        const { GLStream, GL } = GLTestStream, check = (ok, message) => { if (!ok) throw new Error(message); };
        const create = async () => {
            const canvas = document.createElement("canvas");canvas.width = canvas.height = 16;document.body.append(canvas);
            const gpu = new GLWebGPUExecutorModule.GLWebGPUExecutor(canvas, { strict: true });await gpu.initialize();return { gpu, canvas };
        };
        let { gpu, canvas } = await create();
        gpu.submit(new GLStream().makeCurrent(1, 0, 0, 16, 16, 1, 1).call("CLEAR_COLOR", 1, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT).bytes(), {});
        gpu.finishFrame(true);
        // The next frame is unfinished when the VM is stopped. It must stay
        // blue in GL storage while the last visible image remains red.
        gpu.submit(new GLStream().call("CLEAR_COLOR", 0, 0, 1, 1).call("CLEAR", GL.COLOR_BUFFER_BIT).bytes(), {});
        const saved = await gpu.saveSnapshot();
        for (const cold of [false, true]) {
            if (cold) ({ gpu, canvas } = await create());
            await gpu.restoreSnapshot(saved);gpu.restorePresentedFrame();gpu.flushFrame();await gpu.idle();
            const image = new Image();image.src = canvas.toDataURL();await image.decode();
            const copy = document.createElement("canvas");copy.width = copy.height = 16;const ctx = copy.getContext("2d");ctx.drawImage(image, 0, 0);
            check([...ctx.getImageData(8, 8, 1, 1).data].join() === "255,0,0,255", "last visible frame restored exactly, cold=" + cold);
            const stream = new GLStream(), pixel = stream.readPixels(8, 8, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4), memory = stream.bytes();
            gpu.options.writeGuestMemory = (at, bytes) => memory.set(bytes, at);gpu.submit(memory, {});await gpu.idle();
            check([...pixel.bytes.subarray(32, 36)].join() === "0,0,255,255", "unfinished back frame retained, cold=" + cold);
            gpu.finishFrame(true);await gpu.idle();check(!gpu.hostErrors.length && !gpu.gpuErrors.errors.length, "GPU validation");
        }
        document.getElementById("result").textContent = "PASS exact last-presented red frame and unfinished blue back frame survive hot/cold GPU checkpoints";
    } catch (error) { document.getElementById("result").textContent = "FAIL " + error.stack; }
})();
</script>
