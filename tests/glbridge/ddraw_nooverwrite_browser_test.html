<script>
(async()=>{
'use strict';const P=D9WGProtocol,C=P.C,observations=[],browserErrors=[];let gpu,request=0;
window.addEventListener('error',e=>browserErrors.push(String(e.message)));window.addEventListener('unhandledrejection',e=>browserErrors.push(String(e.reason)));
const check=(v,m)=>{if(!v)throw Error(m)},cmd=(n,p,blobs)=>({opcode:P.OP[n],payload:p,...(blobs?{blobs}: {})}),rs=(state,value)=>cmd('SET_RENDER_STATE',{device_handle:1,state,value}),ts=(state,value)=>cmd('SET_TEXTURE_STAGE_STATE',{device_handle:1,stage:0,state,value});
function vertices(color){const data=new Uint8Array(80),v=new DataView(data.buffer),xy=[[0,0],[8,0],[0,8],[8,8]];for(let i=0;i<4;i++){v.setFloat32(i*20,xy[i][0],true);v.setFloat32(i*20+4,xy[i][1],true);v.setFloat32(i*20+8,.5,true);v.setFloat32(i*20+12,1,true);v.setUint32(i*20+16,color,true);}return data;}
const upload=(color,flags)=>cmd('UPDATE_BUFFER',{resource_handle:20,byte_count:80,lock_flags:flags},[{field:'data_offset',data:vertices(color)}]);
async function send(commands){await gpu.submit(P.encodeBatch(commands),{ownerToken:88,writeGuestMemory(){}});await gpu.checkpointIdle();}
async function read(){let reply;const id=++request;await gpu.submit(P.encodeBatch([cmd('READBACK_SURFACE',{device_handle:1,texture_handle:2,format:21,width:8,height:8,row_count:8,destination_pitch:32,destination_bytes:256,response_offset:C.D9WG_READBACK_REGION_OFFSET,request_id:id})]),{ownerToken:88,writeGuestMemory(at,bytes){if(bytes.length===272&&new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength).getUint32(0,true)===id)reply=bytes.slice();}});await gpu.checkpointIdle();check(reply&&new DataView(reply.buffer).getUint32(P.F.ReadbackResponse.status,true)===C.D9WG_RESPONSE_OK,'GPU readback failed');return reply.subarray(16);}
try{
 gpu=new D3D9WebGPUExecutor(document.querySelector('canvas'),{strict:true,useShaderWorker:false});await gpu.initialize();
 const elements=new Uint8Array([...P.encode('VertexElement',{stream:0,offset:0,type:3,usage:9}),...P.encode('VertexElement',{stream:0,offset:16,type:4,usage:10})]),prefix=P.encode('SetFVF',{device_handle:1,fvf:0x44,element_count:2}),fvf=new Uint8Array(prefix.length+elements.length);fvf.set(prefix);fvf.set(elements,prefix.length);
 await send([cmd('CREATE_DEVICE',{device_handle:1,width:8,height:8}),cmd('CREATE_TEXTURE_2D',{device_handle:1,resource_handle:2,width:8,height:8,level_count:1,format:21,usage:1}),cmd('SET_RENDER_TARGET',{device_handle:1,color_texture_handle:2}),cmd('SET_DEPTH_STENCIL_SURFACE_LEVEL',{device_handle:1,depth_texture_handle:0}),cmd('CREATE_BUFFER',{device_handle:1,resource_handle:20,resource_kind:1,byte_count:80}),{opcode:P.OP.SET_FVF,payload:fvf},cmd('SET_STREAM_SOURCE',{device_handle:1,buffer_handle:20,stride:20}),cmd('SET_VIEWPORT',{device_handle:1,width:8,height:8,max_z:1}),rs(7,0),rs(22,1),rs(137,0),rs(27,0),ts(1,2),ts(2,0),ts(4,2),ts(5,0)]);
 for(const flags of[0,0x2000,0x1000,0x3000]){
  await send([cmd('CLEAR',{device_handle:1,clear_flags:1,color:0xff0000ff,depth:1}),upload(0xff00ff00,0x2000),cmd('DRAW_PRIMITIVE',{device_handle:1,primitive_type:5,primitive_count:2}),upload(0xffffff00,flags)]);
  const bytes=await read(),wanted=flags&0x1000?[0,255,255,255]:[0,255,0,255];let compared=0,maxError=0;for(let y=2;y<6;y++)for(let x=2;x<6;x++){const actual=[...bytes.subarray((y*8+x)*4,(y*8+x)*4+4)];maxError=Math.max(maxError,...actual.map((n,i)=>Math.abs(n-wanted[i])));compared++;}observations.push({flags,compared,maxError,wanted});check(maxError===0,'Map flags '+flags.toString(16)+' yielded unexpected draw pixels '+maxError);
 }
 await gpu.endOwnerSessions(88);await gpu.checkpointIdle();check(!browserErrors.length&&!gpu.hostErrors.length&&!gpu.gpuErrors.errors.length&&!gpu.stats.commandsFailed&&!gpu.stats.droppedDraws,'GPU/host errors');check(!gpu.devices.size&&!gpu.resources.size&&gpu.sessionStates.size===0,'Owner resources retained');
 await fetch('/__test_file?name=ddraw-nooverwrite.json',{method:'POST',body:JSON.stringify({observations,browserErrors,stats:gpu.stats,hostErrors:gpu.hostErrors,gpuErrors:gpu.gpuErrors.errors},null,2)});document.querySelector('#result').textContent='PASS NOOVERWRITE: four flag combinations,64 exact GPU pixels, ordered ordinary/discard draws and unsynchronised pending draws';
}catch(e){await fetch('/__test_file?name=ddraw-nooverwrite.json',{method:'POST',body:JSON.stringify({failed:true,error:String(e.stack),observations,browserErrors,stats:gpu&&gpu.stats,hostErrors:gpu&&gpu.hostErrors,gpuErrors:gpu&&gpu.gpuErrors.errors},null,2)});document.querySelector('#result').textContent='FAIL '+e.stack;}
})();
</script>
