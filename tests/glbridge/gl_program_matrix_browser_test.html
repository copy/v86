<script>
(async () => {
    "use strict";
    const P = GLProtocol, { GLStream, GL } = GLTestStream, check = (ok, message) => { if (!ok) throw new Error(message); };
    try {
        for (const copied of [false, true]) {
            const shadow = new V86GLShadow.GLShadow(), gpu = new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"), { strict: true });
            await gpu.initialize(); shadow.setCapabilities(gpu.capabilities());
            gpu.options.writeGuestMemory = (at, bytes, metadata) => metadata.memory.set(bytes, at + metadata.baseOffset);
            const submit = async stream => {
                const memory = stream.bytes(), segments = shadow.process(memory);
                for (const segment of segments || [{ offset: 0, length: memory.length }]) {
                    const bytes = segment.bytes || memory.subarray(segment.offset, segment.offset + segment.length);
                    gpu.submit(copied ? bytes.slice() : bytes, { memory, baseOffset: segment.bytes ? 0 : segment.offset });
                }
                await gpu.idle(); check(!shadow.current.error, "CPU error " + shadow.current.error + " " + shadow.current.group.arbPrograms?.get(2)?.log);
            };
            const matrix = new Float32Array([2, 0, 0, 0, 1, 4, 0, 0, 0, 0, 5, 0, -2, -4, -5, 1]);
            await submit(new GLStream().makeCurrent(1, 0, 0, 16, 16, 1, 1).call("VIEWPORT", 0, 0, 16, 16)
                .call("MATRIX_MODE", GL.MATRIX0_ARB + 7).record(P.GLFN.LOAD_MATRIXF, new Uint8Array(matrix.buffer)).call("MATRIX_MODE", GL.MODELVIEW)
                .call("BIND_PROGRAM_ARB", GL.VERTEX_PROGRAM_ARB, 1).programStringARB(GL.VERTEX_PROGRAM_ARB, "!!ARBvp1.0\nMOV result.position, vertex.position;\nEND")
                .call("ENABLE", GL.VERTEX_PROGRAM_ARB).call("BIND_PROGRAM_ARB", GL.FRAGMENT_PROGRAM_ARB, 2).call("ENABLE", GL.FRAGMENT_PROGRAM_ARB));
            for (const [modifier, expected] of [["", [0.7, 0.6, 0.5, 0.3]], [".transpose", [0.7, 0.5, 0.5, 0.5]],
                [".inverse", [0.55, 0.4875, 0.5, 0.55]], [".invtrans", [0.55, 0.5, 0.5, 0.5]]]) {
                const stream = new GLStream().programStringARB(GL.FRAGMENT_PROGRAM_ARB,
                    "!!ARBfp1.0\nPARAM m[4] = { state.matrix.program[7]" + modifier + " };\nMAD result.color, m[0], {0.1,0.1,0.1,0.1}, {0.5,0.5,0.5,0.5};\nEND")
                    .call("CLEAR_COLOR", 0, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT).call("BEGIN", GL.QUADS);
                for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) stream.call("VERTEX3F", x, y, 0);
                stream.call("END"); const pixel = stream.readPixels(8, 8, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4); await submit(stream);
                check(pixel.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "readback status");
                check(expected.every((value, i) => Math.abs(pixel.bytes[32 + i] - value * 255) <= 1), "program matrix " + modifier + " got=" + pixel.bytes.subarray(32));
            }
            check(!gpu.hostErrors.length && !gpu.gpuErrors.errors.length && !gpu.stats.refusals, "host failure");
        }
        document.getElementById("result").textContent = "PASS -- ARB program matrix rows, transpose, inverse and inverse transpose render expected pixels in both modes";
    } catch (error) { document.getElementById("result").textContent = "FAIL " + (error.stack || error); }
})();
</script>
