<!doctype html><meta charset="utf-8"><title>Performance recorder integration</title>
<pre id="result">RUNNING</pre>
<script>globalThis.DEBUG = false;</script>
<script src="../../build/libv86.js"></script>
<script type="module">
import { PerformanceRecorder } from "../../src/browser/performance_recorder.js";
(async () => {
    const checks = [];
    const check = (ok, label) => { if (!ok) throw new Error(label); checks.push(label); };
    const bios = new Uint8Array(65536).fill(0xf4);
    bios.set([0xea, 0x00, 0x01, 0x00, 0xf0], 0xfff0); // jmp F000:0100
    bios.set([0x40, 0xeb, 0xfd], 0x100); // inc ax; jmp back
    const emulator = new V86({ graphics_adapter: "bochs_vga", wasm_path: "../../build/v86.wasm", memory_size: 32 * 1024 * 1024,
        bios: { buffer: bios.buffer }, hda: { buffer: new ArrayBuffer(2 * 1024 * 1024) },
        disable_keyboard: true, disable_mouse: true, disable_speaker: true,
        net_device: { type: "none" }, autostart: false });
    await new Promise(resolve => emulator.add_listener("emulator-loaded", resolve));
    const recorder = new PerformanceRecorder(emulator);
    const cpu = emulator.v86.cpu;
    const originalLoop = cpu.main_loop;
    const disk = cpu.devices.ide.primary.master.buffer;
    const originalGet = disk.get;
    check(!!cpu.wm.exports.performance_recording_enable, "release Wasm exports opt-in counters");
    recorder.start();
    await new Promise(resolve => disk.get(0, 512, resolve));
    emulator.run();
    await new Promise(resolve => setTimeout(resolve, 700));
    await emulator.stop();
    recorder.mark("scene_ready");
    const report = recorder.stop();
    check(report.execution.interpreted_steps > 0, "counts interpreted execution in actual CPU");
    check(report.execution.jit_steps > 0, "counts generated JIT execution in actual CPU");
    check(report.summary.jit_requests > 0 && report.summary.jit_finished > 0, "tracks actual asynchronous Wasm compilation");
    check(report.counter_version === 4 && report.execution.sync_codegen_ms > 0 &&
        report.execution.sync_codegen_calls === report.summary.jit_requests, "times actual synchronous x86 code generation separately");
    check(report.hotspots.length > 0 && report.hotspots.every(row => row.samples > 0), "captures bounded non-halted entry hotspots");
    check(report.execution.execution_batch_ms > 0 && report.execution.hardware_irq_calls > 0 &&
        report.execution.hardware_irq_ms >= 0, "separates real execution batches from timer and IRQ handling");
    check(report.execution.execution_batch_ms + report.execution.hardware_irq_ms <= report.summary.main_loop_wall_ms + 1,
        "full batch and hardware timing fits inside observed main-loop time");
    check(report.execution.sampled_jit_chunks > 0 && report.execution_hotspots.some(row => row.jit === 1),
        "samples actual JIT execution chunks");
    check(report.execution_hotspots.reduce((sum, row) => sum + row.samples, 0) ===
        report.execution.sampled_jit_chunks + report.execution.sampled_interpreted_chunks,
        "bounded hotspot rows account for every sample when no groups are dropped");
    check(report.disks[0].completed > 0, "tracks actual emulator disk buffer reads");
    check(report.samples.length >= 2, "records bounded timeline samples");
    check(cpu.main_loop === originalLoop && disk.get === originalGet, "stop restores hot-path methods");

    // Interpreter-only: disable the JIT and drop compiled code.
    const configure = enabled => check(cpu.wm.exports.jit_set_enabled(enabled), "reconfigure the JIT");
    configure(0);
    cpu.jit_clear_cache();
    recorder.start();
    emulator.run();
    await new Promise(resolve => setTimeout(resolve, 100));
    await emulator.stop();
    const interpreted = recorder.stop();
    check(interpreted.execution.interpreted_steps > 0 && interpreted.execution.jit_steps === 0,
        "execution split correctly detects interpreter-only mode");
    check(interpreted.execution.sampled_interpreted_chunks > 0 && interpreted.execution.sampled_jit_chunks === 0 &&
        interpreted.execution_hotspots.length > 0 && interpreted.execution_hotspots.every(row => row.jit === 0),
        "interpreter-only sampling excludes JIT and records actual executing pages");
    configure(1);

    // Warm the same loop before alternating measurements. This is an observer
    // overhead smoke check, not a benchmark of actual game loading or old builds.
    emulator.run();
    await new Promise(resolve => setTimeout(resolve, 500));
    await emulator.stop();
    const overhead = [];
    for (const enabled of [false, true, true, false, false, true]) {
        if (enabled) recorder.start();
        const before = emulator.get_instruction_counter() >>> 0;
        const start = performance.now();
        emulator.run();
        await new Promise(resolve => setTimeout(resolve, 600));
        await emulator.stop();
        const ms = performance.now() - start;
        const steps = ((emulator.get_instruction_counter() >>> 0) - before) >>> 0;
        if (enabled) recorder.stop();
        overhead.push({ enabled, steps_per_ms: steps / ms });
    }

    // A short loop with port I/O (OUT every iteration), unlike the long
    // compiled loop above. (Until M11 of docs/jit-unification-plan.md a
    // 4-unit region execution budget returned to the dispatcher here.)
    cpu.jit_clear_cache();
    emulator.write_memory(new Uint8Array([0xfa, 0x40, 0xe6, 0x80, 0xeb, 0xfb]), 0xf0300);
    cpu.instruction_pointer[0] = 0xf0300;
    cpu.in_hlt[0] = 0;
    emulator.run();
    await new Promise(resolve => setTimeout(resolve, 300));
    await emulator.stop();
    const short_overhead = [];
    let short_recording;
    for(const enabled of [false, true, true, false, false, true]) {
        if(enabled) recorder.start();
        const before = emulator.get_instruction_counter() >>> 0;
        const start = performance.now();
        emulator.run();
        await new Promise(resolve => setTimeout(resolve, 400));
        await emulator.stop();
        const ms = performance.now() - start;
        const steps = ((emulator.get_instruction_counter() >>> 0) - before) >>> 0;
        if(enabled) short_recording = recorder.stop();
        short_overhead.push({ enabled, steps_per_ms: steps / ms });
    }
    const short = short_recording.execution;
    check(short.jit_chunks > 100000 && short.jit_steps / short.jit_chunks < 16,
        "stress workload actually executes many short JIT chunks");
    check(short.sampled_jit_chunks + short.sampled_interpreted_chunks <= Math.ceil(short_recording.duration_ms / 10) + 1,
        "millions of short chunks cannot exceed the wall-clock sample budget");
    check(short.sampled_jit_ms === null && short_recording.execution_hotspots.every(row => row.sampled_execution_ms === null),
        "tiny chunks are not assigned misleading browser-clock timings");

    // A halted CPU with interrupts disabled must request positive waits, without
    // inventing JIT/interpreter execution samples for repeated idle entries.
    emulator.write_memory(new Uint8Array([0xfa, 0xf4]), 0xf0200); // cli; hlt
    cpu.instruction_pointer[0] = 0xf0200;
    cpu.in_hlt[0] = 0;
    recorder.start();
    cpu.main_loop();
    for(let i = 0; i < 10; i++) cpu.main_loop();
    const idle = recorder.stop();
    check(idle.execution.halted_entry_calls >= 10 && idle.execution.positive_delay_returns >= 10 &&
        idle.execution.halted_returns >= 10, "distinguishes halted calls and requested positive scheduling delays");

    const saved = await emulator.save_state();
    recorder.start();
    await emulator.restore_state(saved);
    check(!recorder.active && recorder.report.reason === "state_restore", "state restore ends recording before replacing the timeline");
    check(cpu.main_loop === originalLoop && disk.get === originalGet, "restore detaches instrumentation");
    recorder.start();
    await emulator.destroy();
    check(!recorder.active && recorder.timer === null, "destroy releases recording timer and hooks");
    return { status: "PASS", checks, overhead, short_overhead, short_recording: short,
        recording: { execution: report.execution,
        summary: report.summary, duration_ms: report.duration_ms } };
})().catch(error => ({ status: "FAIL", error: error.stack })).then(result => {
    document.getElementById("result").textContent = JSON.stringify(result);
    fetch("/__test_result", { method: "POST", body: JSON.stringify(result) });
});
</script>
