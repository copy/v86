<!doctype html>
<meta charset="utf-8">
<title>GLES renderer for a Node test</title>
<pre id="result">RUNNING</pre>
<script src="../../build/glbridge/libv86-webgpu.js"></script>
<script>
// The page end of tests/gles/chrome_renderer.mjs: the renderer
// (V86SVGARenderer, its GLES executor) on this page's GPU, its channel's
// messages over HTTP (GET /gles/next, POST /gles/reply; five u32s, then the
// bytes padded to a u32; a snapshot's GLES state as tests/gles/chrome_renderer.mjs's encode_state).
// A request that fails (a suspend breaks them all) is made again: the
// answers read so far go with /gles/next, a reply's number with /gles/reply.
"use strict";
const KIND = { submit: 1, reset: 2, hello: 3, gles_save: 4, gles_restore: 5, done: 11, write: 12, frame: 13, lost: 14, caps: 15, gles_saved: 16 };

function encode_state([json, buffers])
{
    const text = new TextEncoder().encode(json);
    const out = new Uint8Array(8 + text.length + buffers.reduce((n, b) => n + 4 + b.length, 0));
    const view = new DataView(out.buffer);
    view.setUint32(0, text.length, true);
    out.set(text, 4);
    let at = 4 + text.length;
    view.setUint32(at, buffers.length, true);
    at += 4;
    for(const b of buffers)
    {
        view.setUint32(at, b.length, true);
        out.set(b, at + 4);
        at += 4 + b.length;
    }
    return out;
}

function decode_state(bytes)
{
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const length = view.getUint32(0, true);
    const json = new TextDecoder().decode(bytes.subarray(4, 4 + length));
    let at = 4 + length;
    const count = view.getUint32(at, true);
    at += 4;
    const buffers = [];
    for(let i = 0; i < count; i++)
    {
        const n = view.getUint32(at, true);
        buffers.push(bytes.slice(at + 4, at + 4 + n));
        at += 4 + n;
    }
    return [json, buffers];
}
let handler = null;
let outbox = [];
let sending = null;
let replies = 0;
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

/** a line on the test's console (lost if the server is out of reach) */
function log(text)
{
    fetch("/gles/log", { method: "POST", body: text }).catch(() => {});
}

function encode(messages)
{
    const size = messages.reduce((n, m) => n + 20 + ((m.bytes ? m.bytes.length : 0) + 3 & ~3), 0);
    const out = new Uint8Array(size), view = new DataView(out.buffer);
    let at = 0;
    for(const m of messages)
    {
        const length = m.bytes ? m.bytes.length : 0;
        [m.kind, m.a >>> 0, m.b >>> 0, 0, length].forEach((v, i) => view.setUint32(at + 4 * i, v, true));
        if(length) out.set(m.bytes, at + 20);
        at += 20 + (length + 3 & ~3);
    }
    return out;
}

/** the renderer's answers, posted together (in order) */
function flush()
{
    if(sending || !outbox.length) return;
    const body = encode(outbox);
    outbox = [];
    const n = ++replies;
    const post = () => fetch("/gles/reply?n=" + n, { method: "POST", body }).then(response => { if(!response.ok) throw new Error("HTTP " + response.status); })
        .catch(error => { log("reply " + n + " again after " + error); return pause(1000).then(post); });
    sending = post().finally(() => { sending = null; flush(); });
}

const channel = {
    post(message)
    {
        switch(message.type)
        {
            case "done": outbox.push({ kind: KIND.done, a: message.seq, b: 0, bytes: null }); break;
            case "write": outbox.push({ kind: KIND.write, a: message.offset || 0, b: 0, bytes: new Uint8Array(message.bytes) }); break;
            case "frame": outbox.push({ kind: KIND.frame, a: message.width, b: message.height, bytes: new Uint8Array(message.bytes) }); break;
            case "lost": outbox.push({ kind: KIND.lost, a: 0, b: 0, bytes: new TextEncoder().encode(String(message.reason)) }); break;
            case "caps": outbox.push({ kind: KIND.caps, a: message.present ? 1 : 0, b: 0, bytes: null }); break;
            case "gles_saved":
                outbox.push({ kind: KIND.gles_saved, a: message.id, b: message.state ? 1 : 0, bytes: message.state ? encode_state(message.state) : null });
                break;
        }
        queueMicrotask(flush);
    },
    listen(h) { handler = h; },
};

(async () => {
    try {
        globalThis.renderer = globalThis.V86SVGARenderer(channel, {});
        for(let got = 0; ; got++)
        {
            let bytes;
            for(;;)
            {
                try { bytes = new Uint8Array(await (await fetch("/gles/next?got=" + got)).arrayBuffer()); break; }
                catch(error) { log("next again after " + error); await pause(1000); }
            }
            const view = new DataView(bytes.buffer);
            for(let at = 0; at + 20 <= bytes.length;)
            {
                const kind = view.getUint32(at, true), a = view.getUint32(at + 4, true), stream = view.getUint32(at + 12, true);
                const length = view.getUint32(at + 16, true);
                const body = bytes.slice(at + 20, at + 20 + length);
                at += 20 + (length + 3 & ~3);
                if(kind === KIND.submit) handler({ type: "submit", seq: a, bytes: body, stream: stream === 1 ? "gles" : undefined });
                else if(kind === KIND.reset) handler({ type: "reset" });
                else if(kind === KIND.hello) handler({ type: "hello" });
                else if(kind === KIND.gles_save) handler({ type: "gles_save", id: a });
                else if(kind === KIND.gles_restore) handler({ type: "gles_restore", state: decode_state(body) });
            }
        }
    } catch(error) {
        log(String(error && error.stack || error));
        document.getElementById("result").textContent = "FAIL " + error;
    }
})();
setInterval(() => {
    // (WebGPU's validation errors and a lost device's reason, reported once the device is up)
    const device = globalThis.renderer && globalThis.renderer.executor.device;
    if(device && !device.onuncapturederror)
    {
        device.onuncapturederror = e => log("WebGPU: " + e.error.message);
        device.lost.then(info => log("WebGPU device lost (" + info.reason + "): " + info.message));
    }
    const g = globalThis.renderer && globalThis.renderer.gles;
    if(g && g.stats.errors.length) log("executor errors: " + JSON.stringify(g.stats.errors.splice(0)));
}, 5000);
</script>
