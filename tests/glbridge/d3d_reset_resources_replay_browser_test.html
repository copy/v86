(async()=>{
 /* global TextDecoder */
 "use strict";
 const P=D9WGProtocol,C=P.C,gpu=new D3D9WebGPUExecutor(document.querySelector("canvas"),{strict:true,useShaderWorker:false}),comparisons=[];let metadata,batches=0;
 try{

  async function hash(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),v=>v.toString(16).padStart(2,"0")).join("");}
  const rr=await fetch(referenceName),referenceBytes=new Uint8Array(await rr.arrayBuffer());if(await hash(referenceBytes)!==metadata.referenceSha256)throw Error("Reset reference hash mismatch");const reference=JSON.parse(new TextDecoder().decode(referenceBytes)),e=reference.frame;
  const r=await fetch(prefix+".bin.gz");if(!r.ok)throw Error("Missing Reset capture");const bytes=new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()),view=new DataView(bytes.buffer);if(await hash(bytes)!==metadata.traceSha256)throw Error("Reset trace hash mismatch");

  function color(argb){return[argb&255,argb>>>8&255,argb>>>16&255,argb>>>24];}

  async function observe(owner,device){

   buffer.unmap();buffer.destroy();if(pixels!==e.pixelsPerImage)throw Error("Wrong Reset oracle coverage");comparisons.push({owner,api:frame.api,device,pixels,rawMaximumByteError:rawError,displayMaximumByteError:displayError});
  }
  for(let at=0;at<bytes.length;){const ownerToken=view.getUint32(at,true),flags=view.getUint32(at+4,true),size=view.getUint32(at+8,true);at+=12;if(size<8||size>bytes.length-at||view.getUint16(at,true)!==0xffe1||view.getUint32(at+4,true)!==size-8)throw Error("Invalid Reset carrier");const packet=bytes.subarray(at+8,at+size),pv=new DataView(packet.buffer,packet.byteOffset,packet.byteLength),presents=[];
   for(let x=P.STRUCTS.BatchHeader.size;x<packet.length;){const op=pv.getUint16(x,true),length=pv.getUint32(x+P.F.CommandHeader.size,true);if(length<8||x+length>packet.length)throw Error("Invalid Reset command");if(op===P.OP.PRESENT)presents.push(P.decode("Present",pv,x+P.STRUCTS.CommandHeader.size,length-P.STRUCTS.CommandHeader.size));x+=length;}
   await gpu.submit(packet,{ownerToken,flags,writeGuestMemory(){}});if(presents.length){if(presents.length!==1)throw Error("Multiple Reset frames per batch");await observe(ownerToken,presents[0].device_handle);}at+=size;batches++;
  }

  if(comparisons.length!==2||comparisons.some(c=>c.rawMaximumByteError>1||c.displayMaximumByteError>1)||gpu.stats.commandsFailed||gpu.stats.droppedDraws||gpu.gpuErrors.errors.length||gpu.hostErrors.length)throw Error("GPU Reset resource mismatch "+JSON.stringify(comparisons));
  display.destroy();document.querySelector("#result").textContent="PASS actual XP Reset resources: thirty accepted resets, thirty retired resources, restored default targets and retained managed texture; 4096 raw and 4096 displayed oracle pixels across both APIs";
 }catch(error){await fetch("/__test_file?name=d9wg-reset-resources-guest.json",{method:"POST",body:JSON.stringify({failed:true,error:String(error.stack),comparisons,stats:gpu.stats,gpuErrors:gpu.gpuErrors.errors,hostErrors:gpu.hostErrors},null,2)});document.querySelector("#result").textContent="FAIL "+error.stack;}
