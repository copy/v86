<!doctype html><meta charset="utf-8"><title>D3D shader texture differential</title><pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_shader_pipeline.js"></script>
<script type="module">
import {texture_cases,texel} from "../lib/d3d_shader_texture_cases.mjs";
try {
    const adapter=await navigator.gpu?.requestAdapter();if(!adapter)throw Error("No WebGPU adapter");
    const device=await adapter.requestDevice(),gpuErrors=[],failures=[];let components=0,programs=0;
    device.addEventListener("uncapturederror",event=>gpuErrors.push(event.error.message));
    const vertex=device.createShaderModule({code:`@vertex fn main(@builtin(vertex_index) i:u32)->@builtin(position) vec4<f32> {let p=array<vec2<f32>,3>(vec2<f32>(-1,-1),vec2<f32>(3,-1),vec2<f32>(-1,3));return vec4<f32>(p[i],0,1);}`});
    for(const test of texture_cases()) {
        const translated=D3D9ShaderPipeline.compileShader(test.tokens,test.options);
        if(!translated.ok){failures.push({name:test.name,translation:translated.error});continue;}
        const ref=translated.reflection,start=translated.wgsl.indexOf("fn d9_body() {");let end=translated.wgsl.indexOf("{",start)+1,depth=1;
        for(;depth&&end<translated.wgsl.length;end++){if(translated.wgsl[end]==="{")depth++;if(translated.wgsl[end]==="}")depth--;}
        if(start<0||depth)throw Error("Missing generated body");
        const module=device.createShaderModule({code:translated.wgsl.slice(0,end)+`\n@fragment fn test_main(@builtin(position) p:vec4<f32>)->@location(0) vec4<f32> {${test.init}\nd9_body();return ${test.result||"r0"};}`});
        const errors=(await module.getCompilationInfo()).messages.filter(m=>m.type==="error");
        if(errors.length){failures.push({name:test.name,compile:errors.map(m=>m.message)});continue;}
        device.pushErrorScope("validation");
        const layout=device.createBindGroupLayout({entries:[{binding:1,visibility:GPUShaderStage.FRAGMENT,buffer:{type:"uniform"}},...ref.samplers.flatMap(s=>[{binding:s.textureBinding,visibility:GPUShaderStage.FRAGMENT,texture:{sampleType:"float",viewDimension:s.type==="cube"?"cube":"2d"}},{binding:s.samplerBinding,visibility:GPUShaderStage.FRAGMENT,sampler:{type:"filtering"}}])]});
        const pipeline=await device.createRenderPipelineAsync({layout:device.createPipelineLayout({bindGroupLayouts:[layout]}),vertex:{module:vertex,entryPoint:"main"},fragment:{module,entryPoint:"test_main",targets:[{format:"rgba32float"}]}});
        const data=new ArrayBuffer(ref.uniformBytes),f=new Float32Array(data),ints=new Int32Array(data);
        for(let c=0;c<ref.floatConstCount;c++)f.set(test.f[c]||[0,0,0,0],c*4);
        for(let c=0;c<ref.intConstCount;c++)ints.set(test.i[c]||[0,0,0,0],ref.floatConstCount*4+c*4);
        if(ref.bumpStageCount)for(let s=0;s<ref.bumpStageCount;s++){f.set(test.bump,ref.bumpOffset/4+s*4);f.set(test.luminance,ref.bumpLuminanceOffset/4+s*4);}
        const uniform=device.createBuffer({size:data.byteLength,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(uniform,0,data);
        const entries=[{binding:1,resource:{buffer:uniform}}],textures=[];
        for(const sampler of ref.samplers) {
            const cube=sampler.type==="cube",texture=device.createTexture({size:[8,8,cube?6:1],mipLevelCount:4,format:"rgba16float",usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST});textures.push(texture);
            for(let level=0;level<4;level++)for(let face=0;face<(cube?6:1);face++) {
                const size=8>>level,bytes=new Uint16Array(size*size*4);
                for(let y=0;y<size;y++)for(let x=0;x<size;x++)bytes.set(texel(x,y,level,cube?face:null).map(v=>v===0?0:((Math.floor(Math.log2(v))+15)<<10)+Math.round((v/2**Math.floor(Math.log2(v))-1)*1024)),(y*size+x)*4);
                device.queue.writeTexture({texture,mipLevel:level,origin:[0,0,face]},bytes,{bytesPerRow:size*8},[size,size,1]);
            }
            entries.push({binding:sampler.textureBinding,resource:texture.createView({dimension:cube?"cube":"2d"})},{binding:sampler.samplerBinding,resource:device.createSampler({minFilter:"nearest",magFilter:"nearest",mipmapFilter:"nearest"})});
        }
        const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries});
        const target=device.createTexture({size:[8,8],format:"rgba32float",usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
        const read=device.createBuffer({size:256*8,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
        const encoder=device.createCommandEncoder(),pass=encoder.beginRenderPass({colorAttachments:[{view:target.createView(),loadOp:"clear",storeOp:"store",clearValue:[0,0,0,0]}]});pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.draw(3);pass.end();encoder.copyTextureToBuffer({texture:target},{buffer:read,bytesPerRow:256},[8,8]);device.queue.submit([encoder.finish()]);
        await read.mapAsync(GPUMapMode.READ);const actual=new Float32Array(read.getMappedRange());let differences=0;const examples=[];
        for(let y=0;y<8;y++)for(let x=0;x<8;x++){const expected=test.expected(x,y);for(let c=0;c<4;c++){components++;const value=actual[y*64+x*4+c];if(!Number.isFinite(value)||Math.abs(value-expected[c])>0.00001){differences++;if(examples.length<4)examples.push({x,y,c,actual:value,expected:expected[c]});}}}
        read.unmap();read.destroy();target.destroy();uniform.destroy();for(const texture of textures)texture.destroy();
        const error=await device.popErrorScope();if(error)gpuErrors.push(error.message);
        if(differences)failures.push({name:test.name,differences,examples});programs++;
    }
    const result={programs,components,absoluteTolerance:0.00001,failures,gpuErrors};
    await fetch("/__test_file?name=d3d-shader-textures.json",{method:"POST",body:JSON.stringify(result,null,2)});device.destroy();
    if(failures.length||gpuErrors.length)throw Error(JSON.stringify(result));
    document.querySelector("#result").textContent=`PASS shader texture differential: ${programs} programs, ${components} components`;
}catch(error){document.querySelector("#result").textContent="FAIL "+error.stack;}
</script>
