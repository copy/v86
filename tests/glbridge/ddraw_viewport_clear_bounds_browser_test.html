<script>
(async()=>{
'use strict';let gpu;const P=D9WGProtocol,C=P.C,observations=[],errors=[];window.addEventListener('error',e=>errors.push(String(e.error||e.message)));
const check=(x,m)=>{if(!x)throw Error(m)},cmd=(n,p)=>({opcode:P.OP[n],payload:p});
const clear=(color,z,stencil,bounds,rects=[[0,0,8,8]],flags=7)=>{const parts=[P.encode('Clear',{device_handle:1,clear_flags:flags,color,depth:z,stencil,rect_count:rects.length}),...rects.map(r=>P.encode('Rect',{left:r[0],top:r[1],right:r[2],bottom:r[3]})),...(bounds?[P.encode('ClearBounds',{x:bounds[0],y:bounds[1],width:bounds[2],height:bounds[3]})]:[])];let at=0;const payload=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));for(const p of parts){payload.set(p,at);at+=p.length;}return{opcode:P.OP.CLEAR,flags:bounds?C.D9WG_COMMAND_CLEAR_BOUNDS:0,payload};};
const metadata={ownerToken:85,writeGuestMemory(){}};async function send(commands){await gpu.submit(P.encodeBatch(commands),metadata);await gpu.checkpointIdle();}
async function read(h,format,id){let result=null;await gpu.submit(P.encodeBatch([cmd('READBACK_SURFACE',{device_handle:1,texture_handle:h,format,width:8,height:8,row_count:8,destination_pitch:32,destination_bytes:256,response_offset:C.D9WG_READBACK_REGION_OFFSET,request_id:id})]),{ownerToken:85,writeGuestMemory(address,bytes){if(bytes.length!==272)return;const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);if(v.getUint32(0,true)!==id)return;check(v.getUint32(P.F.ReadbackResponse.status,true)===C.D9WG_RESPONSE_OK,'GPU readback failed');result=Array.from({length:64},(_,i)=>v.getUint32(16+i*4,true));}});await gpu.checkpointIdle();check(result,'Missing readback');return result;}
try{
gpu=new D3D9WebGPUExecutor(document.querySelector('#screen'),{strict:true,useShaderWorker:false});await gpu.initialize();await send([cmd('CREATE_DEVICE',{device_handle:1,width:8,height:8}),cmd('CREATE_TEXTURE_2D',{device_handle:1,resource_handle:2,width:8,height:8,level_count:1,format:21,usage:1}),cmd('CREATE_TEXTURE_2D',{device_handle:1,resource_handle:3,width:8,height:8,level_count:1,format:75,usage:2}),cmd('SET_RENDER_TARGET',{device_handle:1,color_texture_handle:2}),cmd('SET_DEPTH_STENCIL_SURFACE_LEVEL',{device_handle:1,depth_texture_handle:3,width:8,height:8}),cmd('SET_VIEWPORT',{device_handle:1,width:2,height:2,max_z:1}),cmd('SET_SCISSOR_RECT',{device_handle:1,left:0,top:0,right:1,bottom:1}),cmd('SET_RENDER_STATE',{device_handle:1,state:174,value:1})]);
const state=gpu.devices.get(1),snapshot=()=>JSON.stringify({viewport:state.viewport,scissor:state.scissorRect,render:[...state.renderStates]}),before=snapshot();
await send([clear(0xffffffff,1,0,[0,0,8,8]),clear(0xff0000ff,.5,2,[2,2,2,2]),clear(0xff00ff00,.25,3,[4,4,4,4],[[2,2,6,6]])]);
const colors=await read(2,21,1),depth=await read(3,75,2);
for(let y=0;y<8;y++)for(let x=0;x<8;x++){const blue=x>=2&&x<4&&y>=2&&y<4,green=x>=4&&x<6&&y>=4&&y<6,c=blue?0xff0000ff:green?0xff00ff00:0xffffffff,d=blue?0x80000002:green?0x40000003:0xffffff00;check(colors[y*8+x]===c,'Caller viewport color '+x+','+y);check(depth[y*8+x]===d,'Caller viewport depth/stencil '+x+','+y+' '+depth[y*8+x].toString(16));}
observations.push({name:'Caller viewport clips color/depth/stencil independently',colors,depth});check(snapshot()===before,'Caller clear changed public state');
await send([clear(0xffff00ff,0,7,[8,8,0,0]),clear(0xffff00ff,0,7,[0xffffffff,0xffffffff,0xffffffff,0xffffffff])]);check(JSON.stringify(await read(2,21,3))===JSON.stringify(colors),'Empty/outside viewport changed pixels');
await send([clear(0xffff0000,0,0,null,[[0,0,8,8]],1)]);const regular=await read(2,21,4);for(let i=0;i<64;i++)check(regular[i]===(i===0?0xffff0000:colors[i]),'Ordinary viewport/scissor changed '+i);observations.push({name:'Ordinary clear still uses original viewport/scissor',colors:regular});
check(!gpu.stats.commandsFailed&&!gpu.stats.droppedDraws&&!gpu.stats.renderTargetReadbackFailures&&!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!errors.length,'GPU/host/browser errors');await gpu.endOwnerSessions(85);await gpu.checkpointIdle();await fetch('/__test_file?name=ddraw-clear-bounds.json',{method:'POST',body:JSON.stringify({observations,stats:gpu.stats,gpuErrors:gpu.gpuErrors.errors,hostErrors:gpu.hostErrors,errors},null,2)});document.querySelector('#result').textContent='PASS caller-bound clear: exact64 color+depth/stencil pixels, outside/empty no-op, viewport/scissor preserved and ordinary clear unchanged';
}catch(e){await fetch('/__test_file?name=ddraw-clear-bounds.json',{method:'POST',body:JSON.stringify({failed:true,error:String(e.stack),observations,stats:gpu&&gpu.stats,gpuErrors:gpu&&gpu.gpuErrors.errors,hostErrors:gpu&&gpu.hostErrors,errors},null,2)});document.querySelector('#result').textContent='FAIL '+e.stack;}
})();
</script>
