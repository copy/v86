<script>
(async()=>{
 "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
 try{
  for(const copied of [false,true]){
   const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
   const send=async(s)=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length,"GPU "+JSON.stringify(gpu.gpuErrors.errors.slice(0,2))+" host "+JSON.stringify(gpu.hostErrors));};
   await send(new GLStream().makeCurrent(1,0,0,16,16,1,1).call("VIEWPORT",0,0,16,16).call("COLOR4F",1,0,0,1));
   const draw=async()=>{const s=new GLStream().call("BEGIN",GL.TRIANGLES).call("VERTEX3F",-1,-1,0).call("VERTEX3F",3,-1,0).call("VERTEX3F",-1,3,0).call("END"),r=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await send(s);check(r.view.getUint32(P.F.READ_PIXELS.status,true)===1,"read status");return [...r.bytes.subarray(P.RECORDS.READ_PIXELS.size)];};
   const before=await draw();for(let i=0;i<before.length;i+=4)check(before[i]===255&&before[i+1]===0&&before[i+2]===0&&before[i+3]===255,"red native fixture");
   for(let i=0;i<600;++i)gpu.shaderModule("// cache pressure "+i+"\n@vertex fn vs_main()->@builtin(position) vec4f{return vec4f(0);}");check(gpu.moduleCache.size===512,"module cap");
   const targets=gpu.currentTargets(),mask=gpu.current.stencil.front.writeMask;
   for(let i=0;i<300;++i){gpu.current.stencil.front.writeMask=i;gpu.clearPipeline(targets,true,false,true);}gpu.current.stencil.front.writeMask=mask;
   check(gpu.clearPipelineCache.size<=256&&gpu.pipelineKeyTables.get(gpu.clearPipelineCache).entryCount<=256,"clear pipeline and descriptor cap");
   const sampler={minFilter:GL.NEAREST,magFilter:GL.NEAREST,wrapS:GL.REPEAT,wrapT:GL.REPEAT,wrapR:GL.REPEAT,maxAnisotropy:1,minLod:0,maxLod:10};
   for(let i=0;i<600;++i){sampler.minLod=i/100;gpu.samplerFor({sampler});}check(gpu.samplerCache.size===512,"sampler cap");
   const after=await draw();check(before.every((v,i)=>v===after[i]),"eviction preserves rendering");gpu.flushFrame();await gpu.idle();check(!gpu.stats.refusals,"no refusals");
  }
  document.getElementById("result").textContent="PASS real GPU rendering before and after module/sampler/pipeline descriptor eviction in both modes";
 }catch(error){document.getElementById("result").textContent="FAIL "+String(error.stack||error);}
})();
