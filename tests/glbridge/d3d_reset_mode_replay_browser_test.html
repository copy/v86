<script>
(async () => {
    /* global TextDecoder */
    "use strict";
    const P = D9WGProtocol, C = P.C, gpu = new D3D9WebGPUExecutor(document.querySelector("canvas"), {strict: true, useShaderWorker: false}), comparisons = [];
    let display, batches = 0;
    async function hash(bytes) { return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), v => v.toString(16).padStart(2, "0")).join(""); }
    async function artifact(data) { await fetch("/__test_file?name=d9wg-reset-mode-guest.json", {method: "POST", body: JSON.stringify(data, null, 2)}); }
    try {
        const params = new URLSearchParams(location.search), prefix = params.get("prefix") || "fixtures/d3d_reset_mode_xp", referenceName = params.get("reference") || "fixtures/d3d_reset_mode_reference.json";
        const metadata = await (await fetch(prefix + ".json")).json();
        const referenceBytes = new Uint8Array(await (await fetch(referenceName)).arrayBuffer());
        if (await hash(referenceBytes) !== metadata.referenceSha256) throw Error("Mode reference hash mismatch");
        const reference = JSON.parse(new TextDecoder().decode(referenceBytes));
        const response = await fetch(prefix + ".bin.gz");
        const bytes = new Uint8Array(await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()), view = new DataView(bytes.buffer);
        if (await hash(bytes) !== metadata.traceSha256) throw Error("Mode trace hash mismatch");
        await gpu.initialize();
        display = gpu.device.createTexture({size: [64, 64], format: gpu.format, usage: 0x1 | 0x2 | 0x4 | 0x10});
        const context = gpu.context;
        gpu.context = {configure: options => context.configure(options), unconfigure: () => context.unconfigure(), getCurrentTexture: () => display};
        async function observe(owner, present) {
            const frame = metadata.frames[comparisons.length], {width, height, phase} = frame;
            if (frame.owner !== owner || frame.device !== present.device_handle || present.width !== width || present.height !== height || reference.frames.widths[phase] !== width || reference.frames.heights[phase] !== height) throw Error("Mode frame identity/dimensions mismatch");
            const argb = reference.frames.colors[phase], wanted = [argb & 255, argb >>> 8 & 255, argb >>> 16 & 255, argb >>> 24];
            const payload = P.encode("ReadbackSurface", {device_handle: frame.device, texture_handle: 0, format: 21, width, height, row_count: height, destination_pitch: width * 4, destination_bytes: width * height * 4, response_offset: C.D9WG_READBACK_REGION_OFFSET, request_id: comparisons.length + 1});
            let raw;
            await gpu.onReadbackSurface(payload, new DataView(payload.buffer), 0, payload.length, {writeGuestMemory(at, data) { raw = data.slice(); }});
            if (!raw || raw.length !== 16 + width * height * 4 || new DataView(raw.buffer).getUint32(P.F.ReadbackResponse.status, true) !== C.D9WG_RESPONSE_OK) throw Error("Mode raw readback failed");
            const pitch = Math.ceil(width * 4 / 256) * 256, buffer = gpu.device.createBuffer({size: pitch * height, usage: 0x8 | 0x1}), encoder = gpu.device.createCommandEncoder();
            encoder.copyTextureToBuffer({texture: display}, {buffer, bytesPerRow: pitch, rowsPerImage: height}, [width, height]); gpu.device.queue.submit([encoder.finish()]); await buffer.mapAsync(1);
            const data = new Uint8Array(buffer.getMappedRange()); let rawError = 0, displayError = 0;
            for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) for (let c = 0; c < 4; c++) {
                const channel = gpu.format.startsWith("bgra") ? c : [2, 1, 0, 3][c];
                rawError = Math.max(rawError, Math.abs(raw[16 + (y * width + x) * 4 + c] - wanted[c]));
                displayError = Math.max(displayError, Math.abs(data[y * pitch + x * 4 + c] - wanted[channel]));
            }
            buffer.unmap(); buffer.destroy(); comparisons.push({...frame, pixels: width * height, rawMaximumByteError: rawError, displayMaximumByteError: displayError});
        }
        for (let at = 0; at < bytes.length;) {
            const ownerToken = view.getUint32(at, true), flags = view.getUint32(at + 4, true), size = view.getUint32(at + 8, true); at += 12;
            if (size < 8 || size > bytes.length - at || view.getUint16(at, true) !== 0xffe1 || view.getUint32(at + 4, true) !== size - 8) throw Error("Invalid mode carrier");
            const packet = bytes.subarray(at + 8, at + size), pv = new DataView(packet.buffer, packet.byteOffset, packet.byteLength), presents = [];
            for (let x = P.STRUCTS.BatchHeader.size; x < packet.length;) {
                const op = pv.getUint16(x, true), length = pv.getUint32(x + P.F.CommandHeader.size, true);
                if (length < P.STRUCTS.CommandHeader.size || x + length > packet.length) throw Error("Invalid mode command");
                if (op === P.OP.PRESENT) presents.push(P.decode("Present", pv, x + P.STRUCTS.CommandHeader.size, length - P.STRUCTS.CommandHeader.size)); x += length;
            }
            if (presents.length) {
                if (presents.length !== 1) throw Error("Multiple mode Presents in batch");
                const frame = metadata.frames[comparisons.length]; if (!frame) throw Error("Extra mode frame");
                if (display) display.destroy(); display = gpu.device.createTexture({size: [frame.width, frame.height], format: gpu.format, usage: 0x1 | 0x2 | 0x4 | 0x10});
            }
            await gpu.submit(packet, {ownerToken, flags, writeGuestMemory() {}});
            if (presents.length) await observe(ownerToken, presents[0]); at += size; batches++;
        }
        await gpu.checkpointIdle(); await gpu.device.queue.onSubmittedWorkDone(); for (let i = 0; i < 4; i++) await new Promise(resolve => setTimeout(resolve, 0));
        const pixels = comparisons.reduce((n, c) => n + c.pixels, 0);
        await artifact({traceSha256: metadata.traceSha256, referenceSha256: metadata.referenceSha256, frames: comparisons.length, rawPixels: pixels, displayPixels: pixels, comparisons, batches, stats: gpu.stats, gpuErrors: gpu.gpuErrors.errors, hostErrors: gpu.hostErrors});
        if (comparisons.length !== metadata.frames.length || comparisons.some(c => c.rawMaximumByteError || c.displayMaximumByteError) || gpu.stats.commandsFailed || gpu.stats.droppedDraws || gpu.gpuErrors.errors.length || gpu.hostErrors.length) throw Error("Mode pixel/host mismatch");
        display.destroy(); document.querySelector("#result").textContent = "PASS actual XP Reset mode: " + comparisons.length + " window/fullscreen/constructor/recovery frames, " + pixels + " raw and displayed pixels, zero error";
    } catch (error) {
        await artifact({failed: true, error: String(error.stack), comparisons, stats: gpu.stats, gpuErrors: gpu.gpuErrors.errors, hostErrors: gpu.hostErrors}); document.querySelector("#result").textContent = "FAIL " + error.stack;
    }
})();
