<!doctype html>
<meta charset="utf-8">
<title>GL pixel conformance</title>
<canvas id="gpu" width="64" height="64"></canvas>
<pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/webgpu_host.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_protocol.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_constants.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_caps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_state_layout.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shader_translator.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_fixed_function.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_arb_program.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_math.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_pixel_maps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_image_formats.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_texture_parameters.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_framebuffer_state.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_client_arrays.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_executor.js"></script>
<script src="gl_renderer_diagnostics.js"></script>
<script src="gl_stream_builder.js"></script>
<script src="gl_conformance/scenes.js"></script>
<script src="gl_conformance/to_stream.js"></script>
<script src="gl_conformance/compare.js"></script>
<script src="gl_conformance/oracle_policy.js"></script>
<script src="gl_conformance/known_failures.js"></script>
<script>
// gl_conformance/'s scenes through the executor on the real GPU, against
// Apple's OpenGL 2.1 (gl_conformance/references.json.gz):
//   node tests/glbridge/gl_multipass_browser_runner.js gl_conformance_browser_test.html
// ?only=<scene> runs one scene; ?all=1 lists passing scenes too.
(async () => {
    "use strict";
    const { scenes, SIZE } = GLConformanceScenes;
    const params = new URLSearchParams(location.search);
    const only = params.get("only");
    const lines = [];
    let failed = 0;
    try {
        const mesa = params.get("oracle") === "mesa";
        const response = await fetch(mesa ? "gl_conformance/mesa_reference.json.gz" : "gl_conformance/references.json.gz");
        const references = JSON.parse(await new Response(
            response.body.pipeThrough(new DecompressionStream("gzip"))).text());
        const bytes = base64 => Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        const byName = set => Object.fromEntries(set.scenes.map(scene => [scene.name, { ...scene,
            rgba: bytes(scene.rgba), extra: scene.extra.map(e => ({ ...e, bytes: bytes(e.bytes) })) }]));
        const hw = byName(mesa ? references.pixels : references.hw), sw = byName(mesa ? references.pixels : references.sw);
        let other;
        if (mesa) {
            const response = await fetch("gl_conformance/references.json.gz"), apple = JSON.parse(await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).text());
            other = byName(apple.hw);
        }
        const executor = new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),
            { strict: true, rendererTestDiagnostics: true });
        await executor.initialize();
        const device = executor.device;
        let passed = 0, known = 0;
        for (let i = 0; i < scenes.length; ++i) {
            const scene = scenes[i];
            if (only && scene.name !== only) continue;
            const errorsBefore = executor.gpuErrors.errors.length;
            const hostErrorsBefore = executor.hostErrors.length;
            let got;
            try {
                got = await GLConformanceStream.runScene(executor, scene, i, SIZE);
            } catch (error) {
                got = { exception: String(error && error.stack || error) };
            }
            await device.queue.onSubmittedWorkDone();
            for (let k = 0; k < 4; ++k) await new Promise(resolve => setTimeout(resolve, 0));
            got.validation = [
                ...executor.gpuErrors.errors.slice(errorsBefore).map(e => e.source + ": " + e.message),
                ...executor.hostErrors.slice(hostErrorsBefore).map(e => "host: " + e.message)];
            const alternate = mesa ? GLConformanceOraclePolicy.alternative(scene, sw[scene.name], other[scene.name]) : sw[scene.name];
            const result = GLConformanceCompare.compareScene(scene, hw[scene.name], alternate, got);
            const entry = GLConformanceKnownFailures[scene.name];
            const reason = entry && (entry.reason || entry);
            // a known scene: the whole of it (a string), or only its listed tiles
            const unexpected = entry && entry.tiles ? [...result.other,
                ...result.failedTiles.filter(tile => !entry.tiles.includes(tile)).map(tile => "[" + tile + "]")] : [];
            const fixedTiles = entry && entry.tiles ? entry.tiles.filter(tile => !result.failedTiles.includes(tile)) : [];
            if (entry && (result.verdict === "PASS" || fixedTiles.length)) {
                ++failed;
                lines.push("FIXED " + scene.name + " -- delete " + (fixedTiles.length && result.verdict !== "PASS"
                    ? "tiles " + JSON.stringify(fixedTiles) : "it") + " from known_failures.js (" + reason + ")");
            } else if (unexpected.length) {
                ++failed;
                lines.push("FAIL  " + scene.name + " (known: " + reason + ") also fails: " + unexpected.join("; "));
            } else if (entry) {
                ++known;
                lines.push("known " + scene.name + " (" + reason + ")");
                if (params.get("all")) for (const p of result.problems) lines.push("        " + p);
            } else if (result.verdict !== "PASS") {
                ++failed;
                lines.push("FAIL  " + scene.name + ": " + result.interior + " px, worst " + result.worst);
                for (const p of result.problems) lines.push("        " + p);
            } else {
                ++passed;
                if (params.get("all")) lines.push("ok    " + scene.name);
            }
        }
        document.getElementById("result").textContent = (failed ? "FAIL " + failed + " scene(s)" : "PASS") +
            " -- " + passed + " pass, " + known + " known failures\n" + lines.join("\n");
    } catch (error) {
        document.getElementById("result").textContent = "FAIL exception " + (error && error.stack) + "\n" + lines.join("\n");
    }
})();
</script>
