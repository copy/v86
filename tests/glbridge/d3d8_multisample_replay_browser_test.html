<script>
(async()=>{
 "use strict";
 const P=D9WGProtocol,gpu=new D3D9WebGPUExecutor(document.querySelector("canvas"),{strict:true,useShaderWorker:false}),replies=new Map();
 try{
  const prefix=new URLSearchParams(location.search).get("prefix")||"fixtures/d3d8_multisample_xp",metadata=await(await fetch(prefix+".json")).json();
  async function unpack(name){const r=await fetch(name);if(!r.ok)throw Error("Missing surface fixture "+name);return new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());}
  async function hash(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),v=>v.toString(16).padStart(2,"0")).join("");}
  const bytes=await unpack(prefix+".bin.gz"),expected=await unpack(prefix+"_expected.bin.gz"),view=new DataView(bytes.buffer);if(await hash(bytes)!==metadata.traceSha256||await hash(expected)!==metadata.expectedPixelsSha256)throw Error("Surface copy fixture hash mismatch");
  await gpu.initialize();let at=0,batches=0;
  while(at<bytes.length){const ownerToken=view.getUint32(at,true),flags=view.getUint32(at+4,true),size=view.getUint32(at+8,true);at+=12;if(size<8||size>bytes.length-at||view.getUint16(at,true)!==0xffe1||view.getUint32(at+4,true)!==size-8)throw Error("Invalid surface carrier");await gpu.submit(bytes.subarray(at+8,at+size),{ownerToken,flags,writeGuestMemory(offset,data){
    if(offset!==(16<<20)-P.C.D9WG_RESPONSE_REGION_BYTES+P.C.D9WG_READBACK_REGION_OFFSET)return;
    const v=new DataView(data.buffer,data.byteOffset,data.byteLength),id=v.getUint32(P.F.ReadbackResponse.request_id,true),q=metadata.requests.find(q=>q.request_id===id);if(!q||replies.has(id)||v.getUint32(P.F.ReadbackResponse.status,true)!==P.C.D9WG_RESPONSE_OK||v.getUint32(P.F.ReadbackResponse.byte_count,true)!==q.destination_bytes||data.length!==q.destination_bytes+16)throw Error("Invalid GPU surface reply "+id);
    let maximumByteError=0;for(let b=16;b<data.length;b++)maximumByteError=Math.max(maximumByteError,Math.abs(data[b]-expected[q.expectedOffset+b-16]));replies.set(id,{requestId:id,tag:q.tag,level:q.level,face:q.face,pixels:q.destination_bytes/4,maximumByteError});
   }});at+=size;batches++;}
  await gpu.checkpointIdle();await gpu.device.queue.onSubmittedWorkDone();for(let i=0;i<4;i++)await new Promise(resolve=>setTimeout(resolve,0));

  if(comparisons.some(c=>c.maximumByteError>1)||gpu.stats.commandsFailed||gpu.stats.droppedDraws||gpu.stats.depthTargetSubstitutionsUncleared||gpu.gpuErrors.errors.length||gpu.hostErrors.length)throw Error("GPU D3D8 surface mismatch "+JSON.stringify(comparisons));
  document.querySelector("#result").textContent="PASS actual XP D3D8 MSAA: seventeen real GPU replies / 20480 pixels, alternating NONE/4x, matching explicit depth, repeated create/destroy and unchanged 4x back buffer";
 }catch(error){document.querySelector("#result").textContent="FAIL "+error.stack;}
