<script>
(async()=>{
 const P=D9WGProtocol,C=P.C,fault=new URLSearchParams(location.search).get('fault')||'',gpu=new D3D9WebGPUExecutor(document.querySelector('canvas'),{strict:true,useShaderWorker:false}),W=32,H=32,cmd=(opcode,payload)=>({opcode,payload});

 }catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;}
