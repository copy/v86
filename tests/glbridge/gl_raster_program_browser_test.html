<script>
(async () => {
    "use strict";
    const P = GLProtocol, { GLStream, GL } = GLTestStream, check = (ok, message) => { if (!ok) throw new Error(message); };
    try {
        const compiler = await WebAssembly.compile(await (await fetch("../../bios/glslang.wasm")).arrayBuffer()), reference = (await (await fetch("gl_conformance/raster_program_reference.json")).json()).cases;
        for (const remote of [false, true]) for (const kind of ["glsl", "arb"]) {
            const shadow = new V86GLShadow.GLShadow(), executor = new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"), { strict: true }), memories = new Map();
            await executor.initialize(); shadow.setCapabilities(executor.capabilities()); shadow.setGlslang(new V86GLGlslang.Glslang(compiler));
            let nextBatch = 0;
            shadow.writeResponse = (target, bytes) => memories.get(target.batchId).set(bytes, target.offset);
            executor.options.writeGuestMemory = (offset, bytes, metadata) => memories.get(metadata.batchId).set(bytes, offset + metadata.baseOffset);
            const forward = (bytes, segments, metadata) => {
                for (const segment of segments || [{ offset: 0, length: bytes.length }]) {
                    const part = segment.bytes || bytes.subarray(segment.offset, segment.offset + segment.length);
                    executor.submit(remote ? part.slice() : part, { batchId: metadata.batchId, baseOffset: (metadata.offset || 0) + (segment.bytes ? 0 : segment.offset),
                        onVertexCapture: result => shadow.completeVertexCapture(result) });
                }
            };
            shadow.onCPUResume = forward;
            const submit = async stream => {
                const bytes = stream.bytes(), metadata = { generation: 1, batchId: ++nextBatch, root: true, offset: 0 }; memories.set(metadata.batchId, bytes);
                forward(bytes, shadow.process(bytes, metadata), metadata); await executor.idle();
                check(!shadow.cpuBarrier, "RasterPos submission must finish");
            };
            const setup = GLRasterProgramCases.setup(kind); await submit(setup.stream);
            const location = setup.location ? setup.location.view.getInt32(P.F.QUERY_LOCATION.result, true) : null;
            for (const entry of reference.filter(c => c.name.startsWith(kind))) {
                const phase = GLRasterProgramCases.phase(entry.name, location); await submit(phase.stream);
                GLRasterProgramCases.check(entry, reference, phase.queries, check);
                if (shadow.current.state.values[GL.CURRENT_RASTER_POSITION_VALID][0]) {
                    const current = executor.current.current;
                    check(current.rasterColor.every((n, i) => n === shadow.current.state.values[GL.CURRENT_RASTER_COLOR][i]), entry.name + " backend primary color");
                    check(current.rasterSecondaryColor.every((n, i) => n === shadow.current.state.values[GL.CURRENT_RASTER_SECONDARY_COLOR][i]), entry.name + " backend secondary color");
                    check(current.rasterDistance === shadow.current.state.values[GL.CURRENT_RASTER_DISTANCE][0] && current.rasterTexCoord[7].every((n, i) => n === shadow.current.state.rasterCoords[7][i]), entry.name + " backend fog/texture state");
                }
            }
            for (const mode of [GL.SELECT, GL.FEEDBACK]) {
                const s = new GLStream(); GLSelectionCases.query(s, mode === GL.SELECT ? { operation: 0, size: 32 } : { operation: 1, size: 128, type: GL["3D_COLOR_TEXTURE"] });
                GLSelectionCases.query(s, { operation: 2, type: mode }); s.record(P.GLFN.NAME_COMMAND, P.encodeRecord("NAME_COMMAND", { operation: 2, name: 9 }));
                s.call("DISABLE", GL.CLIP_PLANE0).call("RASTER_POS4F", 0.25, 0.5, 0, 1); if (mode === GL.FEEDBACK) s.bitmap(0, 0, 0, 0, 2, 3);
                const result = GLSelectionCases.query(s, { operation: 2, type: GL.RENDER }); await submit(s);
                check(result.view.getInt32(P.F.QUERY_RENDER_MODE.result, true) === (mode === GL.SELECT ? 1 : 12), kind + " RasterPos selection/feedback count");
                const read = GLSelectionCases.read(result); await submit(read.stream);
                const expected = mode === GL.SELECT ? [1, 2147483648, 2147483648, 9] : [GL.BITMAP_TOKEN, 12, 12, 0.5, 1, 0, 0.5, 1, 1, 2, 3, 4];
                check(expected.every((n, i) => n === read.response.view[mode === GL.SELECT ? "getUint32" : "getFloat32"](44 + i * 4, true)), kind + " RasterPos selection/feedback words");
            }
            const bitmap = new GLStream().call("DISABLE", GL.CLIP_PLANE0).call("WINDOW_POS3F", 3, 4, 0.25).bitmap(1, 1, 0, 0, 0, 0, new Uint8Array([0x80]));
            const pixel = bitmap.readPixels(3, 4, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4); await submit(bitmap);
            check(pixel.view.getUint32(P.F.READ_PIXELS.status, true) === 1 && [64, 128, 191, 255].every((n, i) => Math.abs(n - pixel.bytes[32 + i]) <= 1), kind + " WindowPos/Bitmap pixel");
            check(!shadow.current.error && !executor.hostErrors.length && !executor.gpuErrors.errors.length && !executor.stats.refusals, kind + " host failure");
        }
        document.getElementById("result").textContent = "PASS -- GLSL/ARB RasterPos capture, synchronous CPU getters, clipping, all texture units, fog/secondary state and WindowPos/Bitmap in both modes";
    } catch (error) { document.getElementById("result").textContent = "FAIL " + (error.stack || error); }
})();
</script>
