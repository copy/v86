<script>
(async()=>{
 const P=D9WGProtocol,C=P.C,suite=D3D9Conformance,{cmd,rs,tss,cat,element}=suite.builders;
 const worker=new URLSearchParams(location.search).get('worker')==='1';
 const gpu=new D3D9WebGPUExecutor(document.querySelector('canvas'),{strict:true,useShaderWorker:worker});
 try{
  const data=await fetch('fixtures/ddraw_native_normals.json').then(r=>r.json()),scenes=[];
  for(const expected of data.pixels.filter(r=>r.api===3)){
   const input=data.inputs[expected.matrix],vertices=new Float32Array(input.vertices.flat());
   const body=dev=>[
    rs(dev,7,0),rs(dev,22,1),rs(dev,28,0),rs(dev,137,1),rs(dev,141,0),rs(dev,143,expected.normalize),rs(dev,29,0),rs(dev,139,0),
    tss(dev,0,1,2),tss(dev,0,2,0),tss(dev,0,4,2),tss(dev,0,5,0),
    cmd(P.OP.SET_TRANSFORM,P.encode('SetTransform',{device_handle:dev,state:2,matrix:input.view})),
    cmd(P.OP.SET_TRANSFORM,P.encode('SetTransform',{device_handle:dev,state:256,matrix:input.world})),
    cmd(P.OP.SET_MATERIAL,P.encode('SetMaterial',{device_handle:dev,diffuse:[0,0,1,1],ambient:[0,0,0,0],specular:[0,0,0,0],emissive:[0,0,0,0],power:30})),
    cmd(P.OP.SET_LIGHT,P.encode('SetLight',{device_handle:dev,index:0,type:3,diffuse:[1,1,1,0],specular:[0,0,0,0],ambient:[0,0,0,0],position:[0,0,0],direction:[0,0,1],range:100})),
    cmd(P.OP.LIGHT_ENABLE,P.encode('LightEnable',{device_handle:dev,index:0,enable:1})),
    cmd(P.OP.SET_FVF,cat([P.encode('SetFVF',{device_handle:dev,fvf:0x12,element_count:2}),element(0,2,0),element(12,2,3)])),
    cmd(P.OP.DRAW_PRIMITIVE_UP,P.encode('DrawPrimitiveUP',{device_handle:dev,primitive_type:5,primitive_count:2,stride:24,vertex_count:4,vertex_bytes:vertices.byteLength}),[{offsetField:'vertex_data_offset',data:new Uint8Array(vertices.buffer)}])
   ];
   const index=scenes.length,batch=suite.caseBatch(index,{behaviorFlags:C.D9WG_DEVICE_LEGACY_LIGHTING,clear:0xffab4e69,body});
   await gpu.submit(batch.bytes,{writeGuestMemory(){}});
   if(!gpu.devices.get(batch.dev).legacyLighting)throw Error('Legacy CreateDevice flag was lost');
   let reply;await gpu.submit(suite.readbackBatch(index+1,batch.dev,batch.rt),{writeGuestMemory(offset,bytes){if(offset===(16<<20)-C.D9WG_RESPONSE_REGION_BYTES+C.D9WG_READBACK_REGION_OFFSET)reply=bytes.slice();}});
   if(!reply||reply.length!==16+64*64*4||new DataView(reply.buffer,reply.byteOffset,reply.byteLength).getUint32(P.F.ReadbackResponse.status,true)!==C.D9WG_RESPONSE_OK)throw Error('Missing pixel readback');
   reply=reply.subarray(16);
   const actual=new DataView(reply.buffer,reply.byteOffset,reply.byteLength).getUint32((32*64+32)*4,true),wanted=expected.color;
   let error=0;for(let shift=0;shift<24;shift+=8)error=Math.max(error,Math.abs(((actual>>>shift)&255)-((wanted>>>shift)&255)));
   const pixelView=new DataView(reply.buffer,reply.byteOffset,reply.byteLength),coverage=[];for(let y=0;y<64;y++)for(let x=0;x<64;x++)if((pixelView.getUint32((y*64+x)*4,true)&0xffffff)!==0xab4e69)coverage.push([x,y]);
   scenes.push({matrix:expected.matrix,normalize:expected.normalize,expected:wanted,actual,error,covered:coverage.length,bounds:coverage.length?[Math.min(...coverage.map(p=>p[0])),Math.min(...coverage.map(p=>p[1])),Math.max(...coverage.map(p=>p[0])),Math.max(...coverage.map(p=>p[1]))]:null});
   await gpu.submit(suite.endCaseBatch(index+1),{writeGuestMemory(){}});
  }
  await gpu.device.queue.onSubmittedWorkDone();for(let i=0;i<4;i++)await new Promise(r=>setTimeout(r,0));
  const evidence={worker,sourceSha256:data.sourceSha256,scenes,stats:gpu.stats,gpuErrors:gpu.gpuErrors.errors,hostErrors:gpu.hostErrors};
  await fetch('/__test_file?name=ddraw-native-normals-gpu'+(worker?'-worker':'')+'.json',{method:'POST',body:JSON.stringify(evidence,null,2)});
  if(scenes.length!==26||scenes.some(r=>r.error>1)||gpu.gpuErrors.errors.length||gpu.hostErrors.length||gpu.stats.commandsFailed||gpu.stats.droppedDraws)throw Error('Native legacy normal mismatch: '+JSON.stringify(evidence));
  document.querySelector('#result').textContent='PASS native DDraw lighting: 26 RGB pixel references, singular/projective/scale/shear/view matrices and ignored legacy normalization, no GPU or host errors';
 }catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;}
})();
</script>
