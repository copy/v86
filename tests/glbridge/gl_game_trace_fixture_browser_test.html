<script>
(async()=>{
 "use strict";try{
  const {GLStream,GL}=GLTestStream,gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();
  gpu.submit(new GLStream().makeCurrent(1,0,0,16,16,1,1).call("VIEWPORT",0,0,16,16).bytes(),{});
  const checkpoint=await gpu.saveSnapshot(),frames=Array.from({length:64},()=>[new GLStream().call("COLOR4F",1,0,0,1).call("BEGIN",GL.TRIANGLES).call("VERTEX3F",-1,-1,0).call("VERTEX3F",3,-1,0).call("VERTEX3F",-1,3,0).call("END").bytes()]),
   gzip=async blob=>new Response(blob.stream().pipeThrough(new CompressionStream("gzip"))).blob(),output=(name,body)=>fetch("/__test_file?name="+name,{method:"POST",body}),pixels=new Uint8Array(1024);
  for(let i=0;i<1024;i+=4)pixels.set([255,0,0,255],i);
  const expectedPixelsSha256=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",pixels)),v=>v.toString(16).padStart(2,"0")).join("");
  await output("trace-fixture-checkpoint.bin.gz",await gzip(new Blob([checkpoint])));await output("trace-fixture-trace.bin.gz",await gzip(GLGameTrace.encode(frames)));
  await output("trace-fixture-trace.json",JSON.stringify({frames:64,checkpoint:"trace-fixture-checkpoint.bin.gz",trace:"trace-fixture-trace.bin.gz",expectedPixelsSha256}));
  document.getElementById("result").textContent="PASS portable GPU trace fixture";
 }catch(error){document.getElementById("result").textContent="FAIL "+String(error.stack||error);}
})();
</script>
