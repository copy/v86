<script>
(async()=>{
    "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const reference=await(await fetch("gl_conformance/sampling_levels_reference.json")).json();
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();cpu.setCapabilities(gpu.capabilities());
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            for(const entry of reference.cases){
                const s=GLSamplingLevelsCases.scene(new GLStream().makeCurrent(1,0,0,16,16,1,1),entry.name),p=s.readPixels(0,0,1,1,GL.RGBA,GL.UNSIGNED_BYTE,4),memory=s.bytes(),segments=cpu.process(memory);
                for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}
                await gpu.idle();check(!cpu.current.error,entry.name+" CPU error "+cpu.current.error);check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" status");
                const actual=Array.from(p.bytes.subarray(P.RECORDS.READ_PIXELS.size));check(entry.rgba.every((v,i)=>v===actual[i]),entry.name+": "+actual+" expected "+entry.rgba);
            }
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS texture completeness: nonzero/missing base, bounded mip range, zero image, non-mip base/max and FBO levels in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
