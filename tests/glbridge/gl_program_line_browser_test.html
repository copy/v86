<script>
(async()=>{
    "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const apple=await(await fetch("gl_conformance/program_line_reference.json")).json(),archive=await(await fetch("gl_conformance/mesa_reference.json.gz")).blob(),reference=(await new Response(archive.stream().pipeThrough(new DecompressionStream("gzip"))).json()).fixtures.program_line,module=await WebAssembly.compile(await(await fetch("../../bios/glslang.wasm")).arrayBuffer());
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();gpu.flushThreshold=4;cpu.setCapabilities(gpu.capabilities());cpu.setGlslang(new V86GLGlslang.Glslang(module));
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            const submit=async s=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,"CPU error "+cpu.current.error);};
            for(const [i,entry] of GLProgramLineCases.cases.entries()){
                const s=GLProgramLineCases.setup(new GLStream().makeCurrent(1,0,0,16,16,i+1,i+1),entry);GLProgramLineCases.draw(s,entry);
                const p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await submit(s);check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" read status");
                const actual=p.bytes.subarray(P.RECORDS.READ_PIXELS.size),expected=entry.polygon&&entry.stipple?reference.cases[i].loopPixels:(entry.crossW?apple.cases[i]:reference.cases[i]).pixels;
                const mismatch=[];for(let c=0;c<actual.length;c++)if(Math.abs(actual[c]-expected[c])>1)mismatch.push(c+":"+actual[c]+"/"+expected[c]);
                check(!mismatch.length,entry.name+" "+mismatch.slice(0,16)+" total "+mismatch.length+" GPU "+JSON.stringify(gpu.gpuErrors.errors)+" host "+JSON.stringify(gpu.hostErrors));
            }
            {
                const entry=GLProgramLineCases.cases.find(c=>c.name==="glsl_wide_stipple"),s=GLProgramLineCases.setup(new GLStream().makeCurrent(1,0,0,16,16,1000,1000),entry).call("LINE_STIPPLE",1,15).call("VIEWPORT",0,0,16,16).call("CLEAR_COLOR",0,0,0,1).call("CLEAR",GL.COLOR_BUFFER_BIT).call("COLOR4F",0,1,0,1).call("BEGIN",GL.LINES);
                for(const y of [-0.4375,0.3125])s.call("VERTEX4F",-0.4375,y,0,1).call("VERTEX4F",0.5625,y,0,1);s.call("END");const p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await submit(s);
                const pixels=p.bytes.subarray(P.RECORDS.READ_PIXELS.size);for(let y=0;y<16;y++)for(let x=0;x<16;x++){const on=(y>=2&&y<=5||y>=8&&y<=11)&&x>=8&&x<=11;check(pixels[(y*16+x)*4+1]===(on?255:0),"independent line stipple restart "+x+","+y);}
            }
            {
                // Diagnostic-only copy usage lets the test inspect GPU prefix
                // results; ordinary rendering keeps these buffers GPU-only.
                const count=600,data=new Float32Array((count+1)*4);for(let i=0;i<=count;i++)data.set([i%2?0.125:0,0,0,1],i*4);
                const cpuData={count:count+1,stride:4,data,layout:[{location:0,components:4,offsetFloats:0}]},segments=Array.from({length:count},(_,i)=>({a:i,b:i+1,restart:i===0||i===300})),create=gpu.createGPUBuffer;
                gpu.createGPUBuffer=function(descriptor){return create.call(this,descriptor.label==="GL line distances"?{...descriptor,usage:descriptor.usage|GPUBufferUsage.COPY_SRC}:descriptor);};
                let result;try{result=gpu.captureLineDistances(cpuData,segments);}finally{gpu.createGPUBuffer=create;}
                const read=gpu.device.createBuffer({size:count*16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});gpu.ensureEncoder().copyBufferToBuffer(result,0,read,0,count*16);gpu.flushFrame();await gpu.idle();await read.mapAsync(GPUMapMode.READ);
                const values=new Float32Array(read.getMappedRange());for(const i of [0,255,256,299,300,511,512,599])check(values[i*4+3]===(i<300?i:i-300),"GPU prefix carry/restart "+i+": "+values[i*4+3]);read.unmap();read.destroy();gpu.retire(result);gpu.flushFrame();await gpu.idle();
            }
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS programmable lines: width replication, continuous stipple, flat outputs, indexed/VBO and clipping in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
