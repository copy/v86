<!doctype html>
<meta charset="utf-8">
<title>GL WebGPU browser test</title>
<canvas id="gpu" width="96" height="64"></canvas>
<pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/webgpu_host.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_protocol.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_constants.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_caps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_state_layout.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shader_translator.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_cache_keys.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_fixed_function.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_arb_program.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_math.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_pixel_maps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_image_formats.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_texture_parameters.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_framebuffer_state.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_client_arrays.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_program_geometry.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_polygon_clip.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_single_sample.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_bind_layouts.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_executor.js"></script>
<script>
(async () => {
    const C = GLWGConstants;
    const GL = C.GL;
    const records = [];
    function record(opcode, payload) {
        payload = payload || new Uint8Array(0);
        const extended = payload.byteLength > 0xfffe;
        const result = new Uint8Array((extended ? 8 : 4) + payload.byteLength);
        const view = new DataView(result.buffer);
        view.setUint16(0, opcode, true);
        view.setUint16(2, extended ? 0xffff : payload.byteLength, true);
        if (extended) view.setUint32(4, payload.byteLength, true);
        result.set(payload, extended ? 8 : 4);
        records.push(result);
    }
    function call(name, ...args) {
        const types = GLProtocol.SIGNATURES[name][1];
        const payload = new Uint8Array(GLProtocol.payloadBytes(types));
        const view = new DataView(payload.buffer);
        let at = 0;
        for (let i = 0; i < types.length; ++i) {
            const value = args[i] === undefined ? 0 : args[i];
            if (types[i] === "i") view.setInt32(at, value | 0, true);
            else if (types[i] === "u") view.setUint32(at, value >>> 0, true);
            else if (types[i] === "f") view.setFloat32(at, value, true);
            else { view.setFloat64(at, value, true); at += 4; }
            at += 4;
        }
        record(C.GLFN[name], payload);
    }
    // format: the window's pixel format (V86GL_FORMAT_*)
    function makeCurrent(format) {
        const payload = new Uint8Array(32);
        const view = new DataView(payload.buffer);
        view.setUint32(0, 1, true);
        view.setUint32(12, 96, true);
        view.setUint32(16, 64, true);
        view.setUint32(28, format, true);
        record(C.CTRL.MAKE_CURRENT, payload);
    }
    function drawPixels() {
        const pixels = new Uint8Array(4 * 4 * 4);
        for (let i = 0; i < pixels.length; i += 4)
            pixels.set([255, 64, 16, 255], i);
        const payload = new Uint8Array(20 + pixels.byteLength);
        const view = new DataView(payload.buffer);
        view.setInt32(0, 4, true);
        view.setInt32(4, 4, true);
        view.setUint32(8, GL.RGBA, true);
        view.setUint32(12, GL.UNSIGNED_BYTE, true);
        view.setUint32(16, pixels.byteLength, true);
        payload.set(pixels, 20);
        record(C.GLFN.DRAW_PIXELS, payload);
    }
    function concat() {
        const length = records.reduce((sum, item) => sum + item.byteLength, 0);
        const bytes = new Uint8Array(length);
        let at = 0;
        for (const item of records) { bytes.set(item, at); at += item.byteLength; }
        return bytes;
    }

    // a plain window, then a multisampled one (D-06): the same frame, no
    // validation error, and the multisampled one resolved into what is read
    const runs = [];
    for (const format of [0, 4 << GLProtocol.C.V86GL_FORMAT_SAMPLES_SHIFT]) {
        records.length = 0;
        makeCurrent(format);
        call("CLEAR_COLOR", 0.08, 0.12, 0.2, 1);
        call("CLEAR", GL.COLOR_BUFFER_BIT | GL.DEPTH_BUFFER_BIT);
        call("ENABLE", GL.COLOR_LOGIC_OP);
        call("LOGIC_OP", GL.XOR);
        call("BEGIN", GL.TRIANGLES);
        call("COLOR4F", 1, 0.2, 0.1, 1);
        call("VERTEX3F", -0.8, -0.7, 0);
        call("VERTEX3F", 0.8, -0.7, 0);
        call("VERTEX3F", 0, 0.8, 0);
        call("END");
        call("DISABLE", GL.COLOR_LOGIC_OP);
        call("CLEAR_ACCUM", 0, 0, 0, 0);
        call("CLEAR", GL.ACCUM_BUFFER_BIT);
        call("ACCUM", 0x0101, 1); // GL_LOAD
        call("ACCUM", 0x0103, 0.5); // GL_MULT
        call("ACCUM", 0x0104, 0.1); // GL_ADD
        call("ACCUM", 0x0102, 1); // GL_RETURN
        call("WINDOW_POS3F", 6, 6, 0);
        drawPixels();
        call("ENABLE", GL.SCISSOR_TEST);
        call("SCISSOR", 80, 50, 8, 8);
        call("CLEAR", GL.COLOR_BUFFER_BIT);
        call("DISABLE", GL.SCISSOR_TEST);

        const executor = new GLWebGPUExecutorModule.GLWebGPUExecutor(
            document.getElementById("gpu"));
        await executor.initialize();
        const errors = [];
        executor.device.addEventListener("uncapturederror", event =>
            errors.push(String(event.error && event.error.message || event.error)));
        executor.device.pushErrorScope("validation");
        executor.submit(concat(), {});
        executor.onSwapBuffers();
        await executor.device.queue.onSubmittedWorkDone();
        const scoped = await executor.device.popErrorScope();
        if (scoped) errors.push(scoped.message);
        const stats = executor.getStats();
        if (errors.length || stats.refusals || stats.draws !== 2)
            throw new Error(JSON.stringify({ format, errors, stats }));
        runs.push({ format, draws: stats.draws, pipelines: stats.pipelines });
    }
    document.getElementById("result").textContent = "PASS " + JSON.stringify(runs);
    document.title = "PASS gl_webgpu_browser_test";
})().catch(error => {
    document.getElementById("result").textContent = "FAIL " + error.stack;
    document.title = "FAIL gl_webgpu_browser_test";
    console.error(error);
});
</script>
