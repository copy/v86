<script>
(async()=>{
    "use strict";const {GLStream,GL}=GLTestStream,P=GLProtocol,check=(ok,message)=>{if(!ok)throw new Error(message);};
    try{
        const reference=await(await fetch("gl_conformance/point_raster_reference.json")).json(),module=await WebAssembly.compile(await(await fetch("../../bios/glslang.wasm")).arrayBuffer());
        for(const copied of [false,true]){
            const cpu=new V86GLShadow.GLShadow(),gpu=new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"),{strict:true});await gpu.initialize();gpu.flushThreshold=4;cpu.setCapabilities(gpu.capabilities());cpu.setGlslang(new V86GLGlslang.Glslang(module));
            gpu.options.writeGuestMemory=(at,bytes,metadata)=>metadata.memory.set(bytes,at+metadata.baseOffset);
            let currentCase="";
            const submit=async s=>{const memory=s.bytes(),segments=cpu.process(memory);for(const segment of segments||[{offset:0,length:memory.length}]){const bytes=segment.bytes||memory.subarray(segment.offset,segment.offset+segment.length);gpu.submit(copied?bytes.slice():bytes,{memory,baseOffset:segment.bytes?0:segment.offset});}await gpu.idle();check(!cpu.current.error,currentCase+" CPU error "+cpu.current.error);};
            for(const [i,entry] of GLPointRasterCases.cases.entries()){
                currentCase=entry.name;
                const s=GLPointRasterCases.setup(new GLStream().makeCurrent(1,0,0,16,16,i+1,i+1),entry);GLPointRasterCases.draw(s,entry);
                const p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await submit(s);
                check(p.view.getUint32(P.F.READ_PIXELS.status,true)===1,entry.name+" status");
                const pixels=p.bytes.subarray(P.RECORDS.READ_PIXELS.size),rows=Array.from({length:16},(_,y)=>{let mask=0;for(let x=0;x<16;x++)if(pixels[(y*16+x)*4+1]>128)mask|=1<<x;return mask;});
                check(JSON.stringify(rows)===JSON.stringify(GLPointRasterCases.expected(reference.cases[i])),entry.name+": "+rows+" expected "+reference.cases[i].rows+" host "+JSON.stringify(gpu.hostErrors)+" GPU "+JSON.stringify(gpu.gpuErrors.errors));
                if(entry.name==="arb_program_size"){
                    for(const enabled of [false,true,false]){
                        const alternate={...entry,size:4},s=new GLStream().call(enabled?"ENABLE":"DISABLE",GL.VERTEX_PROGRAM_POINT_SIZE).call("POINT_SIZE",4);GLPointRasterCases.draw(s,alternate);const p=s.readPixels(0,0,16,16,GL.RGBA,GL.UNSIGNED_BYTE,1024);await submit(s);
                        const pixels=p.bytes.subarray(P.RECORDS.READ_PIXELS.size),expected=reference.cases.find(c=>c.name===(enabled?"arb_program_size":"arb_size")).rows;
                        for(let y=0;y<16;y++){let mask=0;for(let x=0;x<16;x++)if(pixels[(y*16+x)*4+1]>128)mask|=1<<x;check(mask===expected[y],"ARB point-size variant "+enabled+" row "+y);}
                    }
                }
            }
            check(!gpu.gpuErrors.errors.length&&!gpu.hostErrors.length&&!gpu.stats.refusals&&!gpu.stats.framesRejected,"host failure "+JSON.stringify(gpu.gpuErrors.errors));gpu.lossHandler();gpu.resetForReplay();
        }
        document.getElementById("result").textContent="PASS aliased point rasterization: all attributes, matrices, rounding, clipping, GLSL/ARB sizes, indexed and polygon points in both modes";
    }catch(error){document.getElementById("result").textContent="FAIL "+error.stack;}
})();
</script>
