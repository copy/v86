<!doctype html><meta charset="utf-8"><title>D9WG pending session uniforms</title><canvas id="screen" width="64" height="64"></canvas><pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/webgpu_host.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_shader_pipeline.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_protocol.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_wire.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_state.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_formats.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_uploads.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_resources.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_surface_ops.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_ffp.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_pipeline_state.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_draw_recorder.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d9wg_frame_replayer.js"></script>
<script src="../../src/browser/glbridge/d3d9-webgpu/d3d9_executor.js"></script>
<script src="d3d9_conformance.js"></script>
<script>
(async () => {
    const P = D9WGProtocol, C = P.C, suite = D3D9Conformance, { cmd, rs, tss, draw, quad } = suite.builders;
    const gpu = new D3D9WebGPUExecutor(document.querySelector("canvas"), { strict: true, shaderWorkerUrl: null });
    const deviceMode = new URLSearchParams(location.search).get("mode") === "device";
    const uploadMode = new URLSearchParams(location.search).get("upload") === "1";
    const evidence = { uploadMode, mode: deviceMode ? "device" : "session", samples: [], expected: [[255, 0, 0, 255], [0, 255, 0, 255]] };
    try {
        await gpu.initialize();
        // Each process uses the same guest handles, layout and uniform offsets.
        // Keep both frames pending before presenting either of them. TFACTOR
        // makes the colour come from the pixel uniform, not vertex bytes.
        const pending = (session, color, index) => {
            const body = dev => {
                if (uploadMode) {
                    const up = draw(dev, quad(0, 0, 64, 64, 0.5, color)), data = up.blobs[0].data, handle = dev + 0x700000;
                    return [cmd(P.OP.CREATE_BUFFER, P.encode("CreateBuffer", { device_handle: dev, resource_handle: handle, resource_kind: 1, byte_count: data.length })),
                        cmd(P.OP.UPDATE_BUFFER, P.encode("UpdateBuffer", { resource_handle: handle, byte_count: data.length }), [{ offsetField: "data_offset", data }]),
                        cmd(P.OP.SET_STREAM_SOURCE, P.encode("SetStreamSource", { device_handle: dev, buffer_handle: handle, stride: 24 })),
                        tss(dev, 0, 1, 2), tss(dev, 0, 2, 0), tss(dev, 0, 4, 2), tss(dev, 0, 5, 0),
                        cmd(P.OP.DRAW_PRIMITIVE, P.encode("DrawPrimitive", { device_handle: dev, primitive_type: 4, primitive_count: 2 }))];
                }
                return [rs(dev, 60, color), tss(dev, 0, 1, 2), tss(dev, 0, 2, 3), tss(dev, 0, 4, 2), tss(dev, 0, 5, 3),
                    draw(dev, quad(0, 0, 64, 64, 0.5, 0xffffffff))];
            };
            const original = suite.caseBatch(index, { backBuffer: true, body });
            const view = new DataView(original.bytes.buffer), commands = [];
            for (let at = P.STRUCTS.BatchHeader.size; at < original.bytes.length;) {
                const header = P.decode("CommandHeader", view, at);
                if (header.opcode !== P.OP.PRESENT) commands.push({ opcode: header.opcode,
                    payload: original.bytes.slice(at + P.STRUCTS.CommandHeader.size, at + header.size) });
                at += header.size;
            }
            return { device: original.dev, bytes: P.encodeBatch(commands, { session_id_low: session }) };
        };
        const sessions = deviceMode ? [0x310003, 0x310003] : [0x310001, 0x310002];
        const frames = [pending(sessions[0], 0xffff0000, 0), pending(sessions[1], 0xff00ff00, deviceMode ? 1 : 0)];
        for (const frame of frames) await gpu.submit(frame.bytes, { writeGuestMemory() {} });
        for (let i = 0; i < frames.length; i++) {
            await gpu.submit(P.encodeBatch([{ opcode: P.OP.PRESENT, payload: { device_handle: frames[i].device,
                hwnd: 0x1234, width: 64, height: 64 } }], { session_id_low: sessions[i], flags: C.D9WG_BATCH_FLAG_PRESENT }), { writeGuestMemory() {} });
            let reply;
            await gpu.submit(suite.readbackBatch(sessions[i], frames[i].device, 0), {
                writeGuestMemory(at, bytes) { if (at === (16 << 20) - C.D9WG_RESPONSE_REGION_BYTES + C.D9WG_READBACK_REGION_OFFSET) reply = bytes.slice(); },
            });
            await gpu.checkpointIdle();
            if (!reply || reply.length !== 16 + 64 * 64 * 4 || new DataView(reply.buffer).getUint32(P.F.ReadbackResponse.status, true) !== C.D9WG_RESPONSE_OK)
                throw new Error("Missing session READBACK");
            const pixels = reply.subarray(16), expected = evidence.expected[i];let different = 0;
            for (let at = 0; at < pixels.length; at += 4)
                if (pixels[at] !== expected[2] || pixels[at + 1] !== expected[1] || pixels[at + 2] !== expected[0] || pixels[at + 3] !== expected[3]) ++different;
            evidence.samples.push({ session: sessions[i], firstRgba: [pixels[2], pixels[1], pixels[0], pixels[3]], differingPixels: different });
        }
        await gpu.device.queue.onSubmittedWorkDone();
        for (let i = 0; i < 4; i++) await new Promise(r => setTimeout(r, 0));
        evidence.stats = gpu.stats;evidence.hostErrors = gpu.hostErrors;evidence.gpuErrors = gpu.gpuErrors.errors;
        const label = new URLSearchParams(location.search).get("label") || "current";
        if (!/^[a-z0-9_-]+$/.test(label)) throw new Error("Invalid evidence label");
        await fetch("/__test_file?name=d9wg-" + (deviceMode ? "device" : "session") + (uploadMode ? "-upload-" : "-uniform-") + label + ".json", { method: "POST", body: JSON.stringify(evidence, null, 2) });
        if (evidence.samples.some(s => s.differingPixels) || gpu.hostErrors.length || gpu.gpuErrors.errors.length || gpu.stats.commandsFailed || gpu.stats.droppedDraws)
            throw new Error("Pending sessions overwrite uniform data: " + JSON.stringify(evidence));
        document.querySelector("#result").textContent = "PASS two pending " + (deviceMode ? "devices" : "sessions") + " preserve all 8192 READBACK pixels and distinct uniform colours";
    } catch (error) { document.querySelector("#result").textContent = "FAIL " + error.stack; }
})();
</script>
