<!doctype html>
<meta charset="utf-8">
<title>GLES executor: GLES 3.0 on WebGPU</title>
<pre id="result">RUNNING</pre>
<script src="../../build/glbridge/libv86-webgpu.js"></script>
<script type="module">
// The GLES executor's GLES 3.0 draws (src/gles/page/gles3_executor.js;
// docs/gles3-plan.md L3) on a real GPU: a GLES 3.0 context's commands
// encoded as the guest's, run first through a CPU side's shadow state with
// glslang (as gles_host.js does: a link's result goes to the page before
// its glLinkProgram), then as batches on the executor, pixels read back:
// - a vertex array object, an instanced array, a uniform block, a matrix
//   uniform, integer attributes, GL's depth range (a negative z drawn);
// - textures: R8, RGBA16F from floats, a 2D array's layer, an unsigned
//   integer texture fetched, a sampler object's filter over the texture's;
// - two draw buffers, glClearBufferfv, glReadBuffer;
// - a depth texture drawn to and sampled by a shadow sampler;
// - indices: a strip with restarts from client memory and from a buffer,
//   a fan from a buffer.
import { encode_command } from "../../src/gles/gles_wire.js";
import { GLES, GLES_MAGIC, GXWriter } from "../../src/graphics_adapters/renderer_protocol.js";
import { GLESShadow } from "../../src/gles/gles_shadow.js";
import { compile_glslang, create_glslang } from "../../src/gles/glslang.js";
import { pack_program } from "../../src/gles/glsl_program.js";
import { read_gles_batch } from "../../src/gles/gles_batch.js";
import { CONFIGS } from "../../src/gles/gles_caps.js";

const result = document.getElementById("result");
const checks = [];
const check = (value, message) => { if(!value) throw new Error(message); checks.push(message); };

(async () => {
    try {
        const adapter = await navigator.gpu.requestAdapter();
        const optional = ["texture-compression-etc2", "texture-compression-astc", "texture-component-swizzle"].filter(f => adapter.features.has(f));
        const device = await adapter.requestDevice({ requiredFeatures: optional });
        checks.push("the adapter's optional features: " + optional.join(", "));
        const errors = [];
        device.onuncapturederror = e => { console.error(e.error.message); errors.push(e.error.message); };
        let executor = new globalThis.V86GLESExecutor.GLESExecutor({ device, layer: null });
        globalThis.glesExecutor = executor;
        globalThis.webgpuErrors = errors;

        // the CPU side: a shadow state with glslang, as the GLES host's
        const glslang = await create_glslang(await compile_glslang(new Uint8Array(await (await fetch("../../bios/glslang.wasm")).arrayBuffer())));
        const cpu = new GLESShadow({ images: new Map(), color_buffers: new Map(), max_version: 30 });
        cpu.glslang = glslang;
        cpu.keep_bytes = true;

        let writer = new GXWriter(GLES_MAGIC);
        let request = 1;
        const answers = new Map();
        let current = 1;
        const call = (name, ret, args) => {
            const bytes = encode_command("gles2:" + name, args);
            const one = new GXWriter(GLES_MAGIC);
            one.command(GLES.COMMAND, [1, ret, bytes.length], bytes);
            const [r] = read_gles_batch(one.finish(), true);
            cpu.given_name = ret;
            const { keep } = cpu.call(current, r.command, r.args);
            cpu.given_name = 0;
            if(keep && (name === "glLinkProgram" || name === "glCreateShaderProgramvAEMU") && cpu.last_link) {
                const packed = pack_program(cpu.last_link);
                writer.command(GLES.PROGRAM_LINK, [1, name === "glLinkProgram" ? args[0] : ret, packed.length], packed);
                cpu.last_link = null;
            }
            // (what only asks or names stays on the CPU side, as gles_host.js's is_query)
            const error = cpu.context(current).error;
            check(keep || /^gl(Get|Is|Gen|MapBufferRange)/.test(name) && !error, name + " is taken (error 0x" + (error || 0).toString(16) + ")");
            checks.pop();
            if(keep) writer.command(GLES.COMMAND, [1, ret, bytes.length], bytes);
        };
        const gl = (name, ...args) => call(name, 0, args);
        const record = (op, ...dwords) => writer.command(op, dwords);
        const run = async () => {
            const bytes = writer.finish();
            await executor.submit(bytes, {
                writeResponse: (offset, data) => {
                    const view = new DataView(data.buffer, data.byteOffset);
                    answers.set(view.getUint32(0, true), view.getUint32(12, true) === 1 ? data.slice(16) : null);
                },
            });
            await device.queue.onSubmittedWorkDone();
            check(!executor.stats.errors.length, "no executor errors: " + executor.stats.errors.join("; "));
            checks.pop();
        };
        const read_pixels = async (x, y, w, h) => {
            const id = request++;
            record(GLES.READ_PIXELS, 1, id, x, y, w, h, 0x1908, 0x1401);
            await run();
            return answers.get(id);
        };
        const pixel = (rgba, w, x, y) => { globalThis.lastPixels = Array.from(rgba || []); return Array.from(rgba.subarray((y * w + x) * 4, (y * w + x) * 4 + 4)); };
        const near = (a, b, tolerance = 3) => a.every((v, i) => Math.abs(v - b[i]) <= tolerance);
        const text = s => new TextEncoder().encode(s + "\0");
        const floats = values => new Uint8Array(new Float32Array(values).buffer);
        const ints = values => new Uint8Array(new Int32Array(values).buffer);
        // (glGen*'s names: each kind's from 1, as both shadows make them)
        const names = new Map();
        const gen = kind => { const name = (names.get(kind) || 0) + 1; names.set(kind, name); gl("glGen" + kind, 1, 4); return name; };
        let shader_name = 100;
        const program = (vs_text, fs_text, varyings) => {
            const vs = shader_name++, fs = shader_name++, p = shader_name++;
            call("glCreateShader", vs, [0x8B31]);
            call("glCreateShader", fs, [0x8B30]);
            gl("glShaderString", vs, text(vs_text), vs_text.length + 1);
            gl("glShaderString", fs, text(fs_text), fs_text.length + 1);
            gl("glCompileShader", vs);
            gl("glCompileShader", fs);
            call("glCreateProgram", p, []);
            gl("glAttachShader", p, vs);
            gl("glAttachShader", p, fs);
            if(varyings) gl("glTransformFeedbackVaryingsAEMU", p, varyings.length, text(varyings.join(";")), varyings.join(";").length + 1, 0x8C8C);
            gl("glLinkProgram", p);
            const info = cpu.context(current).group.objects.get(p).info;
            check(info && info.ok, "linked: " + (info && info.log));
            checks.pop();
            gl("glUseProgram", p);
            return { name: p, at: uniform => info.locations.get(uniform), attribute: a => info.attributes.find(x => x.name === a).location };
        };

        // a GLES 3.0 context on an 8 by 8 window (RGBA8888, depth 24, stencil 8: config 3)
        const W = 8;
        record(GLES.CONTEXT_CREATE, 1, 3, 0, 30);
        record(GLES.SURFACE_CREATE, 2, 3, W, W);
        record(GLES.COLOR_BUFFER_CREATE, 3, W, W, 0x1908);
        record(GLES.SURFACE_COLOR_BUFFER, 2, 3);
        record(GLES.MAKE_CURRENT, 1, 1, 2, 2);
        cpu.create_context(1, 30, 0);
        cpu.make_current(1, { width: W, height: W, config: CONFIGS[3] });

        // ---- a vertex array object; an instanced array; a uniform block; GL's depth
        const quads = program(`#version 300 es
            layout(location = 0) in vec2 position;
            layout(location = 1) in vec4 color;
            layout(location = 2) in vec2 offset;
            layout(location = 3) in ivec2 code;
            uniform mat2 scale;
            uniform float depth;
            out vec4 v_color;
            flat out ivec2 v_code;
            void main() { v_color = color; v_code = code; gl_Position = vec4(scale * position + offset, depth, 1.0); }`, `#version 300 es
            precision mediump float;
            layout(std140) uniform Tint { vec4 tint; float gain; };
            in vec4 v_color;
            flat in ivec2 v_code;
            out vec4 o;
            void main() { o = v_color * tint * gain; if(v_code.x == 7 && v_code.y == -2) o.b = 1.0; }`);
        const vao = gen("VertexArrays");
        gl("glBindVertexArray", vao);
        const vertices = gen("Buffers");
        gl("glBindBuffer", 0x8892, vertices);
        // (a strip: position, color, a byte code each)
        const strip = new ArrayBuffer(4 * 28), sv = new DataView(strip);
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, y], i) => {
            [x, y, 1, 0.5, 0, 1].forEach((v, k) => sv.setFloat32(i * 28 + 4 * k, v, true));
            sv.setInt8(i * 28 + 24, 7);
            sv.setInt8(i * 28 + 25, -2);
        });
        gl("glBufferData", 0x8892, strip.byteLength, new Uint8Array(strip), 0x88E4);
        gl("glEnableVertexAttribArray", 0);
        gl("glVertexAttribPointerOffset", 0, 2, 0x1406, 0, 28, 0);
        gl("glEnableVertexAttribArray", 1);
        gl("glVertexAttribPointerOffset", 1, 4, 0x1406, 0, 28, 8);
        gl("glEnableVertexAttribArray", 3);
        gl("glVertexAttribIPointerOffsetAEMU", 3, 2, 0x1400, 28, 24);
        const instances = gen("Buffers");
        gl("glBindBuffer", 0x8892, instances);
        gl("glBufferData", 0x8892, 16, floats([-0.5, 0, 0.5, 0]), 0x88E4);
        gl("glEnableVertexAttribArray", 2);
        gl("glVertexAttribPointerOffset", 2, 2, 0x1406, 0, 0, 0);
        gl("glVertexAttribDivisor", 2, 1);
        const ubo = gen("Buffers");
        gl("glBindBuffer", 0x8A11, ubo);
        gl("glBufferData", 0x8A11, 32, floats([0.5, 1, 1, 1, 2, 0, 0, 0]), 0x88E4);
        gl("glBindBufferBase", 0x8A11, 0, ubo);
        gl("glUniformMatrix2fv", quads.at("scale"), 1, 0, floats([0.25, 0, 0, 0.25]));
        gl("glUniform1f", quads.at("depth"), 0);
        gl("glClearColor", 0, 0, 0, 1);
        gl("glClear", 0x4000 | 0x0100);
        gl("glDrawArraysInstanced", 5, 0, 4, 2);
        let window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 2, 4), [255, 255, 255, 255]), "instance 0: the vertex array's color through the uniform block, the integer attribute's blue");
        check(near(pixel(window, W, 6, 4), [255, 255, 255, 255]) && near(pixel(window, W, 4, 4), [0, 0, 0, 255]), "instance 1 by its divisor, nothing between");

        // GL's depth: z -0.5 is drawn (WebGPU's own range would clip it), z 0.8 behind z 0.5 fails the test
        gl("glUniformMatrix2fv", quads.at("scale"), 1, 0, floats([4, 0, 0, 4]));
        gl("glEnable", 0x0B71);
        gl("glClear", 0x4000 | 0x0100);
        gl("glUniform1f", quads.at("depth"), 0.5);
        gl("glBufferSubData", 0x8A11, 0, 16, floats([1, 0, 0, 0.5]));
        gl("glDrawArrays", 5, 0, 4);
        gl("glUniform1f", quads.at("depth"), 0.8);
        gl("glBufferSubData", 0x8A11, 0, 16, floats([0, 1, 0, 0.5]));
        gl("glDrawArrays", 5, 0, 4);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 1), [255, 0, 255, 255]), "z 0.8 behind z 0.5: still the first draw (a buffer's new bytes reached the GPU)");
        gl("glUniform1f", quads.at("depth"), -0.5);
        gl("glDrawArrays", 5, 0, 4);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 1), [0, 255, 255, 255]), "z -0.5 in front, drawn: GL's clip space depth");
        gl("glDisable", 0x0B71);
        // a disabled attribute's current value: the context's, set while another vertex array was bound (GLES 3.0 table 6.6)
        gl("glBindVertexArray", 0);
        gl("glVertexAttrib4f", 1, 1, 0.25, 0, 1);
        gl("glBindVertexArray", vao);
        gl("glDisableVertexAttribArray", 1);
        gl("glUniform1f", quads.at("depth"), 0);
        gl("glDrawArrays", 5, 0, 4);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 1), [0, 128, 255, 255]), "a disabled attribute's current value set under another vertex array: " +
            pixel(window, W, 1, 1));
        gl("glEnableVertexAttribArray", 1);
        gl("glBindVertexArray", 0);

        // ---- textures
        const textured = program(`#version 300 es
            layout(location = 0) in vec2 position;
            out vec2 uv;
            void main() { uv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision highp float;
            uniform sampler2D red;
            uniform sampler2D half_floats;
            uniform mediump sampler2DArray layers;
            uniform highp usampler2D counts;
            uniform int which;
            in vec2 uv;
            out vec4 o;
            void main() {
                if(which == 0) o = vec4(texture(red, uv).r, 0.0, 0.0, 1.0);
                else if(which == 1) o = texture(half_floats, uv);
                else if(which == 2) o = texture(layers, vec3(uv, 1.0));
                else o = vec4(float(texelFetch(counts, ivec2(0, 0), 0).r) / 255.0, 0.0, 0.0, 1.0);
            }`);
        const full = floats([-1, -1, 1, -1, -1, 1, 1, 1]);
        gl("glEnableVertexAttribArray", 0);
        gl("glVertexAttribPointerData", 0, 2, 0x1406, 0, 0, full, full.length);
        gl("glDisableVertexAttribArray", 1);
        gl("glDisableVertexAttribArray", 2);
        gl("glDisableVertexAttribArray", 3);
        let next_texture = 1;
        const texture = (unit, target) => { const t = next_texture++; gl("glActiveTexture", 0x84C0 + unit); gl("glBindTexture", target, t); return t; };
        // R8 (2 by 1: 255, 0), nearest; a sampler object on unit 0 makes it linear
        texture(0, 0x0DE1);
        gl("glPixelStorei", 0x0CF5, 1);
        gl("glTexImage2D", 0x0DE1, 0, 0x8229, 2, 1, 0, 0x1903, 0x1401, new Uint8Array([255, 0]));
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        gl("glTexParameteri", 0x0DE1, 0x2800, 0x2600);
        gl("glTexParameteri", 0x0DE1, 0x2802, 0x812F);
        gl("glUniform1i", textured.at("red"), 0);
        // RGBA16F from floats
        texture(1, 0x0DE1);
        gl("glTexImage2D", 0x0DE1, 0, 0x881A, 1, 1, 0, 0x1908, 0x1406, floats([0.25, 0.5, 0.75, 1]));
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        gl("glUniform1i", textured.at("half_floats"), 1);
        // a 2D array of two layers, RGBA8
        texture(2, 0x8C1A);
        gl("glTexImage3D", 0x8C1A, 0, 0x8058, 1, 1, 2, 0, 0x1908, 0x1401, new Uint8Array([255, 0, 0, 255, 0, 0, 255, 255]));
        gl("glTexParameteri", 0x8C1A, 0x2801, 0x2600);
        gl("glUniform1i", textured.at("layers"), 2);
        // R32UI, fetched
        texture(3, 0x0DE1);
        gl("glTexImage2D", 0x0DE1, 0, 0x8236, 1, 1, 0, 0x8D94, 0x1405, ints([128]));
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        gl("glTexParameteri", 0x0DE1, 0x2800, 0x2600);
        gl("glUniform1i", textured.at("counts"), 3);
        const which = async (n, x = 3, y = 4) => {
            gl("glUniform1i", textured.at("which"), n);
            gl("glDrawArrays", 5, 0, 4);
            return pixel(await read_pixels(0, 0, W, W), W, x, y);
        };
        check(near(await which(0, 1), [255, 0, 0, 255]) && near(await which(0, 6), [0, 0, 0, 255]), "R8, nearest");
        const sampler = gen("Samplers");
        gl("glBindSampler", 0, sampler);
        gl("glSamplerParameteri", sampler, 0x2801, 0x2601);
        gl("glSamplerParameteri", sampler, 0x2800, 0x2601);
        gl("glSamplerParameteri", sampler, 0x2802, 0x812F);
        const mid = await which(0, 4);
        check(mid[0] > 64 && mid[0] < 192, "a sampler object's linear filter over the texture's nearest: " + mid);
        gl("glBindSampler", 0, 0);
        check(near(await which(1), [64, 128, 191, 255]), "RGBA16F from floats");
        check(near(await which(2), [0, 0, 255, 255]), "a 2D array's layer 1");
        check(near(await which(3), [128, 0, 0, 255]), "an unsigned integer texture, fetched");
        // an integer texture sampled (texture(), not texelFetch) by both stages, its sampler's REPEAT: coordinate -0.6 of
        // four texels is texel -3, wrapped to 1 (20): not the clamped 0 (10), nor a remainder's -3 (out of the image)
        texture(4, 0x0DE1);
        gl("glTexImage2D", 0x0DE1, 0, 0x8236, 4, 1, 0, 0x8D94, 0x1405, ints([10, 20, 30, 40]));
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        gl("glTexParameteri", 0x0DE1, 0x2800, 0x2600);
        // (and a 2D array's layer 1: 50 to 80)
        texture(5, 0x8C1A);
        gl("glTexImage3D", 0x8C1A, 0, 0x8236, 4, 1, 2, 0, 0x8D94, 0x1405, ints([10, 20, 30, 40, 50, 60, 70, 80]));
        gl("glTexParameteri", 0x8C1A, 0x2801, 0x2600);
        gl("glTexParameteri", 0x8C1A, 0x2800, 0x2600);
        const repeated = program(`#version 300 es
            layout(location = 0) in vec2 position;
            uniform highp usampler2D u;
            out float from_vertex;
            void main() { from_vertex = float(texture(u, vec2(-0.6, 0.5)).r); gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision highp float;
            uniform highp usampler2D u;
            uniform highp usampler2DArray ua;
            in float from_vertex;
            out vec4 o;
            void main() { o = vec4(float(texture(u, vec2(-0.6, 0.5)).r) / 255.0, from_vertex / 255.0, float(texture(ua, vec3(-0.6, 0.5, 1.0)).r) / 255.0, 1.0); }`);
        gl("glUniform1i", repeated.at("u"), 4);
        gl("glUniform1i", repeated.at("ua"), 5);
        gl("glDrawArrays", 5, 0, 4);
        const repeat_pixel = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        check(near(repeat_pixel, [20, 20, 60, 255]), "integer textures sampled where their samplers repeat, in both stages, a 2D array's too: " + repeat_pixel);
        gl("glUseProgram", textured.name);
        // textureSize of a level past the base where the filter takes no mipmaps (the view holds the base alone): 8 by 4 at lod 2 is 2 by 1
        texture(6, 0x0DE1);
        for(let level = 0; level < 4; level++) gl("glTexImage2D", 0x0DE1, level, 0x8058, 8 >> level, Math.max(1, 4 >> level), 0, 0x1908, 0x1401, null);
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        const sized = program(`#version 300 es
            layout(location = 0) in vec2 position;
            uniform highp sampler2D s;
            uniform int lod;
            out vec4 size_color;
            void main() { size_color = vec4(vec2(textureSize(s, lod)) / 255.0, 0.0, 1.0); gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision highp float;
            in vec4 size_color;
            out vec4 o;
            void main() { o = size_color; }`);
        gl("glUniform1i", sized.at("s"), 6);
        gl("glUniform1i", sized.at("lod"), 2);
        gl("glDrawArrays", 5, 0, 4);
        const size_pixel = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        check(near(size_pixel, [2, 1, 0, 255]), "textureSize of level 2 with a filter of no mipmaps: " + size_pixel);
        // atan(y, 0) and tanh past 10, which Chrome's Metal compiler gets wrong: pi/2 (its half, 200 of 255) and 1
        const guarded = program(`#version 300 es
            layout(location = 0) in vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision highp float;
            uniform float y, x, t;
            out vec4 o;
            void main() { vec2 a = atan(vec2(y, -y), vec2(x, x)); o = vec4(a.x / 3.14159265, tanh(t), (a.y / -3.14159265) * tanh(vec2(-t, t)).y, 1.0); }`);
        gl("glUniform1f", guarded.at("y"), 1);
        gl("glUniform1f", guarded.at("x"), 0);
        gl("glUniform1f", guarded.at("t"), 50);
        gl("glDrawArrays", 5, 0, 4);
        const guard_pixel = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        check(near(guard_pixel, [128, 255, 128, 255]), "atan(±1, 0) of vectors is ±pi/2, tanh(50) is 1: " + guard_pixel);
        // a color format GL reads with alpha 1 (RGB8, kept as rgba8unorm): cleared with alpha 0, drawn with alpha 0, read with alpha 1,
        // blitted into RGBA8 with alpha 1
        const rgb_fbo = gen("Framebuffers"), rgba_fbo = gen("Framebuffers");
        const rgb_texture = texture(7, 0x0DE1);
        gl("glTexStorage2D", 0x0DE1, 1, 0x8051, W, W);
        gl("glBindFramebuffer", 0x8D40, rgb_fbo);
        gl("glFramebufferTexture2D", 0x8D40, 0x8CE0, 0x0DE1, rgb_texture, 0);
        gl("glClearBufferfv", 0x1800, 0, floats([0.5, 0, 0, 0]));
        const rgb_cleared = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        const zero_alpha = program(`#version 300 es
            layout(location = 0) in vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision highp float;
            out vec4 o;
            void main() { o = vec4(0.0, 1.0, 0.0, 0.0); }`);
        void zero_alpha;
        gl("glDrawArrays", 5, 0, 4);
        const rgb_drawn = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        const rgba_texture = texture(7, 0x0DE1);
        gl("glTexStorage2D", 0x0DE1, 1, 0x8058, W, W);
        gl("glBindFramebuffer", 0x8D40, rgba_fbo);
        gl("glFramebufferTexture2D", 0x8D40, 0x8CE0, 0x0DE1, rgba_texture, 0);
        gl("glBindFramebuffer", 0x8CA8, rgb_fbo);
        gl("glBlitFramebuffer", 0, 0, W, W, 0, 0, W, W, 0x4000, 0x2600);
        gl("glBindFramebuffer", 0x8CA8, rgba_fbo);
        const rgb_blitted = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        gl("glBindFramebuffer", 0x8D40, 0);
        check(near(rgb_cleared, [128, 0, 0, 255]) && near(rgb_drawn, [0, 255, 0, 255]) && near(rgb_blitted, [0, 255, 0, 255]),
            "RGB8 read with alpha 1, cleared, drawn and blitted: " + [rgb_cleared, rgb_drawn, rgb_blitted].join(" / "));
        // a depth and stencil renderbuffer attached as the stencil alone: no depth buffer, so the depth test passes (depth 0 cleared, LESS)
        const ds_fbo = gen("Framebuffers"), ds_color = gen("Renderbuffers"), ds_rb = gen("Renderbuffers");
        gl("glBindRenderbuffer", 0x8D41, ds_color);
        gl("glRenderbufferStorage", 0x8D41, 0x8058, W, W);
        gl("glBindRenderbuffer", 0x8D41, ds_rb);
        gl("glRenderbufferStorage", 0x8D41, 0x88F0, W, W);
        gl("glBindFramebuffer", 0x8D40, ds_fbo);
        gl("glFramebufferRenderbuffer", 0x8D40, 0x8CE0, 0x8D41, ds_color);
        gl("glFramebufferRenderbuffer", 0x8D40, 0x8D20, 0x8D41, ds_rb);
        gl("glClearBufferfv", 0x1800, 0, floats([0, 0, 1, 1]));

        // RASTERIZER_DISCARD: clears ignored too

        gl("glClear", 0x4000);
        gl("glClearBufferfv", 0x1800, 0, floats([1, 0, 0, 1]));

        check(near(stencil_alone, [0, 255, 0, 0]) && near(pixel(blit_window, W, 1, 3), [0, 0, 255, 255]) && near(pixel(blit_window, W, 6, 3), [0, 255, 0, 0]),
            "the depth test passes with the stencil attached alone; a blit's pixels from outside its source left alone: " +

        gl("glUseProgram", textured.name);
        gl("glUseProgram", textured.name);

        const flat = program(`#version 300 es
            layout(location = 0) in vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es

        // ---- reads of other formats: R32UI, RGB10_A2, sRGB
        const read_as = async (x, y, w, h, format, type) => {

        const formats_fbo = gen("Framebuffers");

        gl("glDrawBuffers", 1, ints([0x8CE0]));
        gl("glReadBuffer", 0x8CE0);
        const attach = (internal) => {

        attach(0x8236);
        gl("glClearBufferuiv", 0x1800, 0, ints([12345, 0, 0, 0]));
        let raw = await read_as(0, 0, 1, 1, 0x8D99, 0x1405);

        raw = await read_as(0, 0, 1, 1, 0x1908, 0x8368);

        check((packed & 1023) === 1023 && Math.abs((packed >>> 10 & 1023) - 511.5) < 2 && (packed >>> 20 & 1023) === 0 && packed >>> 30 === 3,
            "RGB10_A2 read as UNSIGNED_INT_2_10_10_10_REV");
        attach(0x8C43);
        gl("glClearBufferfv", 0x1800, 0, floats([0.5, 0.5, 0.5, 1]));
        check(near(pixel(await read_pixels(0, 0, 4, 4), 4, 2, 2), [188, 188, 188, 255]), "SRGB8_ALPHA8: 0.5 stored encoded");
        gl("glBindFramebuffer", 0x8D40, 0);

        // ---- blits: scaled and flipped, a multisampled resolve, depth
        const blit_source = gen("Framebuffers");
        gl("glBindFramebuffer", 0x8D40, blit_source);
        attach(0x8058);
        gl("glEnable", 0x0C11);
        gl("glScissor", 0, 0, 2, 4);
        gl("glClearBufferfv", 0x1800, 0, floats([1, 0, 0, 1]));
        gl("glScissor", 2, 0, 2, 4);
        gl("glClearBufferfv", 0x1800, 0, floats([0, 1, 0, 1]));
        gl("glDisable", 0x0C11);
        gl("glBindFramebuffer", 0x8CA9, 0);
        gl("glBlitFramebuffer", 0, 0, 4, 4, W, 0, 0, W, 0x4000, 0x2600);
        gl("glBindFramebuffer", 0x8D40, 0);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 1), [0, 255, 0, 255]) && near(pixel(window, W, 6, 6), [255, 0, 0, 255]), "a blit scaled by 2 and flipped in x");
        const ms = gen("Framebuffers");
        gl("glBindFramebuffer", 0x8D40, ms);

        const depth_source = gen("Framebuffers");
        gl("glBindFramebuffer", 0x8D40, depth_source);

        gl("glTexStorage2D", 0x0DE1, 1, 0x88F0, W, W);
        gl("glFramebufferTexture2D", 0x8D40, 0x821A, 0x0DE1, ds, 0);

        gl("glBindBuffer", 0x88EC, 0);
        gl("glDrawArrays", 5, 0, 4);
        check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [200, 200, 200, 255]), "an unpack buffer's mapped bytes (the unmap's), uploaded from it");
        // an ETC2 RGB8 block (differential, red 31 + 2): WebGPU's when the device has it, else decoded
        texture(9, 0x0DE1);
        gl("glCompressedTexImage2D", 0x0DE1, 0, 0x9274, 4, 4, 0, 8, new Uint8Array([0xF8, 0, 0, 0x02, 0, 0, 0, 0]));
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        gl("glDrawArrays", 5, 0, 4);
        check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [255, 2, 2, 255]), "an ETC2 RGB8 block");

        gl("glCompressedTexImage2D", 0x0DE1, 0, 0x9274, 5, 5, 0, 32, new Uint8Array(Array.from({ length: 4 }, () => [0xF8, 0, 0, 0x02, 0, 0, 0, 0]).flat()));
        gl("glDrawArrays", 5, 0, 4);
        check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [255, 2, 2, 255]), "5 by 5 texels of ETC2 RGB8, decoded");
        // TEXTURE_SWIZZLE_R/G/B/A: (green, red, one, zero)
        gl("glTexParameteri", 0x0DE1, 0x8E42, 0x1904);
        gl("glTexParameteri", 0x0DE1, 0x8E43, 0x1903);
        gl("glTexParameteri", 0x0DE1, 0x8E44, 1);
        gl("glTexParameteri", 0x0DE1, 0x8E45, 0);

            check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [2, 255, 255, 0]), "a texture's swizzle");
        }
        gl("glUseProgram", flat.name);

        // ---- indices: restarts, fans
        gl("glUseProgram", flat.name);
        // two quads: x -1 to -0.5 and 0.5 to 1, a strip each
        const two = floats([-1, -1, -0.5, -1, -1, 1, -0.5, 1, 0.5, -1, 1, -1, 0.5, 1, 1, 1]);

            layout(local_size_x = 1) in;

                // (the input's bounds: invocation 0 the left half, 1 the right, of another color)
                float x0 = gl_InvocationID == 0 ? -1.0 : 0.0;
                for (int i = 0; i < 4; i++) {
                    g_color = gl_InvocationID == 0 ? v_color[0] : vec4(1.0, 1.0, 0.0, 1.0);
                    gl_Position = vec4(x0 + (i % 2 == 0 ? 0.0 : 1.0), i < 2 ? -1.0 : 1.0, gl_in[i % 3].gl_Position.z, 1.0);
                    EmitVertex();
                }
                EndPrimitive();
            }`, `#version 320 es
            precision mediump float;
            in vec4 g_color;
            out vec4 o;
            void main() { o = g_color; }`);
        gl("glBindBuffer", 0x8892, quad32);
        gl("glVertexAttribPointerOffset", 0, 2, 0x1406, 0, 0, 0);
        gl("glClear", 0x4000);
        gl("glDrawArrays", 4, 0, 3);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 4), [0, 0, 255, 255]) && near(pixel(window, W, 6, 4), [255, 255, 0, 255]),
            "a geometry shader's two invocations, a strip each");
        // sample variables: a 4x renderbuffer's samples colored by gl_SampleID and gl_SamplePosition, one sample by gl_SampleMask
        const per_sample = program(`#version 320 es
            layout(location = 0) in vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }`, `#version 320 es
            precision highp float;
            uniform int masked;
            out vec4 o;
            void main() {
                o = vec4(float(gl_SampleID) / 3.0, gl_SamplePosition.x, gl_SamplePosition.y, 1.0);
                if (masked == 1) { o = vec4(1.0); gl_SampleMask[0] = 1; }
            }`);
        const ms32 = gen("Framebuffers");
        gl("glBindFramebuffer", 0x8D40, ms32);
        const rb32 = gen("Renderbuffers");
        gl("glBindRenderbuffer", 0x8D41, rb32);
        gl("glRenderbufferStorageMultisample", 0x8D41, 4, 0x8058, W, W);
        gl("glFramebufferRenderbuffer", 0x8D40, 0x8CE0, 0x8D41, rb32);
        gl("glBindBuffer", 0x8892, quad32);
        gl("glVertexAttribPointerOffset", 0, 2, 0x1406, 0, 0, 0);
        const resolved = async masked => {
            gl("glBindFramebuffer", 0x8D40, ms32);
            gl("glUniform1i", per_sample.at("masked"), masked);
            gl("glClearColor", 0, 0, 0, 1);
            gl("glClear", 0x4000);
            gl("glDrawArrays", 5, 0, 4);
            gl("glBindFramebuffer", 0x8CA9, 0);
            gl("glBlitFramebuffer", 0, 0, W, W, 0, 0, W, W, 0x4000, 0x2600);
            gl("glBindFramebuffer", 0x8D40, 0);
            return pixel(await read_pixels(0, 0, W, W), W, 3, 3);
        };
        const averaged = await resolved(0);
        check(near(averaged, [128, 128, 128, 255], 4), "per-sample shading: gl_SampleID and gl_SamplePosition averaged: " + averaged);
        const one = await resolved(1);
        check(near(one, [64, 64, 64, 255], 4), "gl_SampleMask: one sample of four written: " + one);
        // clamp to border: a red texture whose S clamps to a green border, sampled from u -1 to 1
        const bordered = program(`#version 320 es
            layout(location = 0) in vec2 position;
            out vec2 uv;
            void main() { uv = vec2(position.x, 0.5); gl_Position = vec4(position, 0.0, 1.0); }`, `#version 320 es
            precision mediump float;
            uniform sampler2D tex;
            in vec2 uv;
            out vec4 o;
            void main() { o = texture(tex, uv); }`);
        const border_texture = next_texture++;
        gl("glActiveTexture", 0x84C0);
        gl("glBindTexture", 0x0DE1, border_texture);
        gl("glTexImage2D", 0x0DE1, 0, 0x8058, 1, 1, 0, 0x1908, 0x1401, new Uint8Array([255, 0, 0, 255]));
        gl("glTexParameteri", 0x0DE1, 0x2801, 0x2600);
        gl("glTexParameteri", 0x0DE1, 0x2802, 0x812D);
        gl("glTexParameterfv", 0x0DE1, 0x1004, floats([0, 1, 0, 1]));
        gl("glUniform1i", bordered.at("tex"), 0);
        gl("glBindBuffer", 0x8892, quad32);
        gl("glVertexAttribPointerOffset", 0, 2, 0x1406, 0, 0, 0);
        gl("glClear", 0x4000);
        gl("glDrawArrays", 5, 0, 4);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 4), [0, 255, 0, 255]) && near(pixel(window, W, 6, 4), [255, 0, 0, 255]), "clamp to border: the border's green left of u 0");
        // advanced blend equations: MULTIPLY and SCREEN of (1, 0.5, 0, 1) over (0.5, 1, 1, 1)
        const advanced = program(`#version 320 es
            layout(location = 0) in vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }`, `#version 320 es
            precision mediump float;
            layout(blend_support_multiply, blend_support_screen) out;
            layout(location = 0) out vec4 color;
            void main() { color = vec4(1.0, 0.5, 0.0, 1.0); }`);
        void advanced;
        gl("glEnable", 0x0BE2);
        for(const [equation, expected, what] of [[0x9294, [128, 128, 0, 255], "MULTIPLY"], [0x9295, [255, 255, 255, 255], "SCREEN"]]) {
            gl("glClearColor", 0.5, 1, 1, 1);
            gl("glClear", 0x4000);
            gl("glBlendEquation", equation);
            gl("glDrawArrays", 5, 0, 4);
            const got = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
            check(near(got, expected), "an advanced blend equation: " + what + " " + got);
        }
        gl("glBlendEquation", 0x8006);
        gl("glDisable", 0x0BE2);
        // tessellation: a patch of 3 over the window, the control shader's colors and patch output, back faces culled (the
        // winding counterclockwise as the patch's); an outer level of 0 discards the patch
        const tess_shader = (type, source) => {
            const name = shader_name++;
            call("glCreateShader", name, [type]);
            gl("glShaderString", name, text(source), source.length + 1);
            gl("glCompileShader", name);
            return name;
        };
        const tessellated = shader_name++;
        const tess_shaders = [tess_shader(0x8B31, `#version 320 es
            layout(location = 0) in vec2 position;
            out vec4 v_color;
            void main() { v_color = vec4(1.0, 0.0, 0.0, 1.0); gl_Position = vec4(position, 0.0, 1.0); }`), tess_shader(0x8E88, `#version 320 es
            layout(vertices = 3) out;
            in vec4 v_color[];
            out vec4 c_color[];
            patch out vec4 p_tint;
            uniform float level;
            void main() {
                c_color[gl_InvocationID] = v_color[gl_InvocationID];
                gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
                if (gl_InvocationID == 0) {
                    gl_TessLevelOuter[0] = level; gl_TessLevelOuter[1] = level; gl_TessLevelOuter[2] = level; gl_TessLevelInner[0] = level;
                    p_tint = vec4(0.0, 0.5, 0.0, 0.0);
                }
            }`), tess_shader(0x8E87, `#version 320 es
            layout(triangles, equal_spacing, ccw) in;
            in vec4 c_color[];
            patch in vec4 p_tint;
            out vec4 e_color;
            void main() {
                e_color = c_color[0] * gl_TessCoord.x + c_color[1] * gl_TessCoord.y + c_color[2] * gl_TessCoord.z + p_tint;
                gl_Position = gl_in[0].gl_Position * gl_TessCoord.x + gl_in[1].gl_Position * gl_TessCoord.y + gl_in[2].gl_Position * gl_TessCoord.z;
            }`), tess_shader(0x8B30, `#version 320 es
            precision mediump float;
            in vec4 e_color;
            out vec4 o;
            void main() { o = e_color; }`)];
        call("glCreateProgram", tessellated, []);
        for(const name of tess_shaders) gl("glAttachShader", tessellated, name);
        gl("glLinkProgram", tessellated);
        const tess_info = cpu.context(current).group.objects.get(tessellated).info;
        check(tess_info && tess_info.ok, "a program of tessellation shaders links: " + (tess_info && tess_info.log));
        gl("glUseProgram", tessellated);
        const patch32 = gen("Buffers");
        gl("glBindBuffer", 0x8892, patch32);
        const patch_vertices = floats([-1, -1, 3, -1, -1, 3]);
        gl("glBufferData", 0x8892, patch_vertices.length, patch_vertices, 0x88E4);
        gl("glVertexAttribPointerOffset", 0, 2, 0x1406, 0, 0, 0);
        gl("glEnable", 0x0B44);
        for(const [level, expected, what] of [[4, [255, 128, 0, 255], "tessellated, culled as the patch's winding"], [0, [0, 0, 0, 255], "an outer level of 0: no patch"]]) {
            gl("glUniform1f", tess_info.locations.get("level"), level);
            gl("glClearColor", 0, 0, 0, 1);
            gl("glClear", 0x4000);
            gl("glDrawArrays", 0xE, 0, 3);
            const got = pixel(await read_pixels(0, 0, W, W), W, 3, 3);
            check(near(got, expected), "tessellation: " + what + ": " + got);
        }
        gl("glDisable", 0x0B44);
        gl("glBindBuffer", 0x8892, quad32);
        gl("glVertexAttribPointerOffset", 0, 2, 0x1406, 0, 0, 0);
        // struct varyings: a struct of a mat2, a flat struct of an int
        const structs = program(`#version 300 es
            layout(location = 0) in vec2 position;
            struct S { mediump mat2 a; };
            struct T { mediump int b; };
            out S s;
            flat out T t;
            void main() { s.a = mat2(0.25, 0.5, 0.75, 1.0); t.b = 3; gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision mediump float;
            struct S { mediump mat2 a; };
            struct T { mediump int b; };
            in S s;
            flat in T t;
            out vec4 o;
            void main() { o = vec4(s.a[0][0], s.a[0][1], s.a[1][0], t.b == 3 ? 1.0 : 0.0); }`);
        void structs;
        gl("glClear", 0x4000);
        gl("glDrawArrays", 5, 0, 4);
        check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [64, 128, 191, 255]), "struct varyings: a mat2's, a flat int's");
        // the negation of unsigned integers: two's complement
        const negated = program(`#version 300 es
            layout(location = 0) in vec2 position;
            void main() { gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
            precision mediump float;
            uniform highp uint u;
            out vec4 o;
            void main() {
                highp uvec2 r = -uvec2(u, 2u * u);
                // (and % of signed integers, of a vector by a scalar)
                ivec3 m = ivec3(7, 9, 11) % int(u + 3u);
                o = vec4(r.x == 0xFFFFFFFFu ? 1.0 : 0.0, r.y == 0xFFFFFFFEu ? 1.0 : 0.0, m == ivec3(3, 1, 3) ? 1.0 : 0.0, 1.0);
            }`);
        gl("glUniform1ui", negated.at("u"), 1);
        gl("glDrawArrays", 5, 0, 4);
        check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [255, 255, 255, 255]), "an unsigned negation: two's complement; ivec3 % int");
        gl("glBindVertexArray", 0);
        record(GLES.MAKE_CURRENT, 1, 1, 2, 2);
        current = 1;

        // ---- a snapshot of the GLES 3.x contexts, restored on a new executor: buffers the GPU wrote (a dispatch's,
        // transform feedback's), an occlusion query's result, a cube map array, a vertex array of a binding point, a pipeline
        const es3_saved = await executor.save();
        executor = new globalThis.V86GLESExecutor.GLESExecutor({ device, layer: null });
        executor.restore(es3_saved);
        globalThis.glesExecutor = executor;
        const query_read = async q => {
            const id = request++;
            record(GLES.QUERY_READ, 1, id, q);
            await run();
            return new Uint32Array(answers.get(id).slice().buffer)[0];
        };
        check(await query_read(occlusion_queries[0]) === 1 && await query_read(occlusion_queries[1]) === 0, "restored: the occlusion queries' results");
        const restored_feedback = Array.from(new Float32Array((await read_buffer(feedback, 60)).slice().buffer));
        check(restored_feedback.join() === [-1, -1, 1, 2, -2, 3, -1, 1, 2, 6, -1, 3, 1, 2, -2].join(), "restored: the captured buffer: " + restored_feedback);
        record(GLES.MAKE_CURRENT, 1, 6, 2, 2);
        current = 6;
        check(Array.from(new Uint32Array((await read_buffer(data31, 32)).slice().buffer)).join() === "0,2,4,6,8,10,12,14", "restored: a dispatch's storage buffer");
        gl("glBindVertexArray", vao31);
        gl("glBindProgramPipeline", pipeline31);
        gl("glClear", 0x4000);
        gl("glDrawArrays", 5, 0, 4);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 4, 4), [255, 128, 0, 255]) && near(pixel(window, W, 0, 0), [0, 0, 0, 255]),
            "restored: the pipeline, its programs' uniforms, the vertex array's binding point");
        gl("glBindProgramPipeline", 0);
        gl("glBindVertexArray", 0);
        record(GLES.MAKE_CURRENT, 1, 7, 2, 2);
        current = 7;
        gl("glBindVertexArray", vao32);
        gl("glUseProgram", halves.name);
        gl("glClear", 0x4000);
        gl("glDrawArrays", 4, 0, 3);
        window = await read_pixels(0, 0, W, W);
        check(near(pixel(window, W, 1, 4), [0, 0, 255, 255]) && near(pixel(window, W, 6, 4), [255, 255, 0, 255]), "restored: a geometry shader's program");
        gl("glUseProgram", cubes32.name);
        gl("glUniform1i", cubes32.at("which"), 0);
        gl("glDrawArrays", 5, 0, 4);
        check(near(pixel(await read_pixels(0, 0, W, W), W, 3, 3), [0, 0, 255, 255]), "restored: a cube map array's cube 1, +X");
        gl("glBindVertexArray", 0);
        record(GLES.MAKE_CURRENT, 1, 1, 2, 2);
        current = 1;

        check(!errors.length, "no WebGPU validation errors: " + errors.join("; "));
        check(!executor.stats.gles3, "nothing GLES 3.0's left out: " + JSON.stringify(executor.stats.gles3));
        check(!executor.stats.refused, "the page's shadow took what the CPU side took: " + JSON.stringify(executor.stats.refused_by));
        result.textContent = "PASS " + checks.length + " checks\n" + checks.join("\n");
    } catch(error) {
        const executor = globalThis.glesExecutor;
        result.textContent = "FAIL " + (error && error.stack || error) + "\nlast: " + JSON.stringify(globalThis.lastPixels || null) +
            "\nstats: " + JSON.stringify(executor && executor.stats) + "\nwebgpu: " + JSON.stringify(globalThis.webgpuErrors || []) +
            "\npassed: " + checks.join("\n");
    }
})();
</script>
